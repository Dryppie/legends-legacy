<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimoire catalog</title>
<!--
  Local viewer for the Grimoire design system (Phase A of DESIGN_SYSTEM_REPO_MIGRATION_PLAN.md).
  It lists components by group from ../manifest.json and renders each components/<Name>/preview.html
  in a frame, loading tokens.css, components/bundle.css, React and components/bundle.js first, as the
  Claude Design viewer used to. It needs an HTTP server (browsers block fetch() from file://):

    python -m http.server 4600 -d LL/src/Presentation/ll/design-system
    then open http://localhost:4600/catalog/

  Add ?eager to the URL to load every preview at once instead of as you scroll.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&family=Marcellus&display=swap">
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); font-size: var(--text-body); line-height: 1.5; }
  a { color: inherit; }
  .cat { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100%; }
  .cat-side { border-right: 1px solid var(--line); background: var(--folio); overflow-y: auto; padding: var(--space-4) 0 var(--space-8); }
  .cat-brand { padding: 0 var(--space-4) var(--space-3); border-bottom: 1px solid var(--line); margin-bottom: var(--space-2); }
  .cat-brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.375rem; margin: 0; }
  .cat-brand p { margin: var(--space-1) 0 0; color: var(--ink-muted); font-size: var(--text-caption); }
  .cat-search { display: block; width: calc(100% - 2 * var(--space-4)); box-sizing: border-box; margin: var(--space-2) var(--space-4) var(--space-1);
    background: var(--ground); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--radius-control); padding: 6px 8px; font: inherit; }
  .cat-search:focus-visible { outline: 2px solid var(--focus-ring, var(--ink)); outline-offset: 1px; }
  .cat-group { margin: var(--space-3) 0 0; }
  .cat-group h2 { margin: 0; padding: var(--space-1) var(--space-4); font-size: var(--text-label); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
  .cat-group a { display: block; padding: 3px var(--space-4) 3px calc(var(--space-4) + 2px); text-decoration: none; color: var(--ink); border-left: 2px solid transparent; font-size: var(--text-nav); }
  .cat-group a:hover { background: var(--surface-raised, var(--surface)); }
  .cat-group a[aria-current="page"] { border-left-color: var(--gilt); background: var(--surface); }
  .cat-main { overflow-y: auto; }
  .cat-page { padding: var(--space-6) var(--space-8) var(--space-16); max-width: 1640px; }
  .cat-section { margin: 0 0 var(--space-10); }
  .cat-section > h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; margin: 0 0 var(--space-4); padding-bottom: var(--space-2); border-bottom: 1px solid var(--line); }
  .cat-card { margin: 0 0 var(--space-8); }
  .cat-card header { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-2); }
  .cat-card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.125rem; }
  .cat-card h3 a { text-decoration: none; }
  .cat-card h3 a:hover { text-decoration: underline; }
  .cat-card .sum { color: var(--ink-muted); }
  .cat-card .dims { margin-left: auto; color: var(--ink-muted); font-family: var(--font-numeral); font-size: var(--text-caption); }
  .cat-card .sub { margin: 0 0 var(--space-2); color: var(--ink-muted); font-size: var(--text-caption); max-width: 90ch; }
  .frame-wrap { position: relative; border: 1px solid var(--line); background: var(--ground); overflow: hidden; }
  .frame-wrap iframe { display: block; border: 0; transform-origin: 0 0; background: var(--ground); }
  .frame-wrap .wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-muted); font-size: var(--text-caption); }
  .frame-wrap.loaded .wait { display: none; }
  .cat-error { border: 1px solid var(--danger, #c55); padding: var(--space-4); max-width: 70ch; }
  .md { max-width: 92ch; }
  .md h1, .md h2, .md h3 { font-family: var(--font-display); font-weight: 400; }
  .md h1 { font-size: 1.75rem; } .md h2 { font-size: 1.375rem; margin-top: var(--space-8); } .md h3 { font-size: 1.125rem; margin-top: var(--space-6); }
  .md h4 { font-size: 1rem; margin-top: var(--space-5); }
  .md code { font-family: ui-monospace, Consolas, monospace; font-size: 0.85em; background: var(--surface); padding: 1px 4px; border-radius: var(--radius-container); }
  .md pre { background: var(--surface); border: 1px solid var(--line); padding: var(--space-3); overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; margin: var(--space-3) 0; font-size: 0.875rem; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .md th { background: var(--surface); }
  .md blockquote { margin: var(--space-3) 0; padding-left: var(--space-3); border-left: 2px solid var(--line-strong); color: var(--ink-muted); }
  .md img { max-width: 100%; }
  .crumbs { color: var(--ink-muted); font-size: var(--text-caption); margin-bottom: var(--space-3); }
  .crumbs a { color: var(--ink-muted); }
  @media (max-width: 800px) {
    .cat { grid-template-columns: 1fr; height: auto; }
    .cat-side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
    .cat-page { padding: var(--space-4); }
  }
</style>
</head>
<body>
<div class="cat">
  <nav class="cat-side" aria-label="Catalog">
    <div class="cat-brand"><h1>Grimoire</h1><p id="cat-meta">Legend's Legacy design system</p></div>
    <input class="cat-search" id="cat-search" type="search" placeholder="Filter" aria-label="Filter components and pages">
    <div id="cat-nav"></div>
  </nav>
  <main class="cat-main" id="cat-main"><div class="cat-page" id="cat-page">Loading…</div></main>
</div>
<script>
(function () {
  'use strict';
  var ROOT = new URL('../', location.href).href;          // design-system/
  var EAGER = /[?&]eager\b/.test(location.search);
  // Previews that exist as components/<Name>/preview.html but are not listed in manifest.json.
  var EXTRA = [{ name: 'Cover', group: 'Cover', summary: 'The design system’s cover card.' }];
  var GROUP_ORDER = ['Cover', 'Foundations', 'Standards', 'Shell', 'Components · Containers', 'Components · Actions & input',
    'Components · Lists & labels', 'Components · Data', 'Components · Type & ornament',
    'Game Components · Character', 'Game Components · Items & economy', 'Patterns', 'Page Archetypes'];
  var INJECT = ['tokens.css', 'components/bundle.css', 'components/lib/react.production.min.js',
    'components/lib/react-dom.production.min.js', 'components/bundle.js'];

  var state = { components: [], groups: [], docs: [], previews: {} };
  var $page = document.getElementById('cat-page');
  var $nav = document.getElementById('cat-nav');

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function get(path, as) {
    return fetch(ROOT + path, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(path + ': HTTP ' + r.status);
      return as === 'json' ? r.json() : r.text();
    });
  }

  // ---- @dsCard ----------------------------------------------------------------
  function parseCard(html) {
    var m = html.match(/<!--\s*@dsCard\b([\s\S]*?)-->/);
    var card = {};
    if (!m) return card;
    var re = /([\w-]+)(?:=(?:"([^"]*)"|([^\s"]+)))?/g, a;
    while ((a = re.exec(m[1]))) {
      var v = a[2] !== undefined ? a[2] : a[3] !== undefined ? a[3] : true;
      if (typeof v === 'string' && /^\d+$/.test(v)) v = +v;
      card[a[1]] = v;
    }
    return card;
  }
  function loadPreview(name) {
    if (!state.previews[name]) {
      state.previews[name] = get('components/' + name + '/preview.html').then(function (html) {
        return { html: html, card: parseCard(html) };
      });
    }
    return state.previews[name];
  }
  function buildDoc(name, html) {
    var base = ROOT + 'components/' + name + '/';
    var head = '<base href="' + base + '">' + INJECT.map(function (f) {
      var url = ROOT + f;
      return /\.css$/.test(f) ? '<link rel="stylesheet" href="' + url + '">' : '<script src="' + url + '"><\/script>';
    }).join('');
    // Drop the @dsCard comment so the doctype comes first (standards mode), then load the shared files first in <head>.
    html = html.replace(/^\s*<!--\s*@dsCard\b[\s\S]*?-->\s*/, '');
    if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, function (h) { return h + head; });
    if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, function (h) { return h + '<head>' + head + '</head>'; });
    return head + html;
  }

  // ---- frames -----------------------------------------------------------------
  var io = 'IntersectionObserver' in window && !EAGER ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); mount(e.target); } });
  }, { root: document.getElementById('cat-main'), rootMargin: '1200px 0px' }) : null;
  var ro = 'ResizeObserver' in window ? new ResizeObserver(function (entries) { entries.forEach(function (e) { fit(e.target); }); }) : null;

  function frameBox(name, card) {
    var wrap = document.createElement('div');
    wrap.className = 'frame-wrap';
    wrap.dataset.name = name;
    wrap.dataset.w = card.width || '';
    wrap.dataset.h = card.height || 400;
    wrap.innerHTML = '<div class="wait">Loading preview…</div>';
    wrap.style.height = (card.height || 400) + 'px';
    if (io) io.observe(wrap); else setTimeout(function () { mount(wrap); });
    if (ro) ro.observe(wrap);
    return wrap;
  }
  function fit(wrap) {
    var f = wrap.querySelector('iframe');
    var h = +wrap.dataset.h, w = +wrap.dataset.w, avail = wrap.clientWidth;
    if (!w) { if (f) { f.style.width = '100%'; f.style.height = h + 'px'; f.style.transform = ''; } wrap.style.height = h + 'px'; return; }
    var s = Math.min(1, avail / w);
    if (f) { f.style.width = w + 'px'; f.style.height = h + 'px'; f.style.transform = s < 1 ? 'scale(' + s + ')' : ''; }
    wrap.style.height = Math.round(h * s) + 'px';
    wrap.title = s < 1 ? 'Scaled to ' + Math.round(s * 100) + '% to fit' : '';
  }
  function mount(wrap) {
    var name = wrap.dataset.name;
    loadPreview(name).then(function (p) {
      var f = document.createElement('iframe');
      f.title = name + ' preview';
      f.setAttribute('loading', 'eager');
      f.addEventListener('load', function () { wrap.classList.add('loaded'); });
      f.srcdoc = buildDoc(name, p.html);
      wrap.appendChild(f);
      fit(wrap);
    }).catch(function (err) { wrap.querySelector('.wait').textContent = String(err.message || err); });
  }

  // ---- markdown (small subset: headings, lists, tables, code, quotes, links, emphasis) ----
  function inline(s, docPath) {
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = esc(s);
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, alt, href) { return '<img alt="' + alt + '" src="' + esc(resolveHref(href, docPath, true)) + '">'; });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, href) { return '<a href="' + esc(resolveHref(href.replace(/&amp;/g, '&'), docPath)) + '">' + t + '</a>'; });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^\w*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<code>' + esc(codes[+i]) + '</code>'; });
  }
  function resolveHref(href, docPath, raw) {
    if (/^(https?:|mailto:|#)/.test(href)) return href;
    var u = new URL(href, ROOT + (docPath || ''));
    if (u.href.indexOf(ROOT) !== 0) return u.href;
    var rel = u.href.slice(ROOT.length).split('#')[0];
    if (!raw && /\.md$/.test(rel)) return '#/doc/' + rel;
    return u.href;
  }
  function md(src, docPath) {
    var lines = src.replace(/\r\n?/g, '\n').replace(/<!--[\s\S]*?-->/g, '').split('\n'), out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (/^```/.test(l)) { var buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue; }
      var h = l.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out.push('<h' + h[1].length + '>' + inline(h[2], docPath) + '</h' + h[1].length + '>'); i++; continue; }
      if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        var row = function (r) { return r.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(function (c) { return inline(c.trim().replace(/\\\|/g, '|'), docPath); }); };
        var t = '<table><thead><tr>' + row(l).map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>';
        i += 2;
        while (i < lines.length && /^\s*\|/.test(lines[i])) { t += '<tr>' + row(lines[i++]).map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }
        out.push(t + '</tbody></table>'); continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
        var ordered = /^\s*\d+\./.test(l), items = [];
        while (i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
          if (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !/^\s{2,}/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''));
          else items[items.length - 1] += ' ' + lines[i].trim().replace(/^([-*]|\d+\.)\s+/, '· ');
          i++;
        }
        out.push((ordered ? '<ol>' : '<ul>') + items.map(function (x) { return '<li>' + inline(x, docPath) + '</li>'; }).join('') + (ordered ? '</ol>' : '</ul>'));
        continue;
      }
      if (/^>\s?/.test(l)) { var q = []; while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, '')); out.push('<blockquote>' + inline(q.join(' '), docPath) + '</blockquote>'); continue; }
      if (/^\s*(---|\*\*\*)\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (!l.trim()) { i++; continue; }
      var p = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\s*\||\s*([-*]|\d+\.)\s+|>)/.test(lines[i])) p.push(lines[i++]);
      if (!p.length) p.push(lines[i++]);
      out.push('<p>' + inline(p.join(' '), docPath) + '</p>');
    }
    return '<div class="md">' + out.join('\n') + '</div>';
  }

  // ---- navigation -------------------------------------------------------------
  function docTitle(path) {
    var base = path.split('/').pop().replace(/\.md$/, '').replace(/^\d+-/, '').replace(/-/g, ' ');
    var parent = path.split('/').slice(-2, -1)[0];
    if (path === 'README.md') return 'Overview (README)';
    return (parent && parent !== 'docs' ? '· ' : '') + base.charAt(0).toUpperCase() + base.slice(1);
  }
  function renderNav(filter) {
    var f = (filter || '').toLowerCase(), html = '';
    var docs = state.docs.filter(function (d) { return !f || d.toLowerCase().indexOf(f) >= 0; });
    if (docs.length) {
      html += '<div class="cat-group"><h2>Documentation</h2>' + docs.map(function (d) {
        return '<a href="#/doc/' + esc(d) + '" data-route="doc/' + esc(d) + '">' + esc(docTitle(d)) + '</a>';
      }).join('') + '</div>';
    }
    html += '<div class="cat-group"><h2>Catalog</h2><a href="#/" data-route="">All previews</a></div>';
    state.groups.forEach(function (g) {
      var items = g.items.filter(function (c) { return !f || (c.name + ' ' + (c.summary || '')).toLowerCase().indexOf(f) >= 0; });
      if (!items.length) return;
      html += '<div class="cat-group"><h2>' + esc(g.name) + '</h2>' + items.map(function (c) {
        return '<a href="#/c/' + esc(c.name) + '" data-route="c/' + esc(c.name) + '">' + esc(c.name) + '</a>';
      }).join('') + '</div>';
    });
    $nav.innerHTML = html;
    markCurrent();
  }
  function markCurrent() {
    var r = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    $nav.querySelectorAll('a[data-route]').forEach(function (a) {
      if (a.dataset.route === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }

  function card(c, big) {
    var el = document.createElement('section');
    el.className = 'cat-card';
    el.id = 'card-' + c.name;
    el.innerHTML = '<header><h3><a href="#/c/' + esc(c.name) + '">' + esc(c.name) + '</a></h3><span class="sum">' + esc(c.summary || '') + '</span><span class="dims"></span></header>';
    loadPreview(c.name).then(function (p) {
      var cd = p.card;
      el.querySelector('.dims').textContent = (cd.width ? cd.width + ' × ' : '') + (cd.height || '?') + (cd.page ? ' · page' : '');
      if (cd.subtitle) { var s = document.createElement('p'); s.className = 'sub'; s.textContent = cd.subtitle; el.insertBefore(s, el.children[1] || null); }
      el.appendChild(frameBox(c.name, cd));
    }).catch(function (err) { el.insertAdjacentHTML('beforeend', '<p class="cat-error">' + esc(err.message || err) + '</p>'); });
    return el;
  }
  function showAll() {
    $page.innerHTML = '';
    state.groups.forEach(function (g) {
      var s = document.createElement('section');
      s.className = 'cat-section';
      s.innerHTML = '<h2>' + esc(g.name) + '</h2>';
      g.items.forEach(function (c) { s.appendChild(card(c)); });
      $page.appendChild(s);
    });
  }
  function showComponent(name) {
    var c = state.components.filter(function (x) { return x.name === name; })[0];
    if (!c) { $page.innerHTML = '<p class="cat-error">No component named ' + esc(name) + '.</p>'; return; }
    $page.innerHTML = '<div class="crumbs"><a href="#/">All previews</a> · ' + esc(c.group) + '</div>';
    $page.appendChild(card(c, true));
    var readme = document.createElement('div');
    $page.appendChild(readme);
    get('components/' + name + '/README.md').then(function (t) {
      readme.innerHTML = md(t, 'components/' + name + '/README.md') +
        '<p class="crumbs">API reference: <a href="#/doc/api/components/' + esc(name) + '.md">api/components/' + esc(name) + '.md</a></p>';
    }).catch(function () { readme.innerHTML = '<p class="crumbs">No README for this preview.</p>'; });
  }
  function showDoc(path) {
    $page.innerHTML = '<div class="crumbs">' + esc(path) + '</div><div id="doc">Loading…</div>';
    get(path).then(function (t) { document.getElementById('doc').innerHTML = md(t, path); })
      .catch(function (err) { document.getElementById('doc').innerHTML = '<p class="cat-error">' + esc(err.message || err) + '</p>'; });
  }
  function route() {
    var r = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    document.getElementById('cat-main').scrollTop = 0;
    if (r.indexOf('c/') === 0) showComponent(r.slice(2));
    else if (r.indexOf('doc/') === 0) showDoc(r.slice(4));
    else showAll();
    markCurrent();
  }

  // ---- boot -------------------------------------------------------------------
  if (location.protocol === 'file:') {
    $page.innerHTML = '<div class="cat-error"><p><strong>Open the catalog through a local server.</strong> Browsers block reading files from a page opened from disk.</p>' +
      '<p>From the repository root, run <code>python -m http.server 4600 -d LL/src/Presentation/ll/design-system</code> and open <code>http://localhost:4600/catalog/</code>.</p></div>';
    return;
  }
  Promise.all([get('manifest.json', 'json'), get('design-system.json', 'json')]).then(function (res) {
    var manifest = res[0], ds = res[1];
    state.components = manifest.components.concat(EXTRA);
    var byGroup = {};
    state.components.forEach(function (c) { (byGroup[c.group] = byGroup[c.group] || []).push(c); });
    var names = Object.keys(byGroup).sort(function (a, b) {
      var ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
    });
    state.groups = names.map(function (n) { return { name: n, items: byGroup[n] }; });
    var strip = function (p) { return p.replace(/^project\//, ''); };
    state.docs = [strip(ds.docs.readme || 'README.md')].concat((ds.docs.sections || []).map(strip));
    document.getElementById('cat-meta').textContent = state.components.length + ' previews · ' + state.docs.length + ' pages';
    renderNav('');
    document.getElementById('cat-search').addEventListener('input', function (e) { renderNav(e.target.value); });
    window.addEventListener('hashchange', route);
    route();
  }).catch(function (err) {
    $page.innerHTML = '<p class="cat-error">Could not load the manifest: ' + esc(err.message || err) + '</p>';
  });
})();
</script>
</body>
</html>
