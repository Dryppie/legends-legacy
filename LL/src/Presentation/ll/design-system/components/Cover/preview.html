<!doctype html>

<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
  .cover { position: relative; height: 288px; width: 960px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .gilt { fill: var(--gilt); }
  .verdigris { fill: var(--sigil-fill); }
  .bone { fill: var(--ink); }
  .blood { fill: var(--meter-hp); }
  .glowblk { fill: var(--arcana-glow); }
  .blk { rx: var(--radius-control); }
  .hex.line { fill: none; stroke: var(--sigil-edge); stroke-width: 1.5; }
  .hex.glow { fill: var(--arcana-glow); }
  .hex.cut { fill: var(--ground); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 96px; line-height: .95; letter-spacing: 0.005em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink-muted); }
</style>
</head>
