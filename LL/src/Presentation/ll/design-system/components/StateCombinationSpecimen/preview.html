<!-- @dsCard group="Standards" height=1520 width=1280 subtitle="Where each mark sits on a slot, and the seven worked examples from Standards · State combinations, each with what is said only in words." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StateCombinationSpecimen — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); }
.pv { display: grid; gap: var(--section-lg); padding: var(--section-md); }
.pv-sec { display: grid; gap: var(--stack-lg); align-content: start; }
.pv-sec > header { display: grid; gap: var(--stack-xs); }
.pv-h { margin: 0; font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); }
.pv-note { margin: 0; max-width: var(--lg-measure); font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-t { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); letter-spacing: var(--tracking-display); color: var(--ink); }

/* Anatomy: one large slot, and what each corner holds. */
.pv-anat { display: flex; flex-wrap: wrap; gap: var(--section-sm); align-items: center; }
.pv-anat .lg-slot { width: 10rem; }
.pv-spec { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--stack-xs) var(--inline-md); font-size: var(--text-body-compact); line-height: var(--leading-body-compact); }
.pv-spec dt { color: var(--ink-muted); }
.pv-spec dd { margin: 0; color: var(--ink); }

/* The examples: a cell each, the resolved part on a Level 1 surface, then what shows and what is said in words. */
.pv-cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: var(--section-sm); }
.pv-cell { display: grid; gap: var(--stack-md); align-content: start; min-width: 0; }
.pv-sample { display: grid; align-content: center; justify-items: start; gap: var(--stack-md); min-height: 9rem; padding: var(--inset-lg); background: var(--surface); border-radius: var(--radius-container); container: lg-region / inline-size; }
.pv-sample > .lg-list, .pv-sample > .lg-entrylist { width: 100%; }
.pv-cost { margin: 0; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-cost b { font-family: var(--font-numeral); font-weight: 600; color: var(--ink); }
.pv-short { color: var(--warning); }
.pv-what { margin: 0; display: grid; gap: var(--stack-xs); font-size: var(--text-caption); line-height: var(--leading-caption); }
.pv-what dt { font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); }
.pv-what dd { margin: 0 0 var(--stack-xs); color: var(--ink); }

@container (max-width: 40rem) { .pv-cells { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
var noop = function () {};

function Cell(p) {
  return h('section', { className: 'pv-cell', 'aria-labelledby': p.id },
    h('h3', { className: 'pv-t', id: p.id }, p.title),
    h('div', { className: 'pv-sample' }, p.children),
    h('dl', { className: 'pv-what' },
      h('dt', null, 'What shows'), h('dd', null, p.shows),
      h('dt', null, 'Said in words only'), h('dd', null, p.words)));
}

function App() {
  return h('div', { className: 'pv' },
    h('section', { className: 'pv-sec', 'aria-labelledby': 'anat' },
      h('header', null,
        h('h2', { className: 'pv-h', id: 'anat' }, 'Every mark in its place'),
        h('p', { className: 'pv-note' }, 'At most four marks on one thing: identity, selection, one ownership mark and one attention mark. Each has one corner, and never moves into a corner another has left empty.')),
      h('div', { className: 'pv-anat' },
        h(L.ItemSlot, { icon: 'combat-styles', rarity: 'Epic', name: 'Ashen Blade', state: 'equipped', meta: 'Main hand', ready: 'Upgrade available', quantity: 2, selected: true, onClick: noop }),
        h('dl', { className: 'pv-spec' },
          h('dt', null, 'Top start'), h('dd', null, 'Identity: the rarity code, with the edge and the name’s colour'),
          h('dt', null, 'Top end'), h('dd', null, 'Attention: the arcana-glow diamond, for Ready and Claimable'),
          h('dt', null, 'Bottom start'), h('dd', null, 'Ownership: the in-use square for Equipped and Attuned, else the favourite ribbon'),
          h('dt', null, 'Bottom end'), h('dd', null, 'The quantity, ×2'),
          h('dt', null, 'The frame'), h('dd', null, 'Selection: the arcana-glow ring. Locked: a dashed edge'),
          h('dt', null, 'The caption'), h('dd', null, 'The name; a blocked thing’s reason; the meta line, led by the state’s word')))),
    h('section', { className: 'pv-sec', 'aria-labelledby': 'ex' },
      h('header', null,
        h('h2', { className: 'pv-h', id: 'ex' }, 'Worked examples'),
        h('p', { className: 'pv-note' }, 'Each shows the resolved part, and what is said only in words: in the accessible name and the Folio, never only on hover.')),
      h('div', { className: 'pv-cells' },
        h(Cell, { id: 'ex1', title: 'Equipped, with an upgrade',
          shows: 'The Epic edge, code and name; the in-use square; the attention diamond; “Equipped · Main hand”.',
          words: '“Upgrade available”, in the accessible name and as the Folio’s Upgrade action.' },
          h(L.ItemSlot, { icon: 'combat-styles', rarity: 'Epic', name: 'Ashen Blade', state: 'equipped', meta: 'Main hand', ready: 'Upgrade available', onClick: noop })),
        h(Cell, { id: 'ex2', title: 'Locked, and new',
          shows: 'The name in ink-disabled, the dashed frame, “Locked” and the condition.',
          words: 'New. Locked comes first, and a blocked thing takes no attention mark. The Folio says “+ New”.' },
          h(L.ItemSlot, { icon: 'prophecies', name: 'Ember Hoard', state: 'locked', reason: 'Clear Floor 10 to unlock', ready: true, onClick: noop })),
        h(Cell, { id: 'ex3', title: 'Claimable, expiring soon',
          shows: 'The Claimable Tag and the Claim Button; “Expires in 2h” in ink-muted.',
          words: 'Nothing is hidden. The expiry drops its warning tone, and no diamond repeats the Tag.' },
          h(L.List, { label: 'Prophecy caches', density: 'comfortable' },
            h(L.ListRow, { title: 'Prophecy Cache', tags: h(L.Tag, { state: 'claimable' }), meta: 'Expires in 2h', trailing: h(L.Button, { size: 'sm', variant: 'primary' }, 'Claim') }))),
        h(Cell, { id: 'ex4', title: 'Selected, and too dear',
          shows: 'The selection bar: the listing stays selectable. The shortfall beside the cost, and the Buy Button Insufficient.',
          words: 'Nothing on the listing: the shortfall belongs to the cost and the action, and Buy says it again when pressed.' },
          h(L.List, { label: 'Listings' },
            h(L.ListRow, { title: 'Soul Prism', rarity: 'Epic', value: 1250, selected: true, onClick: noop })),
          h('p', { className: 'pv-cost' }, 'Cost ', h('b', null, '1,000 / 1,250'), ' Cinders · ', h('span', { className: 'pv-short' }, 'Short by 250 Cinders')),
          h(L.Button, { variant: 'primary', state: 'insufficient', shortfall: [{ amount: 250, name: 'Cinders' }] }, 'Buy')),
        h(Cell, { id: 'ex5', title: 'Undiscovered, and the Creature Focus',
          shows: '“Undiscovered” in place of the name; the Creature Focus Tag (Assigned).',
          words: 'The hint, “Found on Floors 10–20”, and the Focus cooldown, in the Folio.' },
          h(L.EntryList, { label: 'Creatures', density: 'compact', fade: false, items: [{ id: 'bat', name: 'Undiscovered', tag: 'Creature Focus', tagTone: 'neutral' }] })),
        h(Cell, { id: 'ex6', title: 'Listed, and a favourite',
          shows: 'The rarity; the favourite mark bottom start (its word, until the ribbon is drawn); “Listed · 1,200 Cinders”.',
          words: 'Nothing: Listed is the meta line’s word, Favourite the mark.' },
          h(L.ItemSlot, { icon: 'inventory', rarity: 'Rare', name: 'Warded Pack', state: 'listed', meta: '1,200 Cinders', favourite: true, onClick: noop })),
        h(Cell, { id: 'ex7', title: 'Captured, and changed since',
          shows: 'The “In defence snapshot” Tag; “Changed since 14:02” in ink-muted.',
          words: 'The rule, in the Folio: “Snapshot from 14:02. Changes apply at the next snapshot.”' },
          h(L.List, { label: 'Arena', density: 'comfortable' },
            h(L.ListRow, { title: 'Arena defence', tags: h(L.Tag, { state: 'captured' }, 'In defence snapshot'), meta: 'Changed since 14:02' }))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
