<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TabStrip — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); }
.pv { padding: 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
.pv-col { display: grid; gap: 16px; }
.pv-cap { margin: 0 0 var(--stack-sm); font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }


</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
function App() {
  var a = React.useState('creatures'), b = React.useState('all');
  var TABS = [{ id: 'creatures', label: 'Creatures' }, { id: 'regions', label: 'Regions' }, { id: 'dungeons', label: 'Dungeons' }, { id: 'tower', label: 'World Tower' }];
  var FILTERS = [{ id: 'all', label: 'All' }, { id: 'disc', label: 'Discovered' }, { id: 'ready', label: 'Essence ready', count: 2 }, { id: 'unseen', label: 'Unseen' }];
  return h('div', { className: 'pv-col', style: { padding: 24 } },
    h('div', null, h('p', { className: 'pv-cap' }, 'Standard — 40px tabs'),
      h('div', { className: 'pv-col' },
        h(L.TabStrip, { label: 'Archive', tabs: TABS, activeId: a[0], onChange: a[1] }),
        h(L.TabStrip, { level: 'secondary', label: 'Filter', tabs: FILTERS, activeId: b[0], onChange: b[1] }))),
    h('div', null, h('p', { className: 'pv-cap' }, 'Compact — 32px tabs, for a table or list header'),
      h('div', { className: 'pv-col' },
        h(L.TabStrip, { label: 'Archive, compact', density: 'compact', tabs: TABS, activeId: a[0], onChange: a[1] }),
        h(L.TabStrip, { level: 'secondary', label: 'Filter, compact', density: 'compact', tabs: FILTERS, activeId: b[0], onChange: b[1] }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
