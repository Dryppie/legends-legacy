<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Delta — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); }
.pv { padding: 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
.pv-col { display: grid; gap: 16px; }
.pv-deltas { display: grid; grid-template-columns: repeat(5, max-content); gap: 10px 36px; padding: 24px; }
.pv-deltas dl { margin: 0; display: grid; gap: 4px; }
.pv-deltas dt { font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); }
.pv-deltas dd { margin: 0; display: flex; align-items: baseline; gap: 10px; font-size: var(--text-body-compact); line-height: var(--leading-body-compact); }
.pv-deltas dd b { font-family: var(--font-numeral); font-size: var(--text-numeral-row); font-weight: 600; color: var(--ink); }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
function Row(label, now, d) {
  return h('dl', null, h('dt', null, label), h('dd', null, h('b', null, now), h(L.Delta, d)));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv-deltas' },
  Row('Power', '154', { direction: 'up', value: '12', polarity: 'better' }),
  Row('Cooldown', '6.8s', { direction: 'down', value: '1.2s', polarity: 'better' }),
  Row('Crit Chance', '9%', { direction: 'down', value: '0.5%', polarity: 'worse' }),
  Row('Damage Taken', '14%', { direction: 'up', value: '2%', polarity: 'worse' }),
  Row('Attack Speed', '1.12', { direction: 'none', value: '0', polarity: 'neutral' })));
</script>
</body>
</html>
