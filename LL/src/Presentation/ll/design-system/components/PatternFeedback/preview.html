<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PatternFeedback — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); }
.pv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; padding: 24px; align-items: start; }
.pv-stack { display: grid; gap: 14px; }
.pv-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.pv-actions { display: flex; gap: 12px; }
.pv-lead { margin: 0; font-family: var(--font-display); font-size: var(--text-name-row); line-height: var(--leading-name-row); color: var(--ink); }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
function D(direction, value, polarity) { return h(L.Delta, { direction: direction, value: value, polarity: polarity }); }
function was(delta, text) { return h(F, null, delta, ' \u00b7 ', text); }

var comparison = h(L.Panel, {
  title: 'Equipment comparison',
  aside: h(L.Tag, { tone: 'epic' }, 'Epic')
}, h('div', { className: 'pv-stack' }, h('p', { className: 'pv-lead' }, 'If you equip ', h(L.ItemLink, { rarity: 'Epic' }, 'Ember Fang'), ' in place of Iron Sabre'), h(L.Ledger, { title: 'Your stats', rows: [
  { label: 'Power', value: '154', sub: was(D('up', '12', 'better'), 'now 142') },
  { label: 'Crit Chance', value: '9%', sub: was(D('down', '0.5%', 'worse'), 'now 9.5%') },
  { label: 'Ability Haste', value: '18', sub: was(D('up', '3', 'better'), 'now 15') },
  { label: 'Damage Taken', value: '12%', sub: was(D('down', '2%', 'better'), 'now 14% \u2014 lower is better') },
  { label: 'Attack Speed', value: '1.12', sub: was(D('none', '0', 'neutral'), 'unchanged') }
] })));

var ascension = h(L.Panel, {
  title: 'Ascension preview',
  aside: h(L.Tag, null, 'Preview')
}, h('div', { className: 'pv-stack' },
  h('p', { className: 'pv-lead' }, h(L.ItemLink, { rarity: 'Rare' }, 'Ember Wolf Essence'), ' at Ascension II'),
  h('div', { className: 'lg-statgrid' },
    h(L.StatTile, { label: 'Cooldown', value: 6.8, suffix: 's', delta: -1.2, deltaPolarity: 'better' }),
    h(L.StatTile, { label: 'Damage', value: 54, delta: 6, deltaPolarity: 'better' }),
    h(L.StatTile, { label: 'SP Cost', value: 12, delta: 0 }),
    h(L.StatTile, { label: 'Duration', value: 4, suffix: 's', delta: 0.5, deltaPolarity: 'better' }))));

var conditions = h(L.Panel, { title: 'Conditions' }, h('div', { className: 'pv-stack' },
  h('div', { className: 'pv-tags' },
    h(L.Tag, { tone: 'harmful', value: '6s' }, 'Weaken'), h(L.Tag, { tone: 'harmful', value: '4s' }, 'Slow'),
    h(L.Tag, { tone: 'beneficial', value: '10s' }, 'Empower')),
  h(L.Ledger, { title: 'Their effects', rows: [
    { label: 'Weaken', value: D('down', '15% Power', 'worse'), sub: '6s left \u00b7 from the Ember Knight' },
    { label: 'Slow', value: D('down', '20% Attack Speed', 'worse'), sub: '4s left' },
    { label: 'Empower', value: D('up', '20% damage', 'better'), sub: '10s left' }
  ] })));

var cost = h(L.Panel, { title: 'Soulstone upgrade', aside: h(L.Tag, { state: 'insufficient', value: '12 Soulstones' }) },
  h('div', { className: 'pv-stack' },
    h('p', { className: 'pv-lead' }, 'Power III'),
    h(L.Ledger, { title: 'Cost', rows: [
      { label: 'Upgrade cost', value: '40 Soulstones' },
      { label: 'You have', value: '28 Soulstones', muted: true },
      { label: 'You gain', value: D('up', '2% Power', 'better') }
    ] }),
    h('div', { className: 'pv-actions' },
      h(L.Button, { variant: 'solid', state: 'insufficient', shortfall: [{ amount: 12, name: 'Soulstones' }] }, 'Upgrade'),
      h(L.Button, { variant: 'quiet' }, 'Where to find Soulstones'))));

ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv-grid' },
  h('div', { className: 'pv-stack' }, comparison, cost),
  h('div', { className: 'pv-stack' }, ascension, conditions)));
</script>
</body>
</html>
