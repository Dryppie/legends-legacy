<!-- @dsCard group="Foundations" height=2030 width=1480 subtitle="The Character Overview's Combat Attributes in regions 1,216, 832 and 470px wide: four Ledgers a row, two, then one — never narrower than ledger-min, so no label truncates." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LayoutGridSpecimen — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground-deep); color: var(--ink); font-family: var(--font-ui); }
.pv { display: grid; gap: var(--section-md); padding: var(--section-md); }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--inline-md); }
.pv-bar > span { font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-row { display: flex; flex-wrap: wrap; gap: var(--section-md); align-items: start; }
.pv-case { display: grid; gap: var(--stack-lg); align-content: start; }
.pv-cap { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--inline-xs) var(--inline-md); }
.pv-tier { font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink); }
.pv-size { font-family: var(--font-numeral); font-size: var(--text-numeral-compact); line-height: var(--leading-numeral-compact); font-weight: 600; color: var(--ink-muted); }
.pv-where { flex: 1 0 100%; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-frame { box-sizing: content-box; max-width: 100%; background: var(--ground); outline: 1px dashed var(--line-strong); outline-offset: 0.5rem; container: lg-region / inline-size; }
/* As on the Overview: a boxed section with a section heading, a one-line summary at the reading width, then the Ledger grid. */
.pv-attrs { display: grid; gap: var(--space-5); padding: var(--space-6); background: var(--surface); }
.pv-attrshead { display: grid; gap: var(--stack-xs); }
.pv-attrshead p { margin: 0; font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink-muted); }
/* Guides: the column tracks and an 8px rhythm (two 4px steps). */
.pv.is-guides .pv-frame { background-image: repeating-linear-gradient(to bottom, transparent 0 calc(0.5rem - 1px), color-mix(in srgb, var(--line-strong) 40%, transparent) calc(0.5rem - 1px) 0.5rem); }
.pv.is-guides .pv-attrs { background-color: color-mix(in srgb, var(--surface) 85%, transparent); }
.pv.is-guides .lg-ledgergrid > * { outline: 1px dashed var(--line-strong); outline-offset: 0; }
.pv-note { margin: 0; max-width: var(--lg-measure); font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-note b { font-weight: 600; color: var(--ink); }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment, f = L.format;

function pct(v) { return v + '%'; }
var GROUPS = [
  { title: 'Offense', rows: [
    { label: 'Power', value: f.number(142), description: 'Raw force behind every blow and spell. Scales all outgoing damage.' },
    { label: 'Attack Speed', value: '1.12', description: 'Attacks per second before cooldowns and abilities.' },
    { label: 'Crit Chance', value: pct(9.5), description: 'Chance for a hit to land as a critical strike.' },
    { label: 'Crit Damage', value: pct(150), description: 'Damage dealt by a critical strike, compared to a normal hit.' },
    { label: 'Armor Penetration', value: f.number(12), description: "Ignores part of the target's Armor." },
    { label: 'Magic Penetration', value: f.number(4), description: "Ignores part of the target's Resistance." }
  ] },
  { title: 'Defense', rows: [
    { label: 'Max Health', value: f.number(4150), description: 'Health you enter every fight with.' },
    { label: 'Armor', value: pct(38), sub: '240 Armor Rating', description: 'Armor is combined and converted with diminishing returns.', tipMeta: 'From equipment: 240 Armor Rating' },
    { label: 'Resistance', value: pct(22), sub: '130 Resistance Rating', description: 'Reduces magical, shadow and elemental damage. Converted with diminishing returns.', tipMeta: 'From equipment: 130 Resistance Rating' },
    { label: 'Dodge', value: pct(6), description: 'Chance to avoid an attack entirely.' },
    { label: 'Block', value: pct(4), description: 'Chance to block part of an incoming hit.' },
    { label: 'Damage Reduction', value: pct(3), description: 'Reduction applied to all damage taken.' }
  ] },
  { title: 'Recovery', rows: [
    { label: 'Restoration', value: f.number(18), description: 'Improves healing received from every source.' },
    { label: 'Healing Power', value: pct(12), description: 'Increases healing you deal.' },
    { label: 'Health Regen', value: f.unit(24, 'HP/5s'), description: 'Health restored every five seconds.' },
    { label: 'Life Steal', value: pct(2.5), description: 'Part of the damage you deal returns to you as health.' }
  ] },
  { title: 'Utility', rows: [
    { label: 'Ability Haste', value: f.number(15), description: 'Shortens the cooldown of your Essence abilities.' },
    { label: 'Tenacity', value: pct(10), description: 'Shortens stuns, roots and other control effects on you.' },
    { label: 'Cooldown', value: pct(8), description: 'Reduces cooldowns directly.' },
    { label: 'Status Resistance', value: pct(12), description: 'Chance to shrug off bleed, burn and poison.' },
    { label: 'CC Resistance', value: pct(5), description: 'Chance to resist crowd control outright.' },
    { label: 'Threat', value: f.unit(3.4, 'threat/s', 1), description: 'Estimated threat per second from your Essence loadout: how strongly enemies focus you.' }
  ] }
];

var TIERS = [[68, 'Wide'], [44, 'Medium'], [32, 'Narrow'], [0, 'Stacked']];
function tierOf(rem) { for (var i = 0; i < TIERS.length; i++) if (rem >= TIERS[i][0]) return TIERS[i][1]; }

function Frame(p) {
  var ref = React.useRef(null), st = React.useState(null);
  React.useEffect(function () {
    var el = ref.current;
    function measure() {
      var w = el.getBoundingClientRect().width, rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
      var grid = el.querySelector('.lg-ledgergrid');
      var cols = grid ? getComputedStyle(grid).gridTemplateColumns.split(' ').filter(function (x) { return parseFloat(x) > 0; }).length : 0;
      st[1]({ px: Math.round(w), rem: Math.round(w / rem * 10) / 10, cols: cols });
    }
    measure();
    var ro = new ResizeObserver(measure); ro.observe(el);
    var mo = new MutationObserver(function () { setTimeout(measure, 0); }); mo.observe(document.documentElement, { attributes: true });
    return function () { ro.disconnect(); mo.disconnect(); };
  }, []);
  var m = st[0];
  return h('div', { className: 'pv-case', style: { width: p.width, maxWidth: '100%' } },
    h('div', { className: 'pv-cap' },
      h('span', { className: 'pv-tier' }, m ? tierOf(m.rem) : ' '),
      h('span', { className: 'pv-size' }, m ? f.number(m.px) + 'px · ' + m.rem + 'rem · ' + m.cols + (m.cols === 1 ? ' Ledger a row' : ' Ledgers a row') : ' '),
      h('span', { className: 'pv-where' }, p.where)),
    h('div', { className: 'pv-frame', ref: ref, style: { width: p.width } }, p.children));
}

var uid = 0;
function Attributes() {
  var id = React.useRef('pv-attrs' + (++uid)).current;
  return h('section', { className: 'pv-attrs', 'aria-labelledby': id },
    h('header', { className: 'pv-attrshead' },
      h(L.Heading, { level: 'section', id: id }, 'Combat Attributes'),
      h('p', { className: 'lg-prose' }, 'Combat values after equipment and permanent bonuses. Hover or focus a row for what it does.')),
    h('div', { className: 'lg-ledgergrid' }, GROUPS.map(function (g) { return h(L.Ledger, { key: g.title, title: g.title, rows: g.rows }); })));
}

function App() {
  var g = React.useState(false);
  return h('div', { className: 'pv' + (g[0] ? ' is-guides' : '') },
    h('div', { className: 'pv-bar' },
      h(L.Button, { size: 'sm', variant: g[0] ? 'primary' : 'quiet', 'aria-pressed': g[0], onClick: function () { g[1](!g[0]); } }, 'Show columns and rhythm'),
      h('span', null, 'Dashed boxes are the grid’s columns; the lines are the 8px rhythm every section starts and ends on.')),
    h(Frame, { width: '1216px', where: 'The stage content at 1920px with no Folio and the Chronicle docked.' }, h(Attributes)),
    h('div', { className: 'pv-row' },
      h(Frame, { width: '832px', where: 'At 1536px, no Folio, docked. Four groups never split three and one.' }, h(Attributes)),
      h(Frame, { width: '470px', where: 'At 1280px with Large text. One Ledger a row.' }, h(Attributes))),
    h('p', { className: 'pv-note' }, h('b', null, 'Each region answers for itself:'), ' the grid reads its region’s tier for the most Ledgers a row may hold, and ledger-min for the fewest pixels each may have. At Large and Extra large text the same regions reach a smaller tier sooner; the captions read the tier and the column count live.'));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
