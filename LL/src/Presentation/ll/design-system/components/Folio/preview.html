<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Folio — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); }
.pv { padding: 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
.pv-col { display: grid; gap: 16px; }
body { background: var(--ground-deep); } #root { display: flex; justify-content: center; }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
var CORNER = '../../assets/Ornaments/CornerOrnament.svg';
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', gap: 24 } },
  h('div', { style: { width: 360, height: 700 } }, h(L.Folio, {
    cornerSrc: CORNER,
    emblem: h(L.Emblem, { points: 6, size: 148 }),
    eyebrow: 'Attribute', title: 'Power',
    lore: h(F, null, 'Raw force behind every blow and spell. With ', h('b', null, 'Power'), ' as your weapon, you break what others only bend.'),
    effects: [{ value: '+12%', text: 'damage from equipment' }, { value: '+8', text: 'from active essences' }],
    actions: h(L.Button, { hotkey: 'E' }, 'View breakdown'),
    footer: h(L.Track, { steps: 5, current: 1, startLabel: 'Ascension', endLabel: 'Tier V', label: 'Legacy Ascension' })
  })),
  h('div', { style: { width: 360, height: 700 } }, h(L.Folio, {
    cornerSrc: CORNER, rarity: 'Epic',
    emblem: h(L.ItemSlot, { rarity: 'Epic', icon: 'essences', caption: false }),
    eyebrow: 'Essence', title: 'Soul Prism',
    lore: h(F, null, 'A shard of a warden\u2019s heart, still humming with the ', h('b', null, 'Prism'), ' it once guarded.'),
    effects: [{ value: '+14', text: 'Power' }, { value: '+6%', text: 'magical damage' }],
    actions: h(L.Button, { variant: 'solid', hotkey: 'A' }, 'Attune')
  }))));
</script>
</body>
</html>
