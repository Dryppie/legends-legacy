<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Meter — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); }
.pv { padding: 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
.pv-col { display: grid; gap: 16px; }

</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv', style: { alignItems: 'flex-start', gap: 40 } },
  h('div', { className: 'pv-col', style: { width: 280 } },
    h(L.Meter, { tone: 'hp', label: 'HP', value: 4150, max: 4150 }),
    h(L.Meter, { tone: 'sp', label: 'SP', value: 520, max: 780 }),
    h(L.Meter, { tone: 'xp', label: 'EXP', value: 350, max: 24500 })),
  h('div', { className: 'pv-col', style: { width: 320 } },
    h(L.Meter, { tone: 'hp', size: 'bar', label: 'HP', value: 3120, max: 4150 }),
    h(L.Meter, { tone: 'sp', size: 'bar', label: 'SP', value: 200, max: 780 }))));
</script>
</body>
</html>
