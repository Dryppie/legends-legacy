<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NavRail — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); }
.pv { padding: 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
.pv-col { display: grid; gap: 16px; }
.pv-rails { display: flex; gap: 32px; }
.pv-brand { font-family: var(--font-display); font-size: var(--text-name-row); line-height: var(--leading-name-row); letter-spacing: var(--tracking-display); color: var(--gilt); }
.pv-logo { display: grid; place-items: center; width: 44px; height: 44px; }
.pv-logo img { display: block; }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
var LOGO = '../../assets/Logos/Logo.svg';
var NAV = [
  { label: 'Character', items: [
    { id: 'overview', title: 'Overview', description: 'Stats, vitals, loadout', icon: 'overview' },
    { id: 'inventory', title: 'Inventory', description: 'Items, gear, misc', icon: 'inventory', badge: 3, badgeLabel: '3 new items' },
    { id: 'essences', title: 'Essences', description: 'Archive, attune, ascend', icon: 'essences' },
    { id: 'combat-styles', title: 'Combat Styles', description: 'Train, refine, combine', icon: 'combat-styles' },
    { id: 'achievements', title: 'Achievements', description: 'Records and titles', icon: 'achievements' },
    { id: 'soulstones', title: 'Soulstones', description: 'Permanent upgrades', icon: 'soulstones' } ] },
  { label: 'World', items: [
    { id: 'world-map', title: 'World Map', description: 'Travel and explore', icon: 'world-map' },
    { id: 'world-tower', title: 'World Tower', description: 'Conquer the World Tower', icon: 'legacy-ascension' },
    { id: 'quests', title: 'Quests', description: 'Objectives and rewards', icon: 'quest-journal', badge: 1, badgeLabel: '1 quest ready to turn in' },
    // Something waiting with nothing to count: the attention diamond in the badge's place.
    { id: 'prophecies', title: 'Prophecies', description: 'Daily and weekly omens', icon: 'prophecies', ready: 'Daily cache ready' } ] },
  { label: 'City', items: [
    { id: 'guild', title: 'Guild', description: 'Guild headquarters', icon: 'guild' },
    // Locked comes before the attention mark: no diamond on a locked item.
    { id: 'colosseum', title: 'Colosseum', description: 'Tournaments and battles', icon: 'colosseum', locked: true, reason: 'Unlocks at level 20', ready: true },
    { id: 'cinder-bazaar', title: 'Cinder Bazaar', description: 'List and buy items', icon: 'cinder-bazaar' },
    { id: 'leaderboard', title: 'Leaderboard', description: 'Rankings and records', icon: 'leaderboard' } ] },
  { label: 'System', items: [
    { id: 'settings', title: 'Settings', description: 'Account and preferences', icon: 'settings' } ] }
];

function App() {
  var s = React.useState('overview');
  return h('div', { className: 'pv-rails' },
    h('div', { style: { width: 256, height: 820 } }, h(L.NavRail, { sections: NAV, activeId: s[0], onNavigate: s[1],
      header: h(F, null, h('span', { className: 'pv-logo' }, h('img', { src: LOGO, width: 36, height: 36, alt: '' })), h('span', { className: 'pv-brand' }, "Legend's", h('br'), 'Legacy')) })),
    h('div', { style: { width: 64, height: 820 } }, h(L.NavRail, { compact: true, sections: NAV, activeId: s[0], onNavigate: s[1] })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
