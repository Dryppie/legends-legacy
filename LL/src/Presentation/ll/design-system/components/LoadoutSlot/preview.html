<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LoadoutSlot — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); }
.pv { padding: 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
.pv-col { display: grid; gap: 16px; }

</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
function slots(compact) {
  return h('div', { style: { width: 320, display: 'grid', gap: 8, alignContent: 'start' } },
    h('p', { style: { margin: 0, color: 'var(--ink-muted)', fontSize: 'var(--text-label)', fontWeight: 600, letterSpacing: 'var(--tracking-caps)', textTransform: 'uppercase' } }, compact ? 'Compact (a full loadout)' : 'Default'),
    h(L.LoadoutSlot, { compact: compact, index: 0, state: 'attuned', name: 'Ember Wolf Essence', rarity: 'Rare', active: { name: 'Cinder Bite', cooldown: '12s' }, passive: { name: 'Pack Instinct' }, onClick: function () {} }),
    h(L.LoadoutSlot, { compact: compact, index: 1, state: 'open', hint: compact ? undefined : 'Choose an Essence to attune', ready: 'Essence ready to attune', onClick: function () {} }),
    h(L.LoadoutSlot, { compact: compact, index: 2, state: 'locked', reason: 'Unlocks at level 20', onClick: function () {} }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { padding: 24, display: 'flex', flexWrap: 'wrap', gap: 32 } }, slots(false), slots(true)));
</script>
</body>
</html>
