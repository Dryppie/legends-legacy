<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Objective — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); }
.pv { padding: 24px; display: grid; gap: 24px; }
.pv-bar { display: flex; align-items: center; gap: 20px; min-height: var(--topbar-height); padding: 0 20px; background: var(--surface-solid); border-radius: var(--radius-container); }
.pv-center { flex: 1; display: flex; justify-content: center; }
.pv-center > * { width: 100%; max-width: 26.25rem; }
.pv-track { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: var(--text-caption); color: var(--ink-muted); }
.pv-track b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
var noop = function () {};
var tracker = h('div', { style: { display: 'grid', gap: 8 } },
  h('p', { style: { margin: 0, color: 'var(--ink-muted)', fontSize: 'var(--text-caption)' } }, 'Welcome to Legends Legacy · Chain 1 of 4'),
  h('ul', { className: 'pv-track' },
    h('li', null, h('b', null, '3 / 5'), ' Defeat wolves in the Whispering Woods'),
    h('li', null, h('b', null, '0 / 1'), ' Attune an Essence')),
  h(L.Button, { size: 'sm', variant: 'link' }, 'Open Quests'));
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv' },
  h('div', { className: 'pv-bar' },
    h('span', { style: { fontFamily: 'var(--font-display)', fontSize: 'var(--text-name-header)' } }, 'Aldric Vane'),
    h('div', { className: 'pv-center' }, h(L.Objective, { kicker: 'Quest', title: 'The First Hunt', objective: 'Defeat wolves in the Whispering Woods', current: 3, required: 5 }, tracker)),
    h(L.CurrencyPill, { name: 'Cinders', amount: 12480, short: true }))));
</script>
</body>
</html>
