var LABELS = [['framed', 'Framed surfaces', 1], ['rules', 'Ornament rules', 2], ['corners', 'Corner sets', 1], ['grain', 'Film grain', null], ['textures', 'Textures', 0], ['halos', 'Halos', 0], ['loops', 'Loops', 0]];
