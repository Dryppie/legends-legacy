<style>
html, body { margin: 0; }

.pv-note b, .pv-spec dd b { font-weight: 600; color: var(--ink); }
.pv-t { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); letter-spacing: var(--tracking-display); color: var(--ink); }

/* The five types, the ladder and the rhythms: cells with a sample on a Level 1 surface, then what it means. */
.pv-cells { display: grid; gap: var(--section-sm); }
.pv-cells--5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.pv-cells--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pv-cell { display: grid; gap: var(--stack-md); align-content: start; min-width: 0; }
.pv-sample { display: grid; align-content: center; min-height: 8.5rem; padding: var(--inset-lg); container: lg-region / inline-size; }
.pv-sample--flush { padding: 0; align-content: start; }
.pv-spec { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--stack-xs) var(--inline-md); font-size: var(--text-caption); line-height: var(--leading-caption); }
.pv-spec dt { color: var(--ink-muted); }
.pv-spec dd { margin: 0; color: var(--ink); }
.pv-spec code, .pv-note code, .pv-mean code { font: inherit; font-weight: 600; color: var(--ink); }
.pv-mean { margin: 0; font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink-muted); }

/* A sample of the gilt frame, drawn the way the Folio and the Banner draw it. */
.pv-gilt { position: relative; display: grid; place-items: center; min-height: 6rem; padding: var(--inset-xl); background: var(--folio); }
.pv-gilt::before { content: ""; position: absolute; inset: 0.375rem; border: var(--border-hairline) solid var(--gilt); opacity: var(--lg-frame-opacity); pointer-events: none; }
.pv-gilt::after { content: ""; position: absolute; inset: 0.625rem; border: var(--border-hairline) solid var(--gilt); opacity: calc(var(--lg-frame-opacity) * 0.6); pointer-events: none; }

.pv-field { display: grid; gap: var(--stack-xs); min-width: 0; }
.pv-field label, .pv-field .pv-lab { font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); }
.pv-field .lg-input { width: 100%; box-sizing: border-box; }
.pv-inline { display: flex; flex-wrap: wrap; align-items: end; gap: var(--inline-md); }
.pv-inline .pv-field { flex: 1 1 8rem; }

/* The ladder */
.pv-step { display: flex; align-items: baseline; gap: var(--inline-md); }
.pv-step b { font-family: var(--font-numeral); font-size: var(--text-numeral-row); line-height: var(--leading-numeral-row); font-weight: 600; color: var(--ink-muted); }
.pv-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--section-sm); }
.pv-groups > div { display: grid; gap: 2px; font-size: var(--text-body-compact); line-height: var(--leading-body-compact-row); }
.pv-groups > div > span:first-child { margin-bottom: var(--stack-xs); font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); }
.pv-stack { display: grid; gap: var(--stack-md); font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink-muted); }
.pv-stack p { margin: 0; }
.pv-objects { display: flex; align-items: center; gap: var(--inline-lg); }
.pv-objects .pv-field { flex: 1; }

/* A data table, drawn on lg-tablewrap. The rhythm is the wrapper's; the cells only pad. */
.pv-table { font-size: var(--text-body-compact); line-height: var(--leading-body-compact-row); }
.pv-table th { padding: var(--stack-sm) var(--inline-md); text-align: left; font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.pv-table td { padding: var(--stack-sm) var(--inline-md); white-space: nowrap; }
.pv-table .n { text-align: right; font-family: var(--font-numeral); font-size: var(--text-numeral-compact); line-height: var(--leading-numeral-compact); font-weight: 600; font-variant-numeric: tabular-nums lining-nums; }
.pv-table th.n { font-family: var(--font-ui); font-size: var(--text-label); line-height: var(--leading-label); }
.pv-table .nm { font-family: var(--font-display); font-size: var(--text-name-row); line-height: var(--leading-name-row); }

/* Do and don't */
.pv-pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 40rem), 1fr)); gap: var(--section-lg) var(--section-md); align-items: start; }
.pv-pair { display: grid; gap: var(--stack-lg); align-content: start; min-width: 0; }
.pv-dd { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--section-sm); align-items: start; }
.pv-side { display: grid; gap: var(--stack-md); align-content: start; min-width: 0; container: lg-region / inline-size; }
.pv-verdict { display: flex; align-items: center; gap: var(--inline-sm); font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink); }
.pv-verdict i { font-style: normal; font-size: var(--text-body); line-height: 1; }
.pv-why { margin: 0; padding-left: 1.125rem; list-style-type: "\2013\00a0"; display: grid; gap: 2px; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-why code { font: inherit; font-weight: 600; color: var(--ink); }
.pv-folio { height: 47rem; }
.pv-form { display: grid; gap: var(--section-sm); }
.pv-form .lg-panel__body { display: grid; gap: var(--section-sm); }
.pv-grp { display: grid; gap: var(--stack-md); margin: 0; padding: 0; border: 0; min-width: 0; }
.pv-grp > legend, .pv-grp > h4 { padding: 0; margin: 0 0 var(--stack-xs); font-family: var(--font-display); font-weight: 400; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); color: var(--ink); }
.pv-item { display: flex; align-items: center; gap: var(--inline-md); }
.pv-item > div { display: grid; min-width: 0; }
.pv-item strong { font-family: var(--font-display); font-weight: 400; font-size: var(--text-name-row); line-height: var(--leading-name-row); color: var(--rarity-rare); }
.pv-item span { font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-actions { display: flex; flex-wrap: wrap; gap: var(--inline-sm); }
select.lg-input { appearance: none; -webkit-appearance: none; padding-right: 2.25rem; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%), linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%);
  background-position: calc(100% - 1.125rem) 50%, calc(100% - 0.8125rem) 50%; background-size: 0.3125rem 0.3125rem; background-repeat: no-repeat; }

/* The don'ts, drawn on the same components with the lines the rules forbid. They are specimens of mistakes, not styles to copy. */

.pv-x-cards { row-gap: 0.25rem; padding: 0.375rem; border: 1px solid var(--line); }

.pv-x-folio .lg-panel { border: 1px solid var(--line); text-align: left; }
.pv-x-form .pv-grp { padding: var(--inset-md); border: 1px solid var(--line); }
.pv-x-form .pv-grp > legend { padding: 0 var(--inline-sm); margin: 0; }
.pv-x-form .lg-input { border-color: var(--line); }
.pv-x-form .lg-ledger__row + .lg-ledger__row { box-shadow: inset 0 1px 0 var(--line); }
