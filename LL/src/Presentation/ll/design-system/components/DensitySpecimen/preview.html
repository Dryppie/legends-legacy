<!-- @dsCard group="Foundations" height=1230 width=1280 subtitle="The same inventory list and the same attribute Ledger in Comfortable, Standard and Compact, with each mode's row, padding, gap, text, icon and control sizes." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DensitySpecimen — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); }
.pv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--section-sm); padding: var(--section-md); align-items: start; }
.pv-col { display: grid; gap: var(--stack-lg); align-content: start; min-width: 0; }
.pv-head { display: grid; gap: var(--stack-xs); padding-bottom: var(--stack-md); border-bottom: var(--border-hairline) solid var(--line); }
.pv-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--text-title-md); line-height: var(--leading-title-md); letter-spacing: var(--tracking-display); }
.pv-head p { margin: 0; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-spec { display: grid; grid-template-columns: auto 1fr; gap: 0 var(--inline-md); margin: var(--stack-sm) 0 0; font-size: var(--text-caption); line-height: var(--leading-caption); }
.pv-spec dt { color: var(--ink-muted); }
.pv-spec dd { margin: 0; font-weight: 600; }
.pv-actions { display: flex; flex-wrap: wrap; gap: var(--lg-gap); }
.pv-foot { margin: 0; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-foot b { font-weight: 600; color: var(--ink); }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment, f = L.format;

var MODES = [
  { id: 'comfortable', name: 'Comfortable', use: 'Identity and detail views, the Folio, dialogs.',
    spec: [['Row', '48px'], ['Cell padding', '12 / 16px'], ['Gap', '16px'], ['Text', 'body 15 / 20'], ['Numbers', 'numeral-row 18'], ['Icon', '20px'], ['Control', '44px'], ['Container inset', '24px, inner 16px']] },
  { id: 'standard', name: 'Standard', use: 'The default: panels and forms.',
    spec: [['Row', '40px'], ['Cell padding', '8 / 12px'], ['Gap', '12px'], ['Text', 'body-compact 14 / 18'], ['Numbers', 'numeral-row 18'], ['Icon', '18px'], ['Control', '40px'], ['Container inset', '16px, inner 12px']] },
  { id: 'compact', name: 'Compact', use: 'Tables, inventory, rankings, guild members, combat logs, order books.',
    spec: [['Row', '32px'], ['Cell padding', '4 / 8px'], ['Gap', '8px'], ['Text', 'body-compact 14 / 18'], ['Numbers', 'numeral-compact 14'], ['Icon', '16px'], ['Control', '32px'], ['Container inset', '12px, inner 8px']] }
];

var ITEMS = [
  { id: 'fang', title: 'Ember Fang', rarity: 'Epic', icon: 'colosseum', meta: 'Sword · Lv 18', quantity: 1, value: 9400, equipped: true },
  { id: 'crown', title: 'Crown of Cinders', rarity: 'Legendary', icon: 'overview', meta: 'Helm · Lv 20', quantity: 1, value: 48000 },
  { id: 'wolf', title: 'Dire Wolf Essence', rarity: 'Rare', icon: 'essences', meta: 'Essence · Lv 12', quantity: 3, value: 1250 },
  { id: 'prism', title: 'Soul Prism', rarity: 'Epic', icon: 'soulstones', meta: 'Material', quantity: 7, value: 2100 },
  { id: 'satchel', title: 'Frayed Satchel', rarity: 'Uncommon', icon: 'inventory', meta: 'Bag · 12 slots', quantity: 1, value: 140 },
  { id: 'glands', title: 'Venom Glands', rarity: 'Uncommon', icon: 'soulstones', meta: 'Material', quantity: 14, value: 36 },
  { id: 'sabre', title: 'Iron Sabre', rarity: 'Common', icon: 'colosseum', meta: 'Sword · Lv 4', quantity: 2, value: 85 }
];
var ATTRS = [
  { label: 'Power', value: f.number(1284), description: 'Raw force behind every blow and spell.' },
  { label: 'Attack Speed', value: f.number(1.12, 2), description: 'Attacks per second before cooldowns and abilities.' },
  { label: 'Crit Chance', value: f.percent(24.8, 1), description: 'Chance for a hit to land as a critical strike.' },
  { label: 'Crit Damage', value: f.times(1.5, 1), description: 'Damage dealt by a critical strike, compared to a normal hit.' },
  { label: 'Armor Penetration', value: f.number(12), description: "Ignores part of the target's Armor." },
  { label: 'Magic Penetration', value: null, description: 'Your Essences deal no magic damage.' }
];

function Column(m) {
  var sel = React.useState('wolf'), tab = React.useState('all');
  var box = React.useRef(null), ht = React.useState(null);
  React.useLayoutEffect(function () { if (box.current) ht[1](Math.round(box.current.getBoundingClientRect().height)); });
  return h('section', { className: 'pv-col', 'data-density': m.id, 'aria-label': m.name },
    h('header', { className: 'pv-head' },
      h('h2', null, m.name), h('p', null, m.use),
      h('dl', { className: 'pv-spec' }, m.spec.map(function (s) { return h(F, { key: s[0] }, h('dt', null, s[0]), h('dd', null, s[1])); }))),
    h(L.TabStrip, { level: 'secondary', label: 'Filter', activeId: tab[0], onChange: tab[1],
      tabs: [{ id: 'all', label: 'All', count: 60 }, { id: 'gear', label: 'Gear' }, { id: 'essences', label: 'Essences' }, { id: 'materials', label: 'Materials' }] }),
    h(L.Panel, { title: 'Inventory', flush: true, aside: h('span', null, '7 of 60') },
      h('div', { ref: box }, h(L.List, { label: 'Inventory, ' + m.name }, ITEMS.map(function (it) {
        return h(L.ListRow, { key: it.id, title: it.title, rarity: it.rarity, icon: it.icon, meta: it.meta, quantity: it.quantity, value: f.number(it.value),
          tags: it.equipped ? h(L.Tag, null, 'Equipped') : null, selected: sel[0] === it.id, onClick: function () { sel[1](it.id); } });
      })))),
    h('div', { className: 'pv-actions' }, h(L.Button, { variant: 'solid', icon: 'inventory' }, 'Equip'), h(L.Button, null, 'Sell'), h(L.Button, { variant: 'quiet' }, 'Compare')),
    h(L.Panel, { title: 'Combat Attributes' }, h(L.Ledger, { title: 'Offense', rows: ATTRS })),
    h('p', { className: 'pv-foot' }, 'Values are sell prices in Cinders. The seven rows take ', h('b', null, ht[0] != null ? ht[0] + 'px' : '\u2014'), '.'));
}

ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv' },
  MODES.map(function (m) { return h(Column, Object.assign({ key: m.id }, m)); })));
</script>
</body>
</html>
