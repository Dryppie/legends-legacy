<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Activity — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); }
.pv { padding: 24px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
.pv-rail { width: 14rem; display: grid; gap: 16px; }
.pv-compact { width: 4rem; }
.pv-label { margin: 0; color: var(--ink-muted); font-size: var(--text-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
var noop = function () {};
function App() {
  var t = React.useState(0.42);
  React.useEffect(function () { var i = setInterval(function () { t[1](function (v) { return v >= 1 ? 0 : v + 0.02; }); }, 400); return function () { clearInterval(i); }; }, []);
  var left = Math.round((1 - t[0]) * 30);
  var time = '00:' + (left < 10 ? '0' : '') + left;
  return h('div', { className: 'pv' },
    h('div', { className: 'pv-rail' },
      h('p', { className: 'pv-label' }, 'At the head of the rail'),
      h(L.Activity, { label: 'Engaged in Combat', remaining: time, progress: t[0], onOpen: noop }),
      h(L.Activity, { label: 'Idle' })),
    h('div', { className: 'pv-compact' },
      h('p', { className: 'pv-label' }, 'Compact'),
      h(L.Activity, { label: 'Engaged in Combat', remaining: time, progress: t[0], onOpen: noop, openLabel: '', compact: true })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
