<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Button — preview</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--ground);
      }
      .pv {
        padding: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        align-items: center;
      }
      .pv-col {
        display: grid;
        gap: 16px;
      }
      .pv-cap {
        margin: 0 0 var(--stack-sm);
        font-size: var(--text-caption);
        line-height: var(--leading-caption);
        color: var(--ink-muted);
      }
      .pv-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--lg-gap);
        align-items: center;
      }
      .pv-states {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: flex-start;
      }
      .pv-state {
        display: grid;
        gap: 6px;
        justify-items: start;
      }
      .pv-state .pv-cap {
        margin: 0;
      }
      /* A still copy of the reason tip, so the card shows what hover and focus open. */
      .pv-tip.lg-why {
        position: static;
        opacity: 1;
        visibility: visible;
        transform: none;
      }
    </style>
  </head>
  <body>
    <div id="root" class="lg-root"></div>
    <script>
      var L = window.LL,
        h = React.createElement,
        F = React.Fragment;
      function State(cap, el) {
        return h(
          "div",
          { className: "pv-state" },
          h("p", { className: "pv-cap" }, cap),
          el,
        );
      }
      function Row(d, cap) {
        return h(
          "div",
          { "data-density": d },
          h("p", { className: "pv-cap" }, cap),
          h(
            "div",
            { className: "pv-row" },
            h(L.Button, { variant: "solid", icon: "inventory" }, "Equip"),
            h(L.Button, null, "Sell"),
            h(L.Button, { variant: "quiet" }, "Cancel"),
          ),
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(
          F,
          null,
          h(
            "div",
            { className: "pv", style: { gap: 14 } },
            h(L.Button, { hotkey: "E" }, "Level up"),
            h(L.Button, { variant: "solid", hotkey: "↵" }, "Enter dungeon"),
            h(L.Button, null, "Details"),
            h(L.Button, { variant: "quiet" }, "Cancel"),
            h(L.Button, { variant: "danger" }, "Abandon"),
            h(L.Button, { variant: "link" }, "Manage"),
            h(L.Button, { size: "sm", icon: "inventory" }, "Inventory"),
          ),
          h(
            "div",
            { className: "pv", style: { paddingTop: 0, display: "block" } },
            h(
              "p",
              { className: "pv-cap" },
              "States — hover, focus or press a blocked button for its reason (Standards · States)",
            ),
            h(
              "div",
              { className: "pv-states" },
              State(
                "Unavailable",
                h(
                  L.Button,
                  { state: "unavailable", reason: "Not while in a dungeon" },
                  "Sell",
                ),
              ),
              State(
                "Locked",
                h(
                  L.Button,
                  {
                    state: "locked",
                    reason: "Unlocks at level 20",
                    hotkey: "A",
                  },
                  "Enter Arena",
                ),
              ),
              State(
                "Restricted",
                h(
                  L.Button,
                  { state: "restricted", reason: "Officers only" },
                  "Withdraw",
                ),
              ),
              State(
                "Insufficient",
                h(
                  L.Button,
                  {
                    variant: "solid",
                    state: "insufficient",
                    shortfall: [{ amount: 250, name: "Cinders" }],
                  },
                  "Upgrade",
                ),
              ),
              State(
                "On cooldown",
                h(L.Button, { state: "cooldown", remaining: 252 }, "Teleport"),
              ),
              State(
                "Pending",
                h(
                  L.Button,
                  {
                    variant: "solid",
                    state: "pending",
                    pendingLabel: "Claiming\u2026",
                  },
                  "Claim",
                ),
              ),
              State(
                "Disabled — rare",
                h(L.Button, { disabled: true, size: "sm" }, "Previous"),
              ),
              State(
                "The reason tip",
                h(
                  "div",
                  { className: "lg-why pv-tip", "aria-hidden": "true" },
                  h("span", { className: "lg-why__word" }, "Locked"),
                  h(
                    "span",
                    { className: "lg-why__reason" },
                    "Unlocks at level 20",
                  ),
                ),
              ),
            ),
          ),
          h(
            "div",
            {
              className: "pv",
              style: { alignItems: "flex-start", gap: 40, paddingTop: 0 },
            },
            Row("comfortable", "Comfortable — 44px"),
            Row("standard", "Standard — 40px"),
            Row("compact", "Compact — 32px"),
          ),
        ),
      );
    </script>
  </body>
</html>
