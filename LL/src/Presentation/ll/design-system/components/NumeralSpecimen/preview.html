<!-- @dsCard group="Foundations" height=1240 width=1280 subtitle="The numeral rules in use: a decimal-aligned attribute column, a Bazaar price column, a delta column, live values that never shift, and the number-and-label order in each context." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NumeralSpecimen — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); }
.pv { display: grid; gap: var(--space-6); padding: var(--space-8); }

/* Signs strip */
.pv-signs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--space-3); margin: 0; padding: 0; list-style: none; }
.pv-signs li { display: grid; gap: 2px; padding: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-container); }
.pv-signs b { font-family: var(--font-numeral); font-size: var(--text-numeral-row); line-height: var(--leading-numeral-row); font-weight: 600; color: var(--ink); white-space: nowrap; }
.pv-signs span { font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }

.pv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-6); align-items: start; }
.pv-stack { display: grid; gap: var(--space-3); }
.pv-note { margin: 0; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-note b { font-weight: 600; color: var(--ink); }

/* Tables */
.pv-table { width: 100%; border-collapse: collapse; }
.pv-table th { padding: 0 var(--space-2) var(--space-2); text-align: left; font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); border-bottom: var(--border-hairline) solid var(--line); white-space: nowrap; }
.pv-table td { padding: var(--space-2); border-bottom: 1px solid var(--line); white-space: nowrap; font-size: var(--text-body-compact); line-height: var(--leading-body-compact-row); }
.pv-table th:first-child, .pv-table td:first-child { padding-left: 0; }
.pv-table th:last-child, .pv-table td:last-child { padding-right: 0; }
.pv-table .num { text-align: right; }
.pv-table td.num, .pv-table td.int, .pv-table td.tail { font-family: var(--font-numeral); font-size: var(--text-numeral-compact); line-height: var(--leading-numeral-compact); font-weight: 600; }
.pv-table td.int { text-align: right; padding-right: 0; }
.pv-table td.tail { text-align: left; padding-left: 0; }
.pv-table tr.is-mine td { background: var(--surface-raised); }
.pv-name { font-family: var(--font-display); font-size: var(--text-name-row); line-height: var(--leading-name-row); }
.pv-when { font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-caption { display: flex; justify-content: space-between; gap: var(--space-3); font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-caption b { font-family: var(--font-numeral); font-size: var(--text-numeral-compact); font-weight: 600; color: var(--ink); }

/* Live values */
.pv-live { display: grid; gap: var(--space-3); }
.pv-bar { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); background: var(--ground-deep); border: 1px solid var(--line); border-radius: var(--radius-container); }
.pv-bar__title { font-family: var(--font-display); font-size: var(--text-name-row); line-height: var(--leading-name-row); margin-right: auto; }
.pv-counter { display: flex; align-items: baseline; gap: var(--space-3); }
.pv-counter__label { width: 124px; flex: none; font-size: var(--text-body-compact); line-height: var(--leading-body-compact-row); color: var(--ink-muted); }
.pv-counter__value { display: inline-block; text-align: right; font-family: var(--font-numeral); font-size: var(--text-numeral-row); line-height: var(--leading-numeral-row); font-weight: 600; }
.pv-counter__after { font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-counter.is-wrong .pv-counter__value { font-variant-numeric: proportional-nums lining-nums; }
.pv-tag { font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); }

/* Order by context */
.pv-order { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-4); margin: 0; padding: 0; list-style: none; }
.pv-order li { display: grid; gap: var(--space-2); align-content: start; padding: var(--space-3) var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-container); }
.pv-order h4 { margin: 0; font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); }
.pv-row { display: flex; align-items: baseline; gap: var(--space-2); font-size: var(--text-body-compact); line-height: var(--leading-body-compact-row); color: var(--ink-muted); }
.pv-row__lead { flex: 1; border-bottom: var(--border-hairline) dotted var(--line-strong); transform: translateY(-4px); min-width: 8px; }
.pv-row b { font-family: var(--font-numeral); font-size: var(--text-numeral-row); line-height: var(--leading-numeral-row); font-weight: 600; color: var(--ink); }
.pv-tip { display: grid; gap: var(--space-1); padding: var(--space-3); background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: var(--radius-float); }
.pv-tip strong { font-family: var(--font-display); font-weight: 400; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); }
.pv-tip p { margin: 0; font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink-muted); }
.pv-tip span { font-size: var(--text-caption); line-height: var(--leading-caption); font-weight: 600; }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment, f = L.format;
var COINS = '../../assets/Currency/Cinders.webp';

/* Split a value into integer and tail cells, so a table column aligns on the decimal point. */
function cells(v, key) {
  var q = f.parts(v);
  if (!q) return [h('td', { key: key + 'i', className: 'int' }, v), h('td', { key: key + 't', className: 'tail' })];
  return [
    h('td', { key: key + 'i', className: 'int' }, q.int),
    h('td', { key: key + 't', className: 'tail' }, q.frac, q.unit ? h('span', { className: 'lg-unit' }, (q.sp ? ' ' : '') + q.unit) : null)
  ];
}
function D(direction, value, polarity) { return h(L.Delta, { direction: direction, value: value, polarity: polarity }); }

var signs = h('ul', { className: 'pv-signs' },
  [[f.number(-12), 'true minus (U+2212)'], [f.range(12, 18), 'range, en dash'], [f.times(1.5), 'multiplier'],
   [f.fraction(3120, 4150), 'fraction, spaced slash'], [f.none, 'unknown or not applicable'], ['0', 'zero is 0'], [f.unit(84, 'HP/5s'), 'unit after, muted']]
    .map(function (s) { return h('li', { key: s[1] }, h('b', null, s[0] === f.unit(84, 'HP/5s') ? h(F, null, '84', h('span', { className: 'lg-unit' }, ' HP/5s')) : s[0]), h('span', null, s[1])); }));

var attributes = h(L.Panel, { title: 'Attributes' }, h('div', { className: 'pv-stack' },
  h(L.Ledger, { title: 'Offense', rows: [
    { label: 'Power', value: f.number(1284) },
    { label: 'Crit Chance', value: f.percent(24.8, 1) },
    { label: 'Health Regen', value: f.unit(84, 'HP/5s') },
    { label: 'Threat', value: f.unit(184.6, 'threat/s', 1) },
    { label: 'Attack Speed', value: f.number(1.12, 2) },
    { label: 'Crit Damage', value: f.times(1.5, 1) },
    { label: 'Life Steal', value: f.percent(0) },
    { label: 'Magic Penetration', value: null }
  ] }),
  h('p', { className: 'pv-note' }, 'Tabular figures, aligned on the decimal point; units after the number, smaller and muted; ', h('b', null, '0'), ' for zero, ', h('b', null, '—'), ' for a stat that does not apply.')));

var ORDERS = [
  { seller: 'Maren', qty: 3, price: 1250 },
  { seller: 'Oswin', qty: 1, price: 1300 },
  { seller: 'You', qty: 5, price: 1280, mine: true },
  { seller: 'Kaelen', qty: 12, price: 1340 },
  { seller: 'Tamsin', qty: 40, price: 1205 }
];
var bazaar = h(L.Panel, { title: 'Bazaar prices', aside: h(L.Tag, { tone: 'rare' }, 'Rare') }, h('div', { className: 'pv-stack' },
  h('div', { className: 'pv-caption' }, h('span', null, 'Dire Wolf Essence · sell orders, in Cinders'), h('span', null, 'Today ', h('b', null, f.range(1205, 1340)))),
  h('table', { className: 'pv-table' },
    h('thead', null, h('tr', null, h('th', { scope: 'col' }, 'Seller'), h('th', { scope: 'col', className: 'num' }, 'Qty'),
      h('th', { scope: 'col', className: 'num', colSpan: 2 }, 'Price each'), h('th', { scope: 'col', className: 'num', colSpan: 2 }, 'Total'))),
    h('tbody', null, ORDERS.map(function (o) {
      return h('tr', { key: o.seller, className: o.mine ? 'is-mine' : null },
        h('td', null, h('span', { className: 'pv-name' }, o.seller)),
        h('td', { className: 'num' }, f.number(o.qty)),
        cells(f.number(o.price, o.price % 1 ? 1 : undefined), 'p'),
        cells(f.number(o.qty * o.price, (o.qty * o.price) % 1 ? 1 : undefined), 't'));
    }))),
  h('p', { className: 'pv-note' }, 'Right-aligned, with the unit in the caption, not in every cell. Mixed precision aligns on the decimal point.')));

var CHANGES = [
  ['Power', '142', D('up', '12', 'better'), '154'],
  ['Crit Chance', f.percent(9.5, 1), D('down', '0.5%', 'worse'), f.percent(9, 1)],
  ['Cooldown', f.unit(8, 's', 1), D('down', '1.2s', 'better'), f.unit(6.8, 's', 1)],
  ['Fire damage', f.times(1.25, 2), D('up', '0.25', 'better'), f.times(1.5, 2)],
  ['Attack Speed', f.number(1.12, 2), D('none', '0', 'neutral'), f.number(1.12, 2)],
  ['Magic Penetration', f.none, D('none', '0', 'neutral'), f.none]
];
var changes = h(L.Panel, { title: 'Changes' }, h('div', { className: 'pv-stack' },
  h('div', { className: 'pv-caption' }, h('span', null, 'If you equip Ember Fang in place of Iron Sabre')),
  h('table', { className: 'pv-table' },
    h('thead', null, h('tr', null, h('th', { scope: 'col' }, 'Stat'), h('th', { scope: 'col', className: 'num', colSpan: 2 }, 'Now'),
      h('th', { scope: 'col', className: 'num' }, 'Change'), h('th', { scope: 'col', className: 'num', colSpan: 2 }, 'After'))),
    h('tbody', null, CHANGES.map(function (c) {
      return h('tr', { key: c[0] }, h('td', null, c[0]), cells(c[1], 'n'), h('td', { className: 'num' }, c[2]), cells(c[3], 'a'));
    }))),
  h('p', { className: 'pv-note' }, 'Every change carries ▲ or ▼ and a sign, or ±0; a shorter cooldown is better though the number falls.')));

function Live() {
  var st = React.useState({ cinders: 9870, dmg: 940, hp: 4150, bid: 9990, left: 134, n: 0 });
  var s = st[0];
  React.useEffect(function () {
    var t = setInterval(function () {
      st[1](function (o) {
        var n = o.n + 1;
        return {
          n: n,
          cinders: o.cinders + (n % 3 === 0 ? 45 : 0),
          dmg: o.dmg + 37 + (n * 53) % 91,
          hp: Math.max(0, 4150 - ((n * 437) % 4150)),
          bid: o.bid + (n % 4 === 0 ? 10 : 0),
          left: o.left > 0 ? o.left - 1 : 134
        };
      });
    }, 700);
    return function () { clearInterval(t); };
  }, []);
  var mins = Math.floor(s.left / 60), secs = s.left % 60;
  function counter(label, value, reserve, after, wrong) {
    return h('div', { className: 'pv-counter' + (wrong ? ' is-wrong' : '') },
      h('span', { className: 'pv-counter__label' }, label),
      h('span', { className: 'pv-counter__value', style: wrong ? null : { minWidth: reserve + 'ch' } }, value),
      after ? h('span', { className: 'pv-counter__after' }, after) : null);
  }
  return h(L.Panel, { title: 'Live values' }, h('div', { className: 'pv-live' },
    h('div', { className: 'pv-bar' }, h('span', { className: 'pv-bar__title' }, 'Aldric Vane'),
      h(L.CurrencyPill, { name: 'Cinders', amount: s.cinders, iconSrc: COINS, reserve: 6 })),
    h(L.Meter, { tone: 'hp', size: 'bar', label: 'HP', value: s.hp, max: 4150 }),
    counter('Damage dealt', f.number(s.dmg), 6, 'this fight'),
    counter('Current bid', f.number(s.bid), 6, 'Cinders · ' + mins + 'm ' + (secs < 10 ? '0' : '') + secs + 's left'),
    h('span', { className: 'pv-tag' }, 'Don’t'),
    counter('Current bid', f.number(s.bid), 0, 'Cinders · proportional figures, no reserved width', true),
    h('p', { className: 'pv-note' }, 'Tabular figures and a reserved width: the digits change, nothing beside them moves. The pill’s amount never narrows while it is on screen.')));
}

var order = h('ul', { className: 'pv-order' },
  h('li', null, h('h4', null, 'TopBar'), h(L.CurrencyPill, { name: 'Cinders', amount: 12480, iconSrc: COINS }),
    h('p', { className: 'pv-note' }, 'Art, then amount, then name.')),
  h('li', null, h('h4', null, 'Cost list'),
    h('div', { className: 'pv-row' }, 'Upgrade cost', h('span', { className: 'pv-row__lead' }), h('b', null, '40', h('span', { className: 'lg-unit' }, ' Soulstones'))),
    h('p', { className: 'pv-note' }, 'What you pay for, then amount, then currency.')),
  h('li', null, h('h4', null, 'Table'),
    h('table', { className: 'pv-table' }, h('thead', null, h('tr', null, h('th', { scope: 'col', className: 'num' }, 'Price each'))),
      h('tbody', null, h('tr', null, h('td', { className: 'num' }, '1,250')))),
    h('p', { className: 'pv-note' }, 'Unit in the header; the cell is the number.')),
  h('li', null, h('h4', null, 'Tooltip'),
    h('div', { className: 'pv-tip' }, h('strong', null, 'Armor'), h('p', null, 'Converted with diminishing returns.'), h('span', null, 'From equipment: 240 Armor Rating')),
    h('p', { className: 'pv-note' }, 'Label, colon, number, unit.')),
  h('li', null, h('h4', null, 'Ledger'),
    h('div', { className: 'pv-row' }, 'Armor', h('span', { className: 'pv-row__lead' }), h('b', null, '38', h('span', { className: 'lg-unit' }, '%'))),
    h('p', { className: 'pv-note' }, 'Label left, value right, unit after.')));

ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv' },
  signs,
  h('div', { className: 'pv-grid' }, attributes, bazaar, changes, h(Live)),
  order));
</script>
</body>
</html>
