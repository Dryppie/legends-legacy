<style>
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); }
.pv { display: grid; gap: var(--section-sm); padding: var(--section-md); }

.pv-set { display: flex; flex-wrap: wrap; align-items: center; gap: var(--inline-sm); }

.pv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); gap: var(--section-sm); align-items: start; }

.pv-row { display: flex; flex-wrap: wrap; gap: var(--inline-sm); align-items: center; }
.pv-note { margin: 0; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-note kbd { font: inherit; font-weight: 600; color: var(--ink); }
.pv-hear { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--stack-sm); }
.pv-hear li { display: grid; gap: 2px; }

.pv-hear q { font-size: var(--text-body-compact); line-height: var(--leading-body-compact); quotes: "\201C" "\201D"; }
.pv-log { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--stack-xs); min-height: 4.5rem; font-size: var(--text-body-compact); line-height: var(--leading-body-compact); }
.pv-log li span { color: var(--ink-muted); }
.pv-icon { display: inline-grid; place-items: center; width: var(--control-standard); height: var(--control-standard); border: 1px solid var(--line-strong); border-radius: var(--radius-control); background: var(--surface); color: var(--ink); cursor: pointer; }
.pv-icon:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }
