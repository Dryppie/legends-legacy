<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Icon — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); }
.pv { padding: 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
.pv-col { display: grid; gap: 16px; }
.pv-icons { display: grid; grid-template-columns: repeat(8, 1fr); gap: 16px 8px; padding: 24px 24px 8px; color: var(--ink); } .pv-ic { display: grid; justify-items: center; gap: 6px; } .pv-ic span { font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); text-align: center; }
.pv-scale { display: grid; gap: 12px; padding: 8px 24px 24px; }
.pv-row { display: grid; grid-template-columns: 9rem minmax(0, 1fr); align-items: center; gap: 16px; }
.pv-row > span { font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-row > span b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums lining-nums; }
.pv-line { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: var(--ink-muted); }
.pv-name { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink); }
.pv-name .lg-icon { color: var(--gilt); }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
// The set at 24 (icon-lg), then the scale: 20 and 16 for line icons, 12 for the one marker.
var lines = L.Icon.names.filter(function (n) { return n !== 'nobility'; });
function row(size, token, kids) { return h('div', { className: 'pv-row' }, h('span', null, h('b', null, size + 'px'), ' \u00b7 ' + token), h('div', { className: 'pv-line' }, kids)); }
ReactDOM.createRoot(document.getElementById('root')).render(h(F, null,
  h('div', { className: 'pv-icons' },
    L.Icon.names.map(function (n) { return h('div', { key: n, className: 'pv-ic' }, h(L.Icon, { name: n, size: 24 }), h('span', null, n)); })),
  h('div', { className: 'pv-scale' },
    row(20, 'icon-md', lines.map(function (n) { return h(L.Icon, { key: n, name: n, size: 20 }); })),
    row(16, 'icon-sm', lines.map(function (n) { return h(L.Icon, { key: n, name: n, size: 16 }); })),
    row(12, 'icon-marker', h('span', { className: 'pv-name' }, h('span', { role: 'img', 'aria-label': 'Noble', title: 'Active Nobility', style: { display: 'inline-flex' } }, h(L.Icon, { name: 'nobility', size: 12 })), 'Aldric Vane')))));
</script>
</body>
</html>
