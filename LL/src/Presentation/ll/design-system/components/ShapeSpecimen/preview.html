<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ShapeSpecimen — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); }
.pv { display: grid; gap: var(--section-lg); padding: var(--section-md); }
.pv-sec { display: grid; gap: var(--stack-lg); align-content: start; }
.pv-sec > header { display: grid; gap: var(--stack-xs); }
.pv-h { margin: 0; font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); }
.pv-note { margin: 0; max-width: var(--lg-measure); font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-note b, .pv-note code, .pv-mean code, .pv-spec code, .pv-why code, .pv-opt > header code { font: inherit; font-weight: 600; color: var(--ink); }
.pv-t { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); letter-spacing: var(--tracking-display); color: var(--ink); }
.pv-t .pv-num { font-family: var(--font-numeral); font-size: var(--text-numeral-row); font-weight: 600; letter-spacing: 0; color: var(--ink-muted); }
.pv-mean { margin: 0; font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink-muted); }

.pv-cells { display: grid; gap: var(--section-sm); }
.pv-cells--5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.pv-cells--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pv-cell { display: grid; gap: var(--stack-md); align-content: start; min-width: 0; }
.pv-sample { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--inline-lg); min-height: 8.5rem; padding: var(--inset-lg); container: lg-region / inline-size; }
.pv-sample--col { flex-direction: column; align-items: stretch; }
.pv-spec { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--stack-xs) var(--inline-md); font-size: var(--text-caption); line-height: var(--leading-caption); }
.pv-spec dt { color: var(--ink-muted); }
.pv-spec dd { margin: 0; color: var(--ink); }
.pv-rail { padding-left: var(--inset-lg); width: 12rem; }
.pv-rail .lg-rail__item { display: flex; }
.pv-name { display: inline-flex; align-items: center; gap: var(--inline-sm); font-family: var(--font-display); font-size: var(--text-name-row); line-height: var(--leading-name-row); color: var(--ink); }
.pv-name .lg-icon { width: var(--icon-marker); height: var(--icon-marker); color: var(--gilt); }
.pv-deltas { display: grid; gap: var(--stack-xs); font-size: var(--text-body-compact); line-height: var(--leading-body-compact-row); }
.pv-deltas > div { display: flex; justify-content: space-between; gap: var(--inline-lg); }
.pv-deltas span:first-child { color: var(--ink-muted); }

/* ✦ */
.pv-glyphs { display: flex; align-items: baseline; gap: var(--inline-lg); color: var(--gilt); }
.pv-glyphs span { display: grid; justify-items: center; gap: var(--stack-xs); }
.pv-glyphs b { font-weight: 400; font-size: 2.75rem; line-height: 1; }
.pv-glyphs i { font-style: normal; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-perks { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--stack-xs); font-size: var(--text-body-compact); line-height: var(--leading-body-compact); }

.pv-perks li > span { flex: none; width: 0.75rem; text-align: center; }
.pv-perks--star li > span { color: var(--gilt); font-size: var(--text-caption); }
.pv-perks--dash li > span { color: var(--ink-muted); }
.pv-beside { display: grid; gap: var(--stack-md); width: 100%; }

/* The Button comparison. Column A restores the pill in this preview only: the system's Button is B (D-064). */
.pv-ab { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--section-md); align-items: start; }
.pv-opt { display: grid; gap: var(--section-sm); align-content: start; min-width: 0; }
.pv-opt > header { display: flex; align-items: baseline; gap: var(--inline-md); flex-wrap: wrap; }
.pv-opt > header span { font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-ctx { display: grid; gap: var(--stack-sm); min-width: 0; }
.pv-ctx > .pv-lab { font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); }
.pv-pair { display: grid; grid-template-columns: 19rem minmax(0, 1fr); gap: var(--section-sm); align-items: start; }
.pv-folio { height: 36rem; }
.pv-dialog { display: grid; gap: var(--stack-lg); padding: var(--inset-xl); container: lg-region / inline-size; }
.pv-dialog h4 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); color: var(--ink); }
.pv-dialog p { margin: 0; font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink-muted); }
.pv-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--inline-sm); padding-top: var(--stack-md); border-top: var(--border-hairline) solid var(--line); }
.pv-a .lg-btn { border-radius: 999px; }
.pv-a .lg-btn:not(:has(.lg-key)) { padding: 0 calc(var(--lg-cell-x) + var(--space-2)); }
.pv-a .lg-btn:has(.lg-key) { padding: 0 var(--lg-cell-x) 0 calc(var(--lg-cell-x) + var(--space-2)); }
.pv-a .lg-key { border-radius: 999px; }

.pv-corners { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--section-sm); }
.pv-corner { display: grid; gap: var(--stack-md); align-content: start; }
.pv-corner .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--inline-md); min-height: 3.5rem; }
.pv-corner--pill .lg-btn { border-radius: 999px; }
.pv-corner--pill .lg-btn:not(:has(.lg-key)) { padding: 0 calc(var(--lg-cell-x) + var(--space-2)); }
.pv-corner--bevel .lg-btn { border-radius: 0.375rem; corner-shape: bevel; }
.pv-why { margin: 0; padding-left: 1.125rem; list-style-type: "\2013\00a0"; display: grid; gap: 2px; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-verdict { display: grid; gap: var(--stack-md); max-width: 62rem; padding: var(--inset-lg) var(--inset-xl); }
.pv-verdict ul { margin: 0; padding-left: 1.125rem; list-style-type: "\2013\00a0"; display: grid; gap: var(--stack-xs); font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink-muted); }
.pv-verdict b { font-weight: 600; color: var(--ink); }

/* Radius roles */
.pv-sq { width: 100%; height: 5rem; background: var(--folio); box-shadow: var(--shadow-panel); }
.pv-tip { max-width: 14rem; padding: var(--inset-md); display: grid; gap: var(--stack-xs); }
.pv-tip b { font-family: var(--font-display); font-weight: 400; font-size: var(--text-name-row); line-height: var(--leading-name-row); }
.pv-tip span { font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--inline-md); }
.pv-controls .lg-input { width: 7rem; box-sizing: border-box; }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment, f = L.format;
var CORNER = '../../assets/Ornaments/CornerOrnament.svg';
function cx() { return Array.prototype.filter.call(arguments, Boolean).join(' '); }
function c(t) { return h('code', null, t); }

var OPPONENTS = [
  { name: 'Seraphine', level: 142, guild: 'EMB', rating: 18420 },
  { name: 'Corvin Ashe', level: 140, guild: 'NTH', rating: 17985 },
  { name: 'Ysolde', level: 139, guild: 'GRV', rating: 16902 },
  { name: 'Brannoc', level: 135, guild: 'NTH', rating: 16511 }
];

function Section(p) {
  return h('section', { className: 'pv-sec', 'aria-labelledby': p.id },
    h('header', null, h('h2', { className: 'pv-h', id: p.id }, p.title), p.note ? h('p', { className: 'pv-note' }, p.note) : null),
    p.children);
}
function Cell(p) {
  return h('div', { className: 'pv-cell' },
    h('div', { className: cx('pv-sample', p.col && 'pv-sample--col', p.plain ? null : 'lg-level-1') }, p.sample),
    h('h3', { className: 'pv-t' }, p.name),
    p.mean ? h('p', { className: 'pv-mean' }, p.mean) : null,
    p.spec ? h('dl', { className: 'pv-spec' }, p.spec.map(function (s) { return h(F, { key: s[0] }, h('dt', null, s[0]), h('dd', null, s[1])); })) : null);
}

/* ---------- 1 · Vocabulary ---------- */
function Vocabulary() {
  return h(Section, { id: 'pv-voc', title: 'Shape vocabulary', note: 'Each shape means one thing, everywhere it appears. A shape is never a decorative bullet, and never borrowed for a meaning of its own.' },
    h('div', { className: 'pv-cells pv-cells--5' },
      h(Cell, { name: 'Hexagon', mean: 'A sigil: a stat, mastery or constellation value.',
        sample: h(F, null, h(L.Sigil, { value: 42 }), h(L.Sigil, { value: 3, state: 'ready' }), h(L.Sigil, { value: 9, size: 'sm' })),
        spec: [['Where', 'Sigil; the Constellation’s values; a Combat Style’s mastery'], ['Never', 'A section icon, or a frame for anything but a value']] }),
      h(Cell, { name: 'Diamond', mean: 'A milestone, a ready or claimable marker, or the current location.', col: true,
        sample: h(F, null,
          h(L.Track, { steps: 5, current: 2, startLabel: 'Floor 1', endLabel: 'Boss', label: 'World Tower' }),
          h('div', { className: 'pv-rail' }, h('a', { className: 'lg-rail__item is-active', href: '#', 'aria-current': 'page', onClick: function (e) { e.preventDefault(); } }, h(L.Icon, { name: 'overview', size: 20 }), h('span', { className: 'lg-rail__title' }, 'Overview')))),
        spec: [['Where', 'Track and Constellation nodes; the Sigil’s ready mark; the NavRail’s current item; the PageHeader'], ['Never', 'A bullet, a badge, a delta or the Nobility mark']] }),
      h(Cell, { name: 'Square', mean: 'An item or equipment slot.',
        sample: h(F, null, h(L.ItemSlot, { icon: 'essences', rarity: 'Rare', size: 'sm', caption: false }), h(L.ItemSlot, { size: 'sm', caption: false, slotLabel: 'Empty' })),
        spec: [['Where', 'ItemSlot, ListRow thumbnails, LoadoutSlot; dashed inside when empty'], ['Never', 'A data tile, a portrait or a decoration']] }),
      h(Cell, { name: 'Circle', mean: 'Presence: online, or when last seen.', col: true,
        sample: h(F, null, h(L.Presence, { online: true }), h(L.Presence, { online: false, lastSeen: '2h ago' })),
        spec: [['Where', 'The Presence dot, and nothing else'], ['Never', 'A count badge, an icon button, a bullet or a portrait: portraits are framed 3 : 4']] }),
      h(Cell, { name: 'Rectangle', mean: 'A container; at control size, a control or a label.', col: true,
        sample: h(L.Panel, { title: 'Pending loot', aside: h(L.Tag, null, '4 items') }, h(L.Button, { size: 'sm' }, 'Retreat')),
        spec: [['Where', 'Panels, dialogs and tiles (square corners); Buttons, inputs, Tags, key caps and counts (radius-control)'], ['Never', 'A pill: no element takes a full radius']] })),
    h('div', { className: 'pv-cells pv-cells--3' },
      h(Cell, { name: 'Triangle', mean: 'A delta’s direction. Unchanged has no shape: ±0.', col: true,
        sample: h('div', { className: 'pv-deltas' },
          h('div', null, h('span', null, 'Power'), h(L.Delta, { direction: 'up', polarity: 'better', value: '12' })),
          h('div', null, h('span', null, 'Cooldown'), h(L.Delta, { direction: 'down', polarity: 'better', value: '1.2s' })),
          h('div', null, h('span', null, 'Armor'), h(L.Delta, { direction: 'none', value: '0' }))),
        spec: [['Where', 'Delta, and every comparison built on it'], ['Never', 'A sort arrow or a disclosure: those are icons']] }),
      h(Cell, { name: 'Star polygon', mean: 'The sign of an attribute, school or region: one point count each.',
        sample: h(F, null, h(L.Emblem, { points: 6, size: 72 }), h(L.Emblem, { points: 8, size: 72 })),
        spec: [['Where', 'Emblem (Registries · Emblem point counts)'], ['Never', 'A selection marker or a list marker']] }),
      h(Cell, { name: 'Crown', mean: 'Active Nobility. A sign, not a shape: it replaces the ◆ (D-066).',
        sample: h('span', { className: 'pv-name' }, h('span', { role: 'img', 'aria-label': 'Noble', title: 'Active Nobility', style: { display: 'inline-flex' } }, h(L.Icon, { name: 'nobility', size: 12 })), 'Aldric Vane'),
        spec: [['Where', 'Before a character’s name, under the Nobility display rules (D-007)'], ['Never', 'Any other status, and never in a colour but gilt']] })));
}

/* ---------- 2 · The ✦ list marker ---------- */
function Marker() {
  var PERKS = ['+3 Equipment and Essence loadouts', '+3 Arena ticket capacity', '7 days of offline combat retention'];
  function List(p) { return h('ul', { className: 'pv-perks pv-perks--' + p.kind }, PERKS.map(function (x) { return h('li', { key: x }, h('span', { 'aria-hidden': 'true' }, p.mark), x); })); }
  return h(Section, { id: 'pv-mark', title: '✦ list marker', note: 'It conflicts. At list size the four-point ✦ reads as a diamond, beside the Track’s milestones and the rail’s marker, and it is also a four-point star beside the Emblem’s star polygons. It is retired: lists take an en dash.' },
    h('div', { className: 'pv-cells pv-cells--3' },
      h(Cell, { name: 'Up close', mean: 'Enlarged, they differ; at list size, in gilt, the star’s thin arms vanish and it reads as the diamond.',
        sample: h('div', { className: 'pv-glyphs' },
          h('span', null, h('b', { 'aria-hidden': 'true' }, '✦'), h('i', null, 'List marker')),
          h('span', null, h('b', { 'aria-hidden': 'true' }, '◆'), h('i', null, 'Was Nobility')),
          h('span', null, h('b', { 'aria-hidden': 'true' }, '◇'), h('i', null, 'Was ±0'))) }),
      h(Cell, { name: 'Before: ✦', mean: 'Perks marked with ✦ in gilt, beside a Track: the eye pairs the markers with the milestones.', col: true,
        sample: h('div', { className: 'pv-beside' }, h(List, { kind: 'star', mark: '✦' }), h(L.Track, { steps: 4, current: 1, label: 'Nobility tier' })) }),
      h(Cell, { name: 'After: –', mean: h(F, null, 'The en dash in ', c('ink-muted'), ': a stroke, not a shape, so it marks nothing. A range dash sits between two numbers with no spaces, so the two never meet.'), col: true,
        sample: h('div', { className: 'pv-beside' }, h(List, { kind: 'dash', mark: '–' }), h(L.Track, { steps: 4, current: 1, label: 'Nobility tier' })) })));
}

/* ---------- 3 · Button: pill or engraved rectangle ---------- */
function Arena() {
  return h(L.Panel, { title: 'Arena opponents', flush: true, density: 'compact', aside: h('span', null, '4 tickets left') },
    h(L.List, { label: 'Arena opponents' }, OPPONENTS.map(function (o) {
      return h(L.ListRow, { key: o.name, title: o.name, meta: 'Lv ' + o.level + ' · [' + o.guild + ']', value: o.rating, trailing: h(L.Button, { size: 'sm' }, 'Challenge') });
    })));
}
function Opponent() {
  return h('div', { className: 'pv-folio' }, h(L.Folio, {
    cornerSrc: CORNER, eyebrow: 'Arena opponent', title: 'Seraphine', ariaLabel: 'Seraphine',
    lore: 'Undefeated at the Ember Gate for nine days.',
    actions: h(L.Button, { variant: 'solid', hotkey: 'C' }, 'Challenge')
  }, h(L.Ledger, { title: 'Record', rows: [{ label: 'Rating', value: f.number(18420) }, { label: 'Wins', value: 312 }, { label: 'Win rate', value: '71%' }] })));
}
function Dialog() {
  return h('div', { className: 'pv-dialog lg-level-3', role: 'dialog', 'aria-label': 'Challenge Seraphine' },
    h('h4', null, 'Challenge Seraphine?'),
    h('p', null, 'Costs 1 Arena ticket. You have 4 of 5 today. The fight starts at once and cannot be undone.'),
    h('div', { className: 'pv-foot' }, h(L.Button, { hotkey: 'Esc' }, 'Cancel'), h(L.Button, { variant: 'solid', hotkey: '↵' }, 'Challenge')));
}
function Option(p) {
  return h('div', { className: cx('pv-opt', p.cls) },
    h('header', null, h('h3', { className: 'pv-t' }, p.title), h('span', null, p.sub)),
    h('div', { className: 'pv-ctx' }, h('span', { className: 'pv-lab' }, 'Opponent row'), h(Arena)),
    h('div', { className: 'pv-pair' },
      h('div', { className: 'pv-ctx' }, h('span', { className: 'pv-lab' }, 'One solid action'), h(Opponent)),
      h('div', { className: 'pv-ctx' }, h('span', { className: 'pv-lab' }, 'Dialog footer'), h(Dialog))),
    h('ul', { className: 'pv-why' }, p.why.map(function (t, i) { return h('li', { key: i }, t); })));
}
function Corner(p) {
  return h('div', { className: cx('pv-corner', 'pv-corner--' + p.k) },
    h('h4', { className: 'pv-t' }, p.name),
    h('div', { className: 'pv-row' }, h(L.Button, { variant: 'solid', size: 'md', density: 'comfortable' }, 'Attune'), h(L.Button, { size: 'md' }, 'Sell'), h(L.Button, { size: 'sm' }, 'Challenge')),
    h('ul', { className: 'pv-why' }, p.why.map(function (t, i) { return h('li', { key: i }, t); })));
}
function Buttons() {
  var bevel = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('corner-shape', 'bevel');
  return h(Section, { id: 'pv-btn', title: 'Button shape', note: 'The same three moments drawn both ways: a row of opponents, a Folio with its one solid action, and a dialog footer. Only the Button’s corners and side room differ.' },
    h('div', { className: 'pv-ab' },
      h(Option, { cls: 'pv-a', title: 'A · The pill', sub: 'radius 999px, as before',
        why: ['Nothing else is a pill, so it stands out as a control', 'The look of any rounded app: soft beside square Panels and the Folio’s engraved frame', 'The round ends need 8px more side room, taken from each row’s name column', 'In a footer, pills beside a square sheet read as chips'] }),
      h(Option, { title: 'B · The engraved rectangle', sub: h(F, null, c('radius-control'), ' (4px), chosen (D-064)'),
        why: ['One family of forms with the Panels, slots and Tags: square and engraved', 'The solid gilt plate reads as brass, not a call to action from another app', 'Tighter: 4px less on each side, so rows keep room for the name', 'Told from a Tag by height (32–44px against 20px), a fill, a line-strong edge and sentence-case Barlow'] })),
    h('div', { className: 'pv-corners' },
      h(Corner, { k: 'pill', name: 'Pill', why: ['A full radius: round ends at every height'] }),
      h(Corner, { k: 'rect', name: 'Rectangle', why: ['radius-control, 4px', 'Holds at 32px and at 44px', 'The focus ring follows the corner'] }),
      h(Corner, { k: 'bevel', name: 'Chamfer', why: [bevel ? 'Drawn here with corner-shape: bevel' : 'This browser cannot draw it: it falls back to rounding', 'Only Chromium browsers draw corner-shape; Firefox and Safari show a rounded corner instead', 'It reads at 32px, but nothing else in the system is cut this way'] })),
    h('div', { className: 'pv-verdict lg-level-1' },
      h('h3', { className: 'pv-t' }, 'Recommendation: B, the engraved rectangle'),
      h('ul', null,
        h('li', null, h('b', null, 'It is the house style.'), ' Square and engraved, with a little rounding where the hand touches, so controls belong with the containers, slots and Tags.'),
        h('li', null, h('b', null, 'It is denser.'), ' The same label takes 8px less width, which matters in 32px rows of names and ratings.'),
        h('li', null, h('b', null, 'It carries across.'), ' Inputs, key caps, tabs, clickable CurrencyPills and count badges take the same corner, so SearchField’s input and its Search button match.'),
        h('li', null, h('b', null, 'The chamfer waits.'), ' It is the most engraved look, but only Chromium draws it with its edge and focus ring intact; revisit when Firefox and Safari ship corner-shape.'))));
}

/* ---------- 4 · Radius by role ---------- */
function Radius() {
  return h(Section, { id: 'pv-rad', title: 'Radius by role', note: 'Four tokens, named for what they round. There is no pill.' },
    h('div', { className: 'pv-cells pv-cells--5' },
      h(Cell, { name: h(F, null, 'Square ', h('span', { className: 'pv-num' }, '0')), mean: 'Regions: the Folio, the Banner, the Stage, the rail and the Page.', plain: true, sample: h('div', { className: 'pv-sq', 'aria-hidden': 'true' }) }),
      h(Cell, { name: h(F, null, 'radius-container ', h('span', { className: 'pv-num' }, '2px')), mean: 'Panels, dialog sheets, the band SectionRule and row washes.', plain: true, col: true,
        sample: h(L.Panel, { title: 'Lore' }, h('p', { className: 'pv-mean' }, 'The Ember Wolf hunts in pairs.')) }),
      h(Cell, { name: h(F, null, 'radius-control ', h('span', { className: 'pv-num' }, '4px')), mean: 'Controls, tags and slots: Buttons, inputs, tabs, key caps, Tags, counts, ItemSlots and StatTiles.', plain: true,
        sample: h('div', { className: 'pv-controls' }, h(L.Button, { size: 'sm', hotkey: 'E' }, 'Equip'), h('input', { className: 'lg-input', 'aria-label': 'Quantity', defaultValue: '3' }), h(L.Tag, { tone: 'new' }, '+ New'), h(L.ItemSlot, { icon: 'essences', rarity: 'Epic', size: 'sm', caption: false })) }),
      h(Cell, { name: h(F, null, 'radius-float ', h('span', { className: 'pv-num' }, '8px')), mean: 'What floats: tooltips, hover cards, menus, toasts, the chat drawer.', plain: true,
        sample: h('div', { className: 'pv-tip lg-level-2--float', role: 'tooltip' }, h('b', null, 'Seraphine'), h('span', null, 'Rating 18,420 · 312 wins')) }),
      h(Cell, { name: h(F, null, 'radius-circle ', h('span', { className: 'pv-num' }, '50%')), mean: 'The Presence dot. The one circle.', plain: true, sample: h(L.Presence, { online: true }) })));
}

ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv' }, h(Vocabulary), h(Marker), h(Buttons), h(Radius)));
</script>
