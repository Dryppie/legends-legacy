<!-- @dsCard group="Foundations" height=1170 width=1280 subtitle="Every type style by role, with its face, size and line heights, and the four type rules." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TypeRamp — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); }
.pv { display: grid; gap: var(--space-8); padding: var(--space-8); }

/* Rules strip */
.pv-rules { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); margin: 0; padding: 0; list-style: none; }
.pv-rules li { display: grid; gap: var(--space-1); padding: var(--space-3) var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-container); }
.pv-rules b { font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); }
.pv-rules span { font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink); }

/* The ladder */
.pv-ramp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-10); align-items: start; }
.pv-col { display: grid; gap: var(--space-6); }
.pv-group { display: grid; }
.pv-group > h3 {
  display: flex; align-items: center; gap: var(--space-3); margin: 0 0 var(--space-1);
  font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted);
}
.pv-group > h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.pv-step { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: var(--space-4); align-items: center; padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
.pv-step:last-child { border-bottom: 0; }
.pv-meta { display: grid; }
.pv-name { font-size: var(--text-caption); line-height: var(--leading-caption); font-weight: 600; color: var(--ink); }
.pv-spec { font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-sample { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-codes { display: flex; align-items: center; gap: var(--space-3); }

/* One class per ramp style, built from the tokens */
.s-level-numeral { font-family: var(--font-display); font-size: var(--text-level-numeral); line-height: var(--leading-level-numeral); letter-spacing: var(--tracking-hero); color: var(--gilt); }
.s-title-xl { font-family: var(--font-display); font-size: var(--text-title-xl); line-height: var(--leading-title-xl); letter-spacing: var(--tracking-display); }
.s-title-lg { font-family: var(--font-display); font-size: var(--text-title-lg); line-height: var(--leading-title-lg); letter-spacing: var(--tracking-display); }
.s-title-md { font-family: var(--font-display); font-size: var(--text-title-md); line-height: var(--leading-title-md); letter-spacing: var(--tracking-display); }
.s-title-sm { font-family: var(--font-display); font-size: var(--text-title-sm); line-height: var(--leading-title-sm); letter-spacing: var(--tracking-display); }
.s-name-header { font-family: var(--font-display); font-size: var(--text-name-header); line-height: var(--leading-name-header); letter-spacing: var(--tracking-display); }
.s-name-row { font-family: var(--font-display); font-size: var(--text-name-row); line-height: var(--leading-name-row); }
.s-body { font-size: var(--text-body); line-height: var(--leading-body); }
.s-body-strong { font-size: var(--text-body); line-height: var(--leading-body); font-weight: 600; }
.s-body-compact { font-size: var(--text-body-compact); line-height: var(--leading-body-compact); }
.s-body-compact-strong { font-size: var(--text-body-compact); line-height: var(--leading-body-compact); font-weight: 600; }
.s-lore { font-family: var(--font-lore); font-style: italic; font-size: var(--text-lore); line-height: var(--leading-lore); }
.s-lore-sm { font-family: var(--font-lore); font-style: italic; font-size: var(--text-lore-sm); line-height: var(--leading-lore-sm); }
.s-label { font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; }
.s-caption { font-size: var(--text-caption); line-height: var(--leading-caption); }
.s-caption-strong { font-size: var(--text-caption); line-height: var(--leading-caption); font-weight: 600; }
.s-code { font-size: var(--text-code); line-height: var(--leading-code); font-weight: 700; letter-spacing: var(--tracking-code); text-transform: uppercase; }
.s-tab { font-family: var(--font-display); font-size: var(--text-tab); line-height: var(--leading-tab); letter-spacing: var(--tracking-caps); text-transform: uppercase; }
.s-nav { font-size: var(--text-nav); line-height: var(--leading-nav); font-weight: 500; letter-spacing: var(--tracking-nav); text-transform: uppercase; color: var(--ink-muted); }
.s-nav-active { font-size: var(--text-nav); line-height: var(--leading-nav); font-weight: 600; letter-spacing: var(--tracking-nav); text-transform: uppercase; }
.s-numeral-headline { font-family: var(--font-display); font-size: var(--text-numeral-headline); line-height: var(--leading-numeral-headline); letter-spacing: var(--tracking-headline); color: var(--gilt); font-variant-numeric: tabular-nums; }
.s-numeral-stat { font-family: var(--font-numeral); font-size: var(--text-numeral-stat); line-height: var(--leading-numeral-stat); font-weight: 700; font-variant-numeric: tabular-nums; }
.s-numeral-row { font-family: var(--font-numeral); font-size: var(--text-numeral-row); line-height: var(--leading-numeral-row); font-weight: 600; font-variant-numeric: tabular-nums; }
.s-numeral-compact { font-family: var(--font-numeral); font-size: var(--text-numeral-compact); line-height: var(--leading-numeral-compact); font-weight: 600; font-variant-numeric: tabular-nums; }
.s-sigil-label { font-family: var(--font-display); font-size: var(--text-sigil-label); line-height: var(--leading-sigil-label); }
.s-body-readable { font-family: var(--font-readable); font-size: var(--text-body-readable); line-height: var(--leading-body-readable); }
.is-muted { color: var(--ink-muted); }

.pv-codes .r-common { color: var(--rarity-common); } .pv-codes .r-uncommon { color: var(--rarity-uncommon); } .pv-codes .r-rare { color: var(--rarity-rare); }
.pv-codes .r-epic { color: var(--rarity-epic); } .pv-codes .r-unique { color: var(--rarity-unique); } .pv-codes .r-legendary { color: var(--rarity-legendary); } .pv-codes .r-legacy { color: var(--rarity-legacy); }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;

function step(name, spec, sample, cls) {
  return h('div', { className: 'pv-step', key: name },
    h('div', { className: 'pv-meta' }, h('span', { className: 'pv-name' }, name), h('span', { className: 'pv-spec' }, spec)),
    h('div', { className: 'pv-sample ' + (cls === undefined ? 's-' + name : cls) }, sample));
}
function group(title, steps) { return h('section', { className: 'pv-group', key: title }, h('h3', null, title), steps); }

var CODES = [['C', 'common'], ['UC', 'uncommon'], ['R', 'rare'], ['E', 'epic'], ['U', 'unique'], ['L', 'legendary'], ['LG', 'legacy']];

var colA = h('div', { className: 'pv-col' },
  group('Display', [
    step('level-numeral', 'Marcellus 84 / 76 · once per screen', '17'),
    step('title-xl', 'Marcellus 56 / 60 · once per screen', 'Power'),
    step('title-lg', 'Marcellus 36 / 40', 'Cinder Bazaar')
  ]),
  group('Section titles', [
    step('title-md', 'Marcellus 24 / 30', 'Combat Attributes'),
    step('title-sm', 'Marcellus 20 / 26', 'Recent trades')
  ]),
  group('Entity names', [
    step('name-header', 'Marcellus 24 / 30', 'Aldric Vane'),
    step('name-row', 'Marcellus 17 / 22', 'Ember Wolf Essence')
  ]),
  group('Numerals', [
    step('numeral-headline', 'Marcellus 64 / 64 · never in a table', '1,284'),
    step('numeral-stat', 'Barlow Condensed 700 · 22 / 24', '4,150'),
    step('numeral-row', 'Barlow Condensed 600 · 18 / 20', '3,120 / 4,150'),
    step('numeral-compact', 'Barlow Condensed 600 · 14 / 18', '1,250 · 48,000 · 12')
  ]),
  group('Component', [
    step('sigil-label', 'Marcellus 30 / 34', 'Resistance'),
    step('sigil-numeral', 'Barlow Condensed 700 · 22 / 24 · scales', h(L.Sigil, { value: '11', size: 'md', labelPosition: 'none' }), '')
  ]));

var colB = h('div', { className: 'pv-col' },
  group('Body', [
    step('body', 'Barlow 15 / 22 · row 20', 'Retreat to secure your pending loot.'),
    step('body-strong', 'Barlow 600 · 15 / 22', '+12% damage from equipment'),
    step('body-compact', 'Barlow 14 / 20 · row 18', 'Armor is combined and converted with diminishing returns.'),
    step('body-compact-strong', 'Barlow 600 · 14 / 20', 'Cinder Bite · 12s')
  ]),
  group('Lore', [
    step('lore', 'EB Garamond italic 18 / 28', 'Temples older than the roads that lead to them.'),
    step('lore-sm', 'EB Garamond italic 16 / 24 · row 20', 'Found in the ash fields east of Shenic.')
  ]),
  group('Labels & captions', [
    step('label', 'Barlow 600 · 12 / 16 · caps', 'Status'),
    step('caption', 'Barlow 12 / 16 · the floor', '350 / 24,500 EXP'),
    step('caption-strong', 'Barlow 600 · 12 / 16', 'Online'),
    step('code', 'Barlow 700 · 11 / 12 · codes only', h('span', { className: 'pv-codes' },
      CODES.map(function (c) { return h('span', { key: c[0], className: 'r-' + c[1] }, c[0]); }), h(L.Key, null, 'E')))
  ]),
  group('Controls', [
    step('tab', 'Marcellus 17 / 24 · caps', 'Creatures'),
    step('nav', 'Barlow 500 · 13 / 18 · caps', 'Inventory'),
    step('nav-active', 'Barlow 600 · 13 / 18 · caps', 'Overview')
  ]),
  group('Readable setting', [
    step('body-readable', 'Atkinson Hyperlegible 16 / 24', 'Retreat to secure your pending loot.')
  ]));

var root = h('div', { className: 'pv' },
  h('ul', { className: 'pv-rules' },
    h('li', null, h('b', null, '12px floor'), h('span', null, 'Anything a player reads is 12px or larger. Only rarity codes and key caps use 11px, in bold capitals.')),
    h('li', null, h('b', null, 'Marcellus from 15px'), h('span', null, 'The display face is 15px and larger, and never sets numbers in a table.')),
    h('li', null, h('b', null, 'Short capitals'), h('span', null, 'Tracked uppercase only for labels of three words or fewer.')),
    h('li', null, h('b', null, 'One hero'), h('span', null, 'title-xl and level-numeral appear once per screen, never inside a list.'))),
  h('div', { className: 'pv-ramp' }, colA, colB));

ReactDOM.createRoot(document.getElementById('root')).render(root);
</script>
</body>
</html>
