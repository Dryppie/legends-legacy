<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MotionSpecimen — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground-deep); color: var(--ink); font-family: var(--font-ui); }
.pv { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--section-lg); padding: var(--section-md); }
.pv-sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--stack-lg); align-content: start; }
.pv-sec > header { display: grid; gap: var(--stack-xs); }
.pv-h { margin: 0; font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); }
.pv-note { margin: 0; max-width: var(--lg-measure); font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-note b, .pv-note code, .pv-mean code, .pv-rules code { font: inherit; font-weight: 600; color: var(--ink); }
.pv-t { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); letter-spacing: var(--tracking-display); color: var(--ink); }
.pv-mean { margin: 0; font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink-muted); }
.pv-num { font-family: var(--font-numeral); font-weight: 600; font-variant-numeric: tabular-nums lining-nums; color: var(--ink); }
.pv-tok { font-weight: 600; color: var(--ink); }
.pv-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: var(--inline-md); }

/* Tokens */
.pv-tokens { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--section-md); align-items: start; }
.pv-durs, .pv-eases { display: grid; gap: var(--stack-md); }
.pv-dur { display: grid; grid-template-columns: 10.5rem 4rem minmax(0, 1fr); align-items: center; gap: var(--inline-md); font-size: var(--text-body-compact); line-height: var(--leading-body-compact); }
.pv-dur > p { grid-column: 1 / -1; margin: calc(-1 * var(--stack-xs)) 0 0; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-lane { position: relative; height: 1.5rem; background: var(--surface); }
.pv-span { position: absolute; left: 0; top: 50%; height: var(--border-hairline); background: var(--line-strong); }
.pv-mover { position: absolute; inset: 0; transform: translateX(var(--to, 0)); transition: transform var(--d) var(--e, var(--ease-standard)); }
.pv-mover::before { content: ""; position: absolute; left: 0; top: -0.5rem; width: var(--border-emphasis); height: 1rem; background: var(--ink); }
.is-idle .pv-mover { transition: none; transform: none; }
.pv-eases { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--inline-lg); }
.pv-ease { display: grid; gap: var(--stack-sm); align-content: start; }
.pv-curve { display: block; width: 100%; height: auto; background: var(--surface); }
.pv-curve .pv-axis { stroke: var(--line); stroke-width: 1; fill: none; }
.pv-curve .pv-path { stroke: var(--ink); stroke-width: 2; fill: none; }
.pv-curve .pv-cp { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
.pv-ease .pv-lane { height: 1.25rem; }
.pv-spec { margin: 0; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }

/* Categories: the category, its motion, its reduced twin */
.pv-cats { display: grid; grid-template-columns: minmax(0, 19rem) minmax(0, 1fr) minmax(0, 1fr); gap: var(--stack-lg) var(--section-sm); align-items: stretch; }
.pv-cats > .pv-h { align-self: end; }
.pv-cat { display: grid; gap: var(--stack-sm); align-content: start; }
.pv-rules { margin: 0; padding-left: 1.125rem; list-style-type: "\2013\00a0"; display: grid; gap: 2px; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-demo { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--stack-md); align-content: start; padding: var(--inset-lg); background: var(--ground); container: lg-region / inline-size; }
.pv-rail { width: 14rem; }
.pv-rail .lg-rail { height: auto; padding: var(--space-3) var(--space-3) var(--space-3) var(--space-5); }
.pv-sigils { display: flex; gap: var(--inline-lg); align-items: flex-start; }
.pv-perks { margin: 0; padding-left: 1.125rem; list-style-type: "\2013\00a0"; display: grid; gap: 2px; font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink); }
.pv-value { display: grid; gap: var(--stack-md); max-width: 26rem; }
.pv-mini { contain: layout paint; height: 13.75rem; }
.pv-mini .lg-shellhost { height: 100% !important; }
.pv-mini .lg-shell { min-height: 0; height: 100%; overflow: hidden; }
.pv-mini .lg-shell__main { min-height: 0; }
.pv-mini .lg-stage__content { display: grid; place-items: center; height: 100%; padding: var(--space-8) var(--space-5) var(--space-5); }
.pv-chat { height: 12.5rem; display: flex; align-items: flex-end; }
.pv-chat > .lg-chronicle { width: 100%; }
.pv-chat { position: relative; }
.pv-chat__hint { position: absolute; left: 0; top: 0; }
.pv-chat .lg-chronicle--floating:not(.is-collapsed) { height: 12.5rem; }
.pv-result { min-height: 8.5rem; }
.pv-result .lg-panel__body { display: grid; gap: var(--stack-xs); padding: var(--inset-md) var(--lg-inset); font-size: var(--text-body-compact); line-height: var(--leading-body-compact); }
.pv-empty { margin: 0; padding: var(--inset-md) 0; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }

/* Live updates */
.pv-live { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--section-sm); align-items: start; }
.pv-bazaar { display: grid; gap: var(--stack-md); }
.pv-pending { display: flex; align-items: center; height: 2rem; }
.pv-pending > span { font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-status { margin: 0; min-height: calc(2 * var(--leading-body-compact)); font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink-muted); }
.pv-status b { font-weight: 600; color: var(--ink); }
.pv-read { display: grid; gap: var(--stack-md); }
.pv-read .lg-chronicle { height: 16.25rem; border: var(--border-hairline) solid var(--line); }

/* Loops: the two allowed, in the preview's own styles (neither is a component). */
.pv-wait { display: grid; gap: var(--stack-sm); max-width: 24rem; }
.pv-wait__label { margin: 0; min-height: var(--leading-body-compact); font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink); }
.pv-indet { position: relative; height: 0.25rem; background: var(--meter-track); overflow: hidden; }
.pv-indet__seg { position: absolute; inset: 0 auto 0 0; width: 30%; background: var(--ink-muted); animation: pv-sweep calc(var(--duration-reveal) * 2) linear infinite; }
@keyframes pv-sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.pv-fight { position: relative; display: grid; gap: var(--stack-sm); max-width: 24rem; }
.pv-swing { position: relative; height: 0.25rem; background: var(--meter-track); overflow: hidden; }
.pv-swing__fill { position: absolute; inset: 0; background: var(--ink-muted); transform-origin: left center; transform: scaleX(0); }
.is-fighting .pv-swing__fill { animation: pv-swing calc(var(--duration-reveal) * 2) linear infinite; }
@keyframes pv-swing { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.pv-hits { position: relative; height: var(--leading-numeral-row); }
.pv-dmg { position: absolute; right: 0; bottom: 0; font-family: var(--font-numeral); font-weight: 700; font-size: var(--text-numeral-row); line-height: var(--leading-numeral-row); font-variant-numeric: tabular-nums lining-nums; color: var(--damage-physical); animation: pv-float var(--duration-reveal) var(--ease-exit) forwards; }
@keyframes pv-float { to { opacity: 0; transform: translateY(-1.5rem); } }
/* Reduced: the sweeps stop and the damage numbers land in place. */
[data-motion="reduced"] .pv-indet__seg, [data-motion="reduced"] .pv-swing__fill { display: none; }
[data-motion="reduced"] .pv-dmg { animation: none; }
@media (prefers-reduced-motion: reduce) { .pv-indet__seg, .pv-swing__fill { display: none; } .pv-dmg { animation: none; } }

.pv-audit { display: grid; gap: var(--stack-xs); }
.pv-audit p { margin: 0; font-size: var(--text-body-compact); line-height: var(--leading-body-compact); color: var(--ink); }
</style>
</head>

<div id="root" class="lg-root"></div>
<script>

    h('div', null, h(L.CurrencyPill, { name: 'Cinders', amount: shown.value, iconSrc: COINS, reserve: 6 })),
    h('div', { className: 'pv-ctl' },

}

  { id: 2, channel: 'guild', channelLabel: 'Guild', author: 'Kaelen', text: 'Raid at 22:00. Bring resist gear.' },
  { id: 3, channel: 'system', channelLabel: 'System', kind: 'system', text: 'The World Tower resets in 2 hours.' }
];

    h('div', { className: 'pv-mini' },

    h('div', { className: 'pv-ctl' }, h(L.Button, { size: 'sm', onClick: function () { n[1](n[0] + 1); } }, 'Finish the fight')),
    h('div', { className: 'pv-result' },

}
var PRICES = [{ id: 'p1', title: 'Ember Wolf Essence', rarity: 'Rare', price: 400 }, { id: 'p2', title: 'Soul Prism', rarity: 'Epic', price: 2250 }, { id: 'p3', title: 'Ashen Pelt', rarity: 'Common', price: 35 }];

function Categories() {
  return h('div', { className: 'pv-cats' },
    h('span', { className: 'pv-h' }, 'Category'), h('span', { className: 'pv-h' }, 'Motion'), h('span', { className: 'pv-h' }, 'Reduced motion'),
