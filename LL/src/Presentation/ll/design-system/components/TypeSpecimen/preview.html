<!-- @dsCard group="Foundations" height=970 width=1280 subtitle="The ramp in use: a Cinder Bazaar order book, recent trades and a character's Combat Attributes." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TypeSpecimen — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); }
.pv { display: grid; gap: var(--space-8); padding: var(--space-8); }

/* In use */
.pv-use { display: grid; gap: var(--space-8); }
.pv-screen { display: grid; gap: var(--space-6); padding: var(--space-6) var(--space-8) var(--space-8); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-container); container: lg-region / inline-size; }
.pv-bazaar { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: var(--space-10); align-items: start; }
.pv-block { display: grid; gap: var(--space-3); align-content: start; }
.pv-item { display: grid; gap: var(--space-1); }
.pv-item__top { display: flex; align-items: center; gap: var(--space-3); }
.pv-item__name { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--text-name-header); line-height: var(--leading-name-header); letter-spacing: var(--tracking-display); color: var(--rarity-rare); }
.pv-item__lore { margin: 0; font-family: var(--font-lore); font-style: italic; font-size: var(--text-lore); line-height: var(--leading-lore); color: var(--ink-muted); }

.pv-book { width: 100%; border-collapse: collapse; }
.pv-book th { padding: 0 var(--space-3) var(--space-2); text-align: left; font-size: var(--text-label); line-height: var(--leading-label); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-muted); border-bottom: var(--border-hairline) solid var(--line); white-space: nowrap; }
.pv-book td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.pv-book th:first-child, .pv-book td:first-child { padding-left: 0; }
.pv-book th:last-child, .pv-book td:last-child { padding-right: 0; text-align: right; }
.pv-book .num { text-align: right; }
.pv-book__seller { font-family: var(--font-display); font-size: var(--text-name-row); line-height: var(--leading-name-row); color: var(--ink); }
.pv-book__num { font-family: var(--font-numeral); font-size: var(--text-numeral-compact); line-height: var(--leading-numeral-compact); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
.pv-book__when { font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-book tr.is-best td { background: var(--surface-raised); }

.pv-trades { margin: 0; padding: 0; list-style: none; display: grid; }
.pv-trade { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 0 var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
.pv-trade__name { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; }
.pv-trade__name span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-display); font-size: var(--text-name-row); line-height: var(--leading-name-row); }
.pv-trade__code { flex: none; font-size: var(--text-code); line-height: var(--leading-code); font-weight: 700; letter-spacing: var(--tracking-code); }
.pv-trade__num { font-family: var(--font-numeral); font-size: var(--text-numeral-compact); line-height: var(--leading-numeral-compact); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.pv-trade__when { grid-column: 1 / -1; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.r-common { color: var(--rarity-common); } .r-uncommon { color: var(--rarity-uncommon); } .r-rare { color: var(--rarity-rare); }
.r-epic { color: var(--rarity-epic); } .r-unique { color: var(--rarity-unique); } .r-legendary { color: var(--rarity-legendary); } .r-legacy { color: var(--rarity-legacy); }

.pv-note { margin: 0; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-muted); }
.pv-note b { font-weight: 600; color: var(--ink); white-space: nowrap; }
</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;

var ORDERS = [
  { seller: 'Maren', qty: 3, price: 1250, expires: '2h 14m', best: true },
  { seller: 'Oswin', qty: 1, price: 1300, expires: '9h 40m' },
  { seller: 'Kaelen', qty: 12, price: 1340, expires: '2d 3h' }
];
var fmt = L.format && L.format.number ? L.format.number : function (n) { return n.toLocaleString('en-US'); };

var book = h('div', { className: 'pv-block' },
  h(L.Heading, { level: 'section' }, 'Order book'),
  h('div', { className: 'pv-item' },
    h('div', { className: 'pv-item__top' }, h('h4', { className: 'pv-item__name' }, 'Dire Wolf Essence'), h(L.Tag, { tone: 'rare' }, 'Rare')),
    h('p', { className: 'pv-item__lore' }, 'Found in the ash fields east of Shenic.')),
  h('table', { className: 'pv-book' },
    h('thead', null, h('tr', null,
      h('th', { scope: 'col' }, 'Seller'), h('th', { scope: 'col', className: 'num' }, 'Qty'), h('th', { scope: 'col', className: 'num' }, 'Price each'),
      h('th', { scope: 'col', className: 'num' }, 'Total'), h('th', { scope: 'col' }, 'Expires'), h('th', { scope: 'col' }, h('span', { className: 'lg-sr' }, 'Action')))),
    h('tbody', null, ORDERS.map(function (o) {
      return h('tr', { key: o.seller, className: o.best ? 'is-best' : null },
        h('td', null, h('span', { className: 'pv-book__seller' }, o.seller)),
        h('td', { className: 'num' }, h('span', { className: 'pv-book__num' }, fmt(o.qty))),
        h('td', { className: 'num' }, h('span', { className: 'pv-book__num' }, fmt(o.price))),
        h('td', { className: 'num' }, h('span', { className: 'pv-book__num' }, fmt(o.qty * o.price))),
        h('td', null, h('span', { className: 'pv-book__when' }, o.expires)),
        h('td', null, h(L.Button, { size: 'sm' }, 'Buy')));
    }))),
  h('p', { className: 'pv-note' }, h('b', null, 'title-md'), ' section · ', h('b', null, 'name-header'), ' item · ', h('b', null, 'lore'), ' · ',
    h('b', null, 'label'), ' column heads · ', h('b', null, 'name-row'), ' seller · ', h('b', null, 'numeral-compact'), ' quantity, price, total · ',
    h('b', null, 'caption'), ' expiry · small Button in ', h('b', null, 'body-compact-strong')));

var TRADES = [
  { name: 'Crown of Cinders', r: 'legendary', code: 'L', price: 48000, when: 'Sold 4m ago' },
  { name: 'Ember Fang', r: 'epic', code: 'E', price: 9400, when: 'Sold 12m ago' },
  { name: 'Dire Wolf Essence', r: 'rare', code: 'R', price: 1200, when: 'Sold 31m ago' },
  { name: 'Iron Sabre', r: 'common', code: 'C', price: 85, when: 'Sold 1h ago' }
];
var trades = h('div', { className: 'pv-block' },
  h(L.Heading, { level: 'subsection' }, 'Recent trades'),
  h('ul', { className: 'pv-trades' }, TRADES.map(function (t) {
    return h('li', { key: t.name, className: 'pv-trade' },
      h('span', { className: 'pv-trade__name' }, h('span', { className: 'r-' + t.r }, t.name), h('span', { className: 'pv-trade__code r-' + t.r }, t.code)),
      h('span', { className: 'pv-trade__num' }, fmt(t.price)),
      h('span', { className: 'pv-trade__when' }, t.when));
  })),
  h('p', { className: 'pv-note' }, h('b', null, 'title-sm'), ' · ', h('b', null, 'name-row'), ' in the rarity colour with its ', h('b', null, 'code'), ' · ',
    h('b', null, 'numeral-compact'), ' · ', h('b', null, 'caption')));

var ATTRS = [
  { title: 'Offense', rows: [
    { label: 'Power', value: '142' }, { label: 'Attack Speed', value: '1.12' }, { label: 'Crit Chance', value: '9.5%' }, { label: 'Armor Penetration', value: '12' }] },
  { title: 'Defense', rows: [
    { label: 'Max Health', value: '4,150' }, { label: 'Armor', value: '38%', sub: '240 Armor Rating' }, { label: 'Dodge', value: '6%' }, { label: 'Block', value: '4%' }] },
  { title: 'Recovery', rows: [
    { label: 'Restoration', value: '18' }, { label: 'Healing Power', value: '12%' }, { label: 'Health Regen', value: '24 HP/5s' }, { label: 'Life Steal', value: '2.5%' }] },
  { title: 'Utility', rows: [
    { label: 'Ability Haste', value: '15' }, { label: 'Tenacity', value: '10%' }, { label: 'Status Resistance', value: '12%' }, { label: 'Threat', value: '3.4 threat/s' }] }
];

var root = h('div', { className: 'pv' },
  h('div', { className: 'pv-use' },
    h('div', { className: 'pv-screen' },
      h(L.PageHeader, { icon: 'cinder-bazaar', eyebrow: 'City', title: 'Cinder Bazaar', summary: 'Buy from other players. Orders stay open for up to three days.' }),
      h('div', { className: 'pv-bazaar' }, book, trades)),
    h('div', { className: 'pv-screen' },
      h(L.Heading, { level: 'section' }, 'Combat Attributes'),
      h('div', { className: 'lg-ledgergrid' }, ATTRS.map(function (g) { return h(L.Ledger, { key: g.title, title: g.title, rows: g.rows }); })),
      h('p', { className: 'pv-note' }, h('b', null, 'title-md'), ' section · ', h('b', null, 'label'), ' group heads · ', h('b', null, 'body-compact'),
        ' labels on the 18px row leading · ', h('b', null, 'numeral-row'), ' values · ', h('b', null, 'caption'), ' sub-line'))));

ReactDOM.createRoot(document.getElementById('root')).render(root);
</script>
</body>
</html>
