<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Constellation — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); }
.pv { padding: 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
.pv-col { display: grid; gap: 16px; }

</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
var BG_STUDY = '../../assets/Backgrounds/background.webp';

function App() {
  var s = React.useState('power');
  return h('div', { style: { height: 440 } }, h(L.Stage, { image: BG_STUDY, label: 'Attributes' },
    h('div', { style: { position: 'absolute', inset: '20px 40px' } },
      h(L.Constellation, { width: 640, height: 400, selectedId: s[0], onSelect: s[1],
        rings: [{ cx: 300, cy: 200, r: 150 }, { cx: 380, cy: 170, r: 90, strong: true }, { cx: 250, cy: 280, r: 180 }],
        nodes: [{ x: 300, y: 50 }, { x: 450, y: 200 }],
        items: [
          { id: 'power', label: 'Power', value: 42, x: 360, y: 90 },
          { id: 'armor', label: 'Armor', value: 18, x: 170, y: 170, labelPosition: 'left' },
          { id: 'res', label: 'Resistance', value: 11, x: 400, y: 250, state: 'ready' },
          { id: 'crit', label: 'Crit Chance', value: '9%', x: 220, y: 330, labelPosition: 'left' }
        ] }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
