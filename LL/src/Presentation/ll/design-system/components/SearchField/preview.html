<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SearchField — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--ground); }
.pv { padding: 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
.pv-col { display: grid; gap: 16px; }

</style>
</head>
<body>
<div id="root" class="lg-root"></div>
<script>
var L = window.LL, h = React.createElement, F = React.Fragment;
var PLAYERS = ['Maren', 'Marek', 'Mareth', 'Kaelen', 'Oswin', 'Tamsin', 'Pip'];
function App() {
  var q = React.useState('Ma'), picked = React.useState('');
  var list = q[0].length >= 2 ? PLAYERS.filter(function (n) { return n.toLowerCase().indexOf(q[0].toLowerCase()) === 0; }) : [];
  return h('div', { style: { padding: 24, display: 'grid', gap: 12, width: 360 } },
    h(L.SearchField, { value: q[0], onChange: q[1], suggestions: list, searched: q[0].length >= 2, placeholder: 'Search character by name…', label: 'Search character by name', onSelect: function (v) { picked[1](v); q[1](v); } }),
    h('span', { style: { fontSize: 13, color: 'var(--ink-muted)' } }, picked[0] ? 'Selected: ' + picked[0] : 'Type two letters; arrows and Enter pick.'));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
