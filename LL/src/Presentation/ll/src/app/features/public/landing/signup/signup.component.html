<div
  class="flex h-full items-center justify-center bg-cover bg-center"
  style="background-image: url(&quot;landing/loginbackground.png&quot;)"
>
  <div
    class="flex h-full max-h-[50rem] w-full max-w-xl flex-col items-center rounded-lg backdrop-blur-sm"
    style="background-image: url(&quot;landing/blur.svg&quot;)"
  >
    <div class="my-8 flex justify-center pt-8">
      <img src="core/Logo.svg" alt="Logo" class="h-28 w-28 object-contain" />
    </div>
    <div class="flex flex-col items-center justify-center space-y-2 pb-12">
      <h2 class="primary-gradient">{{ headerText1 }}</h2>
      <h2 class="primary-gradient">{{ headerText2 }}</h2>
      <img
        src="core/Divider.svg"
        alt="Logo"
        class="center w-60 object-contain"
      />
    </div>
    <form
      [formGroup]="registerForm"
      (ngSubmit)="submitForm()"
      class="mt-2 flex flex-col justify-center"
    >
      <label
        class="group relative flex h-12 w-full items-center border border-[#494949] bg-gray focus-within:border-[#B57D0B]"
        [ngClass]="{
          'border-[#D72E34]': loginError || validateUsername(),
          'border-[#494949]': !loginError,
        }"
      >
        <p class="cursor-text pl-3 text-[#D1D1D1]">{{ usernameLabel }}</p>
        <input
          matInput
          data-1p-ignore
          (input)="resetLoginError()"
          aria-label="Character name"
          type="text"
          required
          class="relative ml-auto h-full w-full appearance-none bg-gray pr-3 text-right text-white focus:z-10 focus:outline-none sm:text-sm sm:leading-5"
          formControlName="username"
        />
      </label>
      <div *ngIf="validateUsername()" class="mt-1 text-sm text-[#D72E34]">
        Character name is too long. Max 26 characters
      </div>
      <div *ngIf="usernameHelp" class="mt-1 max-w-sm text-xs text-zinc-300">
        {{ usernameHelp }}
      </div>
      <label
        class="group relative mt-4 flex h-12 w-full items-center border border-[#494949] bg-gray focus-within:border-[#B57D0B]"
        [ngClass]="{
          'border-[#D72E34]': loginError || validateEmail(),
          'border-[#494949]': !loginError,
        }"
      >
        <p class="cursor-text pl-3 text-[#D1D1D1]">Email</p>
        <input
          matInput
          data-1p-ignore
          (input)="resetLoginError()"
          aria-label="Email address"
          type="email"
          required
          class="relative ml-auto h-full w-full appearance-none bg-gray pr-3 text-right text-white focus:z-10 focus:outline-none sm:text-sm sm:leading-5"
          formControlName="email"
        />
      </label>
      <div *ngIf="validateEmail()" class="mt-1 text-sm text-[#D72E34]">
        Incorrect Email format
      </div>
      <label
        class="group relative mt-4 flex h-12 w-full items-center border bg-gray focus-within:border-[#B57D0B]"
        [ngClass]="{
          'border-[#D72E34]': loginError || validatePassword(),
          'border-[#494949]': !loginError,
        }"
      >
        <p class="cursor-text pl-3 text-[#D1D1D1]">Password</p>
        <input
          data-1p-ignore
          matInput
          (input)="resetLoginError()"
          aria-label="Password"
          type="password"
          required
          class="relative ml-auto h-full w-full appearance-none bg-gray pr-3 text-right text-white focus:z-10 focus:outline-none sm:text-sm sm:leading-5"
          formControlName="password"
        />
      </label>
      <div *ngIf="validatePassword()" class="mt-1 text-sm text-[#D72E34]">
        Incorrect Password format
      </div>
      <label
        class="group relative mt-4 flex h-12 w-full items-center border bg-gray focus-within:border-[#B57D0B]"
        [ngClass]="{
          'border-[#D72E34]': loginError || validatePassword(),
          'border-[#494949]': !loginError,
        }"
      >
        <p class="cursor-text pl-3 text-[#D1D1D1]">Confirm Password</p>
        <input
          data-1p-ignore
          matInput
          (input)="resetLoginError()"
          aria-label="Password"
          type="password"
          required
          class="relative ml-auto h-full w-full appearance-none bg-gray pr-3 text-right text-white focus:z-10 focus:outline-none sm:text-sm sm:leading-5"
          formControlName="confirmPassword"
        />
      </label>
      <div
        *ngIf="validateConfirmPassword()"
        class="mt-1 text-sm text-[#D72E34]"
      >
        Password does not match
      </div>
      <div class="mt-12">
        <app-button
          type="submit"
          [disabled]="!registerForm.valid"
          [text]="convertAccount ? 'REGISTER NOW' : 'SIGN UP'"
        ></app-button>
      </div>
      <button
        *ngIf="!disableLoginLink"
        routerLink="/login"
        class="my-8 w-full text-center text-primary underline focus:outline-none"
      >
        Already have an account? Log In!
      </button>
    </form>
  </div>
</div>
