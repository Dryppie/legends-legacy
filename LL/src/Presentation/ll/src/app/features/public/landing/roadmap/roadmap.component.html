<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold text-center mb-8 text-ancient-primary">
    Game Roadmap
  </h1>
  <ul class="space-y-4">
    <li
      class="bg-blood-secondary p-4 rounded-lg shadow"
      *ngFor="let item of roadmapItems"
    >
      <h2 class="text-2xl font-semibold text-ancient-primary">
        {{ item.title }}
      </h2>
      <p [innerHTML]="item.description" class="text-royal-primary"></p>
      <span class="text-sm text-royal-secondary"
        >Estimated Release: {{ item.estimatedRelease | date }}</span
      >
    </li>
  </ul>
</div>
