<ng-container
  *ngIf="
    combatStateService.getIsCombatActive(battleType)() as isCombatActive;
    else showNonCombat
  "
>
  <app-combat
    class="flex h-full w-full"
    [battleType]="battleType"
    (skipBattle)="skipBattle()"
  ></app-combat>
</ng-container>
<ng-template #showNonCombat>
  <div
    class="flex h-full flex-col items-center space-y-2 overflow-hidden pr-4 sm:pr-6"
  >
    <div class="flex w-full flex-col sm:gap-6">
      <app-banner image="colosseum" class="w-full"></app-banner>
    </div>

    <app-tabs class="flex w-full flex-col overflow-hidden">
      <app-tab label="Arena">
        <app-arena-battle
          class="overflow-hidden"
          [opponents]="opponents"
          (refreshOpponents)="onRefreshOpponents()"
          (challenge)="challenge($event)"
        >
        </app-arena-battle>
      </app-tab>

      <!-- <app-tab label="Tournament Grounds">
        <app-tournament-grounds class="overflow-hidden">
        </app-tournament-grounds>
      </app-tab>

      <app-tab label="Champion's Market">
        <app-champions-market class="overflow-hidden"> </app-champions-market>
      </app-tab> -->

      <app-tab label="Rankings">
        <app-rankings-glory class="overflow-hidden" [rankings]="rankings">
        </app-rankings-glory>
      </app-tab>

      <app-tab label="Record of Battles">
        <app-record-of-battle
          class="overflow-hidden"
          [previousMatches]="previousMatches"
        >
        </app-record-of-battle>
      </app-tab>
    </app-tabs>
  </div>
</ng-template>
