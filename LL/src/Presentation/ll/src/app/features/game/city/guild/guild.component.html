<div class="flex h-full flex-col overflow-hidden pr-4 sm:pr-6">
  <ng-container *ngIf="guild() as guild; else noGuild">
    <app-in-a-guild
      class="h-full overflow-hidden"
      [guild]="guild"
    ></app-in-a-guild>
  </ng-container>
  <ng-template #noGuild>
    <app-no-guild></app-no-guild>
  </ng-template>
</div>
