<div class="flex h-full w-full flex-col gap-2 text-white">
  <div class="flex w-full justify-between">
    <div class="h-32 w-96 rounded-lg border border-light_gray p-4">
      <h2 class="text-primary">
        {{ guild.name }}
      </h2>
      <span>{{ guild.members.length }} / {{ guild.maxMembers }} members</span>
    </div>
    <div
      class="place-self-end rounded border border-light_gray p-2 hover:cursor-pointer hover:bg-zinc-600/30"
      (click)="invite()"
    >
      Invite
    </div>
  </div>
  <div class="grid grid-cols-4 gap-2 p-2">
    <div>Name</div>
    <div>Level</div>
    <div>Role</div>
  </div>
  <div
    class="grid grid-cols-4 items-center gap-2 border-t border-light_gray p-2 text-white"
    *ngFor="let m of guild.members"
    [ngClass]="{
      'bg-zinc-300/10 text-primary': m.characterId === id,
    }"
  >
    <div class="break-words pr-2">
      {{ m.name }}
    </div>
    <div>{{ m.level }}</div>
    <div>{{ m.role }}</div>
    <div
      *ngIf="m.characterId === id"
      class="col-start-4 justify-self-end rounded border border-light_gray p-2 hover:cursor-pointer hover:bg-zinc-600/30"
    >
      {{ m.role === leaderRole ? "Disband" : "Leave" }}
    </div>
  </div>
</div>
