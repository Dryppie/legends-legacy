<div class="flex h-full flex-col overflow-hidden text-white sm:gap-4">
  <app-default-header
    [text]="numberOfAbsorbedEssence()"
    title="Essences"
    icon="character/essences"
  ></app-default-header>
  <app-tabs class="flex h-full w-full flex-col overflow-hidden">
    <app-tab label="Absorbed essences">
      <app-essences-equipped
        [essenceSlots]="essenceSlots"
        class="h-full overflow-hidden"
      ></app-essences-equipped>
    </app-tab>
    <app-tab label="Inventory essences">
      <app-essences-absorb class="h-full overflow-hidden"></app-essences-absorb>
    </app-tab>
  </app-tabs>
</div>
