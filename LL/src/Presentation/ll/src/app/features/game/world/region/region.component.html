<div class="flex h-full w-full flex-col gap-4 overflow-hidden pr-4">
  <h1 class="text-primary">{{ region.name }}</h1>

  <app-tabs class="">
    <app-tab label="Dungeons">
      <app-dungeons></app-dungeons>
    </app-tab>
    <app-tab label="Areas">
      <div
        *ngIf="region.areas.length > 0"
        class="flex w-full flex-col gap-2 pt-4"
        data-tour="areas-introduction"
      >
        <div class="flex h-full w-full flex-wrap gap-4">
          <div
            *ngFor="let area of region.areas; index as i"
            class="w-full sm:w-fit"
          >
            <app-combat-area-card
              [area]="area"
              [isLastInRow]="isLastInRow(i)"
            ></app-combat-area-card>
          </div>
        </div>
      </div>
    </app-tab>
    <app-tab label="Raids">
      <app-raids></app-raids>
    </app-tab>
  </app-tabs>
</div>
