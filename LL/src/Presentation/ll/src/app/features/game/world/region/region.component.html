<ng-container
  *ngIf="
    combatStateService.getIsCombatActive(
      trainingBattleType
    )() as isTrainingBattleActive;
    else regionView
  "
>
  <app-combat
    class="flex h-full w-full"
    [battleType]="trainingBattleType"
    (skipBattle)="closeTrainingSummary()"
  ></app-combat>
</ng-container>

<ng-template #regionView>
  <div
    class="flex h-full min-h-0 w-full flex-col gap-4 overflow-y-auto overflow-x-hidden"
  >
    <app-default-header
      *ngIf="region"
      class="pr-4 sm:pr-6"
      section="Region"
      [title]="region.name"
      text="Areas, dungeons, and raids"
      icon="sidebar/world/world-map"
    >
      <a
        *ngIf="activeBattle() as battle"
        header-actions
        routerLink="/game/combat"
        class="group flex min-h-8 min-w-0 max-w-32 items-center gap-2 rounded-full border border-[var(--ll-color-border-strong)] bg-[var(--ll-color-primary-soft)] px-3 py-1.5 text-xs transition-colors hover:border-primary hover:bg-primary/15 sm:max-w-[24rem]"
        [attr.aria-label]="'In battle: ' + battle.areaName"
      >
        <span
          class="h-1.5 w-1.5 shrink-0 rounded-full bg-[var(--ll-color-success)]"
          aria-hidden="true"
        ></span>

        <span
          class="hidden shrink-0 text-[10px] font-semibold uppercase tracking-wide text-[var(--ll-color-text-muted)] sm:inline"
        >
          In battle
        </span>

        <span
          class="hidden text-[var(--ll-color-text-subtle)] sm:inline"
          aria-hidden="true"
        >
          ·
        </span>

        <strong class="min-w-0 truncate font-medium text-primary">
          {{ battle.areaName }}
        </strong>

        <svg
          class="h-3.5 w-3.5 shrink-0 text-primary/70 transition-transform group-hover:translate-x-0.5"
          viewBox="0 0 16 16"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m6 3 5 5-5 5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>
    </app-default-header>

    <app-tabs *ngIf="region" class="flex w-full shrink-0 flex-col">
      <app-tab label="Areas">
        <div
          *ngIf="region.areas.length > 0; else noAreas"
          class="flex w-full flex-col gap-2 pt-4"
          data-tour="areas-introduction"
        >
          <div class="flex h-full w-full flex-wrap gap-4">
            <div
              *ngFor="let area of region.areas; index as i"
              class="w-full sm:w-fit"
            >
              <app-combat-area-card
                [area]="area"
                [isLastInRow]="isLastInRow(i)"
              ></app-combat-area-card>
            </div>
          </div>
        </div>

        <ng-template #noAreas>
          <div class="pt-4" data-tour="areas-introduction">
            <div class="ll-empty-state">
              No combat areas are available in this region yet.
            </div>
          </div>
        </ng-template>
      </app-tab>

      <app-tab label="Dungeons">
        <app-dungeons class="overflow-hidden pt-4"></app-dungeons>
      </app-tab>

      <app-tab label="Raids">
        <app-raids></app-raids>
      </app-tab>
    </app-tabs>
  </div>
</ng-template>
