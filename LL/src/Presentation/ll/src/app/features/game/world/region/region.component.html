<div *ngIf="!currentAction || currentAction.characterActionType !== 'Combat'">
  <h1 class="text-primary">{{ region.name }}</h1>
  <div *ngFor="let area of region.areas">
    <div class="text-primary">{{ area.name }}</div>
  </div>
  <app-button (click)="Battle()" text="BATTLE"></app-button>
</div>

<app-combat
  *ngIf="
    currentAction != null && currentAction.characterActionType === 'Combat'
  "
></app-combat>
