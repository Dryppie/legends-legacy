<div
  *ngIf="!currentAction || currentAction.characterActionType !== 'Combat'"
  class="flex h-full w-full flex-col gap-4"
>
  <h1 class="text-primary">{{ region.name }}</h1>

  <div class="flex w-full flex-col">
    <h3 class="text-primary">Raids</h3>
  </div>
  <div class="flex w-full flex-col">
    <h3 class="text-primary">Dungeons</h3>
  </div>
  <div class="flex w-full flex-col">
    <h3 class="text-primary">Areas</h3>
    <div
      class="grid h-full w-full gap-4 overflow-y-auto pr-2 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
    >
      <div *ngFor="let area of region.areas" class="flex">
        <app-combat-area-card [area]="area"></app-combat-area-card>
      </div>
    </div>
  </div>
</div>

<app-combat
  *ngIf="
    currentAction != null && currentAction.characterActionType === 'Combat'
  "
></app-combat>
