<div class="flex h-full w-full flex-col gap-4 overflow-hidden">
  <h1 class="text-primary">{{ region.name }}</h1>

  <div class="flex h-full w-full flex-col overflow-y-auto">
    <div *ngIf="region.raids.length > 0" class="flex w-full flex-col gap-2">
      <h3 class="text-primary">Raids</h3>
    </div>
    <div *ngIf="region.dungeons.length > 0" class="flex w-full flex-col gap-2">
      <h3 class="text-primary">Dungeons</h3>
    </div>
    <div *ngIf="region.areas.length > 0" class="flex w-full flex-col gap-2">
      <h3 class="text-primary">Areas</h3>
      <div class="flex h-full w-full flex-wrap gap-4 pr-2">
        <div
          *ngFor="let area of region.areas; index as i"
          class="w-full sm:w-fit"
        >
          <app-combat-area-card
            [area]="area"
            [isLastInRow]="isLastInRow(i)"
          ></app-combat-area-card>
        </div>
      </div>
    </div>
  </div>
</div>
