<div
  class="flex h-full flex-col gap-6 overflow-y-auto py-2 text-white 2xl:flex-row"
>
  <div class="order-2 flex w-full flex-col 2xl:order-1">
    <div
      class="flex flex-wrap items-center gap-2 rounded-t-lg bg-black/40 px-2 py-2 text-sm backdrop-blur-sm"
    >
      <input
        type="search"
        [formControl]="searchCtrl"
        placeholder="Search items…"
        class="rounded border border-zinc-300/30 bg-transparent px-2 py-[4px] focus:outline-none focus:ring-amber-400"
      />

      <select
        [ngModel]="itemType()"
        (ngModelChange)="itemType.set($event)"
        class="rounded border border-zinc-300/30 bg-transparent px-2 py-1"
      >
        <option class="bg-black" value="">All categories</option>
        <option class="bg-black" *ngFor="let c of itemTypes" [value]="c">
          {{ c }}
        </option>
      </select>

      <select
        [ngModel]="rarity()"
        (ngModelChange)="rarity.set($event)"
        class="rounded border border-zinc-300/30 bg-transparent px-2 py-1"
      >
        <option class="bg-black" value="">Any rarity</option>
        <option class="bg-black" *ngFor="let r of rarities" [value]="r">
          {{ r }}
        </option>
      </select>

      <button
        type="button"
        (click)="togglePriceSort()"
        class="flex items-center justify-between gap-1 text-nowrap rounded border border-zinc-300/30 px-2 py-1 hover:bg-zinc-300/30"
      >
        Unit price
        <ng-container [ngSwitch]="priceSort()">
          <span *ngSwitchCase="'asc'">↑</span>
          <span *ngSwitchCase="'desc'">↓</span>
          <span *ngSwitchDefault class="opacity-50">↕</span>
        </ng-container>
      </button>
      <button
        type="button"
        class="ml-auto text-rose-500 hover:underline"
        (click)="resetFilters()"
      >
        Reset
      </button>
    </div>
    <div class="grid grid-cols-4 rounded-b-md bg-black/40">
      <div class="col-start-1 col-end-3 p-2">Name</div>
      <div class="p-2">Quantity</div>
      <div class="justify-self-end p-2">Cinders per unit</div>
    </div>
    <div class="flex flex-col overflow-y-auto">
      <div
        *ngFor="let l of filteredListings(); trackBy: trackByListing"
        (click)="selectListing(l)"
        [ngClass]="{
          'bg-zinc-300/30': l.id === selectedListingId,
        }"
        class="cursor-pointer transition"
      >
        <app-market-place-listing-item
          [listing]="l"
        ></app-market-place-listing-item>
      </div>
      <ng-container *ngIf="!filteredListings().length">
        <p class="mt-8 text-center italic text-neutral-400">
          No listings match your filters.
        </p>
      </ng-container>
    </div>
  </div>

  <div
    class="order-1 flex h-fit w-full flex-shrink-0 flex-col gap-4 rounded-lg bg-black/40 p-4 backdrop-blur-sm 2xl:order-2 2xl:w-96"
  >
    <ng-container *ngIf="selectedListing() as sel; else placeholder">
      <app-item [item]="sel.itemInstance"></app-item>

      <!-- Adaptive description -->
      <p class="whitespace-pre-line text-sm text-neutral-300">
        {{ itemDescription() }}
      </p>

      <p class="text-sm text-neutral-300">
        Unit price: {{ sel.unitPrice | numberFormat }} Cinders
      </p>
      <p class="text-sm text-neutral-300">Quantity: {{ sel.quantity }}</p>
      <!-- Quantity selector appears only when > 1 items are in the listing -->
      <div *ngIf="sel.quantity > 1" class="flex items-center gap-2">
        <label for="buyQty" class="whitespace-nowrap text-sm text-neutral-300"
          >Buy quantity:</label
        >
        <input
          id="buyQty"
          type="number"
          min="1"
          [max]="maxQuantity()"
          [formControl]="qtyCtrl"
          class="no-spinner w-24 rounded border border-neutral-700 bg-transparent px-2 py-1 text-right focus:outline-none focus:ring-amber-400"
        />
      </div>
      <app-regular-button
        class="w-full"
        text="Buy item"
        fullWidth
        (pressed)="buyoutListing()"
      />
    </ng-container>

    <ng-template #placeholder>
      <p class="text-center italic text-neutral-400">
        Select a listing to purchase.
      </p>
    </ng-template>
  </div>
</div>
