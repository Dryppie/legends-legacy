<ng-container *ngIf="characterProfession() as characterProfession">
  <div class="flex h-full w-full flex-col text-white sm:gap-4">
    <app-profession-header
      class="pr-4 sm:pr-6"
      [title]="profession()?.name ?? 'Crafting'"
      icon="sidebar/professions/crafting"
      [level]="characterProfession.level"
      [experience]="characterProfession.experience"
      [experienceUntilNextLevel]="characterProfession.experienceUntilNextLevel"
      [guidePageId]="guidePageId"
    ></app-profession-header>
    <app-tabs
      class="flex h-full flex-col overflow-hidden"
      [selectedIndex]="selectedTabIndex()"
      (selectedIndexChange)="selectTab($event)"
    >
      <app-tab label="Crafting">
        <app-regular-crafting
          class="block min-h-0 flex-1 overflow-hidden"
          [recipes]="recipes"
          [inventory]="inventory"
          [characterProfession]="characterProfession"
        ></app-regular-crafting>
      </app-tab>
      <app-tab label="Tempering">
        <app-tempering
          class="block min-h-0 flex-1 overflow-hidden"
          [inventory]="inventory"
        ></app-tempering>
      </app-tab>
    </app-tabs>
  </div>
</ng-container>
