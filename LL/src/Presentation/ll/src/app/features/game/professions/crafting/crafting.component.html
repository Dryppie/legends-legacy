<div class="flex h-full w-full flex-col gap-4 text-white">
  <ng-container *ngIf="characterProfession() as characterProfession">
    <app-profession-header
      *ngIf="profession() as profession"
      class="pr-4 sm:pr-6"
      title="{{ profession.name }}"
      icon="professions/{{ profession.iconPath }}"
      [level]="characterProfession.level"
      [experience]="characterProfession.experience"
      [experienceUntilNextLevel]="characterProfession.experienceUntilNextLevel"
    ></app-profession-header>
  </ng-container>
  <app-tab
    [tabs]="tabLabels"
    [activeTab]="activeTab"
    (tabSelected)="setActiveTab($event)"
    class="w-full flex-none"
  ></app-tab>
  <ng-container [ngSwitch]="activeTab">
    <app-regular-crafting
      *ngSwitchCase="'Crafting'"
      class="h-full overflow-hidden"
      [recipes]="recipes"
      [inventory]="inventory"
    ></app-regular-crafting>

    <app-tempering
      *ngSwitchCase="'Tempering'"
      class="h-full overflow-hidden"
      [inventory]="inventoryEquipment"
      [craftType]="craftType()"
    ></app-tempering>
  </ng-container>
</div>
