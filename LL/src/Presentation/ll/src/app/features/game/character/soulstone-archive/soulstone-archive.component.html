<div class="flex h-full flex-col gap-4 overflow-hidden text-white">
  <app-default-header
    class="flex-none"
    section="Character"
    title="Soulstones"
    text="Permanent upgrades"
    icon="character/essences"
  ></app-default-header>
  <app-regular-button
    class="place-self-end pl-1 pr-4 sm:place-self-start"
    variant="danger"
    text="Reset - free"
    (pressed)="resetSoulstoneUpgrades()"
    [disabled]="loading()"
  ></app-regular-button>
  <div
    class="flex flex-col gap-4 overflow-y-auto pr-4 sm:pr-6"
    *ngIf="combatUpgrades()"
  >
    <ng-container *ngIf="character() as character">
      <app-soulstone-upgrade-card
        [upgrades]="combatUpgrades()"
        upgradeType="Combat"
        [character]="character"
      ></app-soulstone-upgrade-card>
      <app-soulstone-upgrade-card
        [upgrades]="gatheringUpgrades()"
        upgradeType="Gathering"
        [character]="character"
      ></app-soulstone-upgrade-card>
      <app-soulstone-upgrade-card
        [upgrades]="craftingUpgrades()"
        upgradeType="Crafting"
        [character]="character"
      ></app-soulstone-upgrade-card>
      <app-soulstone-upgrade-card
        [upgrades]="miscUpgrades()"
        upgradeType="Miscellaneous"
        [character]="character"
      ></app-soulstone-upgrade-card>
    </ng-container>
  </div>
</div>
