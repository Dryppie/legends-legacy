<div class="ll-page-stack">
  <div class="flex flex-wrap items-center justify-between gap-2 pr-4 sm:pr-6">
    <app-default-header
      class="flex-none"
      section="Character"
      title="Soulstones"
      text="Spend Soulstones on permanent branch upgrades"
      icon="sidebar/character/soulstones"
    ></app-default-header>

    <app-regular-button
      variant="danger"
      text="Reset"
      (pressed)="openResetConfirmation()"
      [disabled]="loading() || totalUpgradeRanks() === 0"
    ></app-regular-button>
  </div>

  <div
    *ngIf="resetConfirmationOpen"
    class="ll-state ll-state-danger mr-4 flex flex-col gap-3 sm:mr-6 sm:flex-row sm:items-center sm:justify-between"
  >
    <span>
      Reset {{ totalUpgradeRanks() }} ranks for
      {{ resetRefund() }} Soulstones?
    </span>
    <span class="flex flex-wrap gap-2">
      <app-regular-button
        variant="secondary"
        text="Cancel"
        (pressed)="cancelReset()"
        [disabled]="loading()"
      ></app-regular-button>
      <app-regular-button
        variant="danger"
        text="Confirm reset"
        (pressed)="confirmResetSoulstoneUpgrades()"
        [disabled]="loading()"
      ></app-regular-button>
    </span>
  </div>

  <section class="grid grid-cols-4 gap-1 pr-4 sm:gap-2 sm:pr-6">
    <article
      *ngFor="let card of summaryCards()"
      class="ll-stat-card min-w-0 p-2 sm:p-3"
    >
      <div class="ll-stat-label truncate">{{ card.label }}</div>
      <div class="ll-heading mt-0.5 truncate text-xl sm:mt-1 sm:text-3xl">
        {{ card.value }}
      </div>
    </article>
  </section>

  <div class="mr-4 grid gap-2 sm:mr-6">
    <p *ngIf="error()" class="ll-state ll-state-danger">
      {{ error() }}
    </p>
    <p *ngIf="lastRefund() > 0" class="ll-state">
      Refunded {{ lastRefund() }} Soulstones.
    </p>
  </div>

  <ng-container *ngIf="character() as character">
    <app-tabs class="flex min-h-0 flex-1 flex-col overflow-hidden pr-4 sm:pr-6">
      <app-tab label="All">
        <div class="flex flex-col gap-4 overflow-y-auto pt-4">
          <app-soulstone-upgrade-card
            *ngFor="let group of branchGroups()"
            [title]="group.title"
            [upgrades]="group.upgrades"
            [character]="character"
          ></app-soulstone-upgrade-card>
        </div>
      </app-tab>

      <app-tab *ngFor="let group of branchGroups()" [label]="group.title">
        <div class="overflow-y-auto pt-4">
          <app-soulstone-upgrade-card
            [title]="group.title"
            [upgrades]="group.upgrades"
            [character]="character"
          ></app-soulstone-upgrade-card>
        </div>
      </app-tab>
    </app-tabs>
  </ng-container>
</div>
