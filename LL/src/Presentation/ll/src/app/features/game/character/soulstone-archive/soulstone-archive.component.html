<div class="ll-page-stack">
  <app-default-header
    class="flex-none"
    section="Character"
    title="Soulstones"
    text="Permanent upgrades"
    icon="character/essences"
  ></app-default-header>

  <section class="ll-page-header mr-4 flex flex-col gap-3 sm:mr-6">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <h2 class="ll-heading">Upgrade Archive</h2>
        <p class="ll-copy">Spend Soulstones on permanent account power.</p>
      </div>
      <app-regular-button
        variant="danger"
        text="Reset - free"
        (pressed)="resetSoulstoneUpgrades()"
        [disabled]="loading() || totalUpgradeLevels() === 0"
      ></app-regular-button>
    </div>

    <div class="grid grid-cols-2 gap-2 xl:grid-cols-4">
      <div *ngFor="let card of summaryCards()" class="ll-stat-card px-3 py-2">
        <div class="ll-stat-label">{{ card.label }}</div>
        <div class="ll-stat-value mt-1">
          {{ card.value }}
        </div>
      </div>
    </div>

    <p *ngIf="error()" class="ll-state ll-state-danger">
      {{ error() }}
    </p>
    <p *ngIf="lastRefund() > 0" class="ll-state">
      Refunded {{ lastRefund() }} Soulstones.
    </p>
  </section>

  <div
    class="flex flex-col gap-4 overflow-y-auto pr-4 sm:pr-6"
    *ngIf="combatUpgrades()"
  >
    <ng-container *ngIf="character() as character">
      <app-soulstone-upgrade-card
        [upgrades]="combatUpgrades()"
        upgradeType="Combat"
        [character]="character"
      ></app-soulstone-upgrade-card>
      <app-soulstone-upgrade-card
        [upgrades]="gatheringUpgrades()"
        upgradeType="Gathering"
        [character]="character"
      ></app-soulstone-upgrade-card>
      <app-soulstone-upgrade-card
        [upgrades]="craftingUpgrades()"
        upgradeType="Crafting"
        [character]="character"
      ></app-soulstone-upgrade-card>
      <app-soulstone-upgrade-card
        [upgrades]="miscUpgrades()"
        upgradeType="Miscellaneous"
        [character]="character"
      ></app-soulstone-upgrade-card>
    </ng-container>
  </div>
</div>
