<div
  class="flex h-full w-full flex-col justify-evenly gap-2 overflow-hidden px-4 pt-4 text-white sm:px-6 md:flex-row"
>
  <!-- ESSENCE DESCRIPTION -->
  <div class="flex h-full w-full flex-col space-y-2 overflow-y-auto md:order-2">
    <!-- ESSENCE DESCRIPTION -->
    <div class="ll-panel p-4" data-tour="essence-absorb-details">
      <ng-container
        *ngIf="
          essenceState.selectedInventoryEssence() as selectedEssence;
          else noEssence
        "
      >
        <div data-tour="essence-absorb-details-content">
          <app-essence-details [essence]="selectedEssence"></app-essence-details>
        </div>
        <div
          class="mt-4 flex items-center justify-between gap-2"
          data-tour="essence-absorb-actions"
        >
          <ng-container
            *ngIf="
              !essenceState.isSelectedInventoryEssenceAbsorbed();
              else essenceIsAbsorbed
            "
          >
            <span class="inline-block" data-tour="essence-absorb-action">
              <app-regular-button (pressed)="absorb()" text="Absorb essence">
              </app-regular-button>
            </span>
          </ng-container>
          <ng-template #essenceIsAbsorbed>
            <span class="ll-state ll-state-danger">
              This essence is already in your Soul Archive
            </span>
          </ng-template>
          <app-regular-button
            (pressed)="openModal()"
            variant="danger"
            text="Shatter"
          >
          </app-regular-button>
        </div>
      </ng-container>
      <ng-template #noEssence>
        <div class="ll-empty-state">Select an essence to view details.</div>
      </ng-template>
    </div>
  </div>
  <!-- INVENTORY ESSENCES LIST -->
  <div
    class="flex h-full w-full flex-col space-y-2 overflow-y-auto md:order-1"
    data-tour="inventory-essences-list"
  >
    <app-selectable-list-filter
      [storageKey]="'essences-absorb'"
      [items]="essenceState.inventoryEssences()"
      [selectedItem]="essenceState.selectedInventoryItem()"
      [filterOptions]="essenceFilters"
      tourItemId="inventory-essence-item"
      (select)="selectEssence($event)"
    >
      <!-- How *one* essence row looks -->
      <ng-template let-invItem>
        <div class="flex justify-between font-semibold text-white">
          <div>{{ essenceState.asEssence(invItem).name }}</div>
          <div>x{{ invItem.quantity }}</div>
        </div>
      </ng-template>
    </app-selectable-list-filter>
  </div>
</div>

<div *ngIf="showModal" class="ll-modal-backdrop" (click)="closeModal()">
  <div class="ll-modal-panel" (click)="$event.stopPropagation()">
    <div class="mb-4">
      <h3 class="ll-heading">
        Shatter {{ essenceState.selectedInventoryEssence()?.name }}
      </h3>
      <label class="ll-copy italic"
        >Dismantle one Unbound Essence into Essence Dust.</label
      >
    </div>

    <div class="mb-4">
      <p class="text-sm text-white">
        Owned: {{ essenceState.selectedInventoryEssenceQuantity() }}
      </p>
    </div>

    <div class="flex justify-end gap-2">
      <app-regular-button (pressed)="closeModal()">Cancel</app-regular-button>
      <app-regular-button
        [disabled]="!essenceState.selectedInventoryItem()"
        (pressed)="confirmShatter()"
        >Shatter</app-regular-button
      >
    </div>
  </div>
</div>
