<div
  class="grid h-full w-full gap-4 overflow-y-auto p-4 text-sm text-neutral-200 lg:grid-cols-[minmax(0,1fr)_minmax(320px,420px)]"
>
  <section class="rounded-lg border border-light_gray bg-texture p-4 shadow-lg">
    <div *ngIf="guild() as guild" class="flex flex-col gap-2">
      <div class="border-b border-light_gray/70 pb-3">
        <h2 class="font-semibold text-primary">Guild Resources</h2>
        <p class="text-xs text-zinc-400">
          Shared materials used for guild buildings and future guild systems.
        </p>
      </div>
      <div class="mt-3 grid gap-2 sm:grid-cols-2">
        <div
          *ngFor="let resource of allResources"
          class="rounded border border-light_gray/70 bg-black/30 p-3"
        >
          <div class="text-xs uppercase text-zinc-500">
            {{ resource.type | humanize }}
          </div>
          <div class="mt-1 text-xl text-primary">
            {{ resource.amount | numberFormat }}
          </div>
        </div>
      </div>
    </div>
  </section>

  <section
    class="flex min-h-0 flex-col rounded-lg border border-light_gray bg-texture p-4 shadow-lg"
  >
    <div class="flex flex-col gap-2 pb-4">
      <div class="border-b border-light_gray/70 pb-3">
        <div class="flex items-center justify-between gap-3">
          <h2 class="font-semibold text-primary">Donate</h2>
          <span class="text-primary">
            {{ donationTotal() | numberFormat }} selected
          </span>
        </div>
        <p class="text-xs text-zinc-400">
          Choose resources from your inventory to contribute to the guild vault.
        </p>
      </div>
      <div class="space-y-2">
        <div
          *ngFor="let type of allResourceTypes"
          class="flex items-center justify-between gap-2 rounded border border-light_gray/60 bg-black/30 p-2"
        >
          <label class="w-28 text-primary">
            {{ type | humanize }}
          </label>
          <div class="flex items-center gap-1">
            <label
              [ngClass]="{
                'text-red-200': donationExceedsAvailable(type),
                'text-zinc-400': !donationExceedsAvailable(type),
              }"
            >
              {{ formatNumber(availableAmounts[type]) }} /
            </label>
            <input
              type="text"
              class="no-spinner w-28 rounded border border-zinc-300/30 bg-neutral-900 px-2 py-1"
              placeholder="0"
              min="0"
              [value]="formatNumber(donationForm[type])"
              (input)="onFormattedInput($event, type)"
            />
          </div>
        </div>
      </div>

      <app-regular-button
        [disabled]="disabled()"
        (pressed)="donate()"
        text="Donate"
      >
      </app-regular-button>
    </div>
  </section>
</div>
