<div
  class="flex h-full w-full flex-col justify-between gap-4 overflow-y-auto p-4 text-sm text-neutral-200 lg:flex-row"
>
  <section class="ll-panel w-full p-4 sm:h-full">
    <div *ngIf="guild() as guild" class="flex flex-col gap-2">
      <div class="border-b border-light_gray/70 pb-3">
        <h2 class="ll-heading font-semibold">Guild Resources</h2>
        <p class="ll-copy">
          Shared materials used for guild buildings and future guild systems.
        </p>
      </div>
      <div class="mt-3 grid gap-2 sm:grid-cols-2">
        <div *ngFor="let resource of allResources" class="ll-stat-card p-3">
          <div class="ll-stat-label">
            {{ resource.type | humanize }}
          </div>
          <div class="ll-heading mt-1 text-xl">
            {{ resource.amount | numberFormat }}
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="ll-panel w-full p-4 sm:h-full">
    <div class="flex flex-col gap-2 pb-4">
      <div class="border-b border-light_gray/70 pb-3">
        <div class="flex items-center justify-between gap-3">
          <h2 class="ll-heading font-semibold">Donate</h2>
          <span class="ll-badge ll-badge-accent">
            {{ donationTotal() | numberFormat }} selected
          </span>
        </div>
        <p class="ll-copy">
          Choose resources from your inventory to contribute to the guild vault.
        </p>
      </div>
      <div class="space-y-2">
        <div
          *ngFor="let type of allResourceTypes"
          class="ll-card flex items-center justify-between gap-2 p-2"
        >
          <label class="w-28 text-primary">
            {{ type | humanize }}
          </label>
          <div class="flex items-center gap-1">
            <label
              [ngClass]="{
                'text-red-200': donationExceedsAvailable(type),
                'text-zinc-400': !donationExceedsAvailable(type),
              }"
            >
              {{ formatNumber(availableAmounts[type]) }} /
            </label>
            <input
              type="text"
              class="ll-input no-spinner w-28 px-2 py-1"
              placeholder="0"
              min="0"
              [value]="formatNumber(donationForm[type])"
              (input)="onFormattedInput($event, type)"
            />
          </div>
        </div>
      </div>

      <app-regular-button
        [disabled]="disabled()"
        (pressed)="donate()"
        text="Donate"
      >
      </app-regular-button>
    </div>
  </section>
</div>
