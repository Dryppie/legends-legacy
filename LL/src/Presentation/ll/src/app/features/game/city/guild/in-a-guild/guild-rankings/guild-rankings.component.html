<div
  *ngIf="sortedGuilds() as guilds"
  class="flex h-full w-full flex-col space-y-4 overflow-y-auto p-2"
>
  <ng-container *ngIf="guilds.length > 0; else noGuilds">
    <div class="flex flex-col overflow-hidden text-white">
      <h2 class="p-2 text-primary">Leaderboard</h2>
      <div class="flex flex-col overflow-hidden">
        <div
          class="grid grid-cols-[4rem_minmax(0,1fr)_minmax(0,1fr)_6rem_6rem] items-center gap-2 border-b border-light_gray p-2 text-sm text-zinc-400"
        >
          <div>Rank</div>
          <div>Name</div>
          <div>Owner</div>
          <div class="justify-self-end">Members</div>
          <div class="justify-self-end">Upgrades</div>
        </div>
        <div class="overflow-y-auto">
          <div
            class="grid grid-cols-[4rem_minmax(0,1fr)_minmax(0,1fr)_6rem_6rem] items-center justify-between gap-2 border-b border-light_gray p-2 hover:bg-zinc-300/10"
            *ngFor="let guild of guilds; let i = index"
          >
            <div class="text-primary">#{{ i + 1 }}</div>
            <div class="break-words">
              {{ guild.name }}
            </div>
            <div class="break-words">
              {{ guild.ownerName }}
            </div>
            <div class="justify-self-end">
              {{ guild.memberCount }}/{{ guild.maxMembers }}
            </div>
            <div class="justify-self-end">{{ guild.upgrades }}</div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
  <ng-template #noGuilds>
    <p class="mt-4 text-center italic text-neutral-400">
      No guilds exist! That's.. odd. Aren't you in one?
    </p>
  </ng-template>
</div>
