<div
  class="flex h-full w-full flex-col gap-4 pb-4 pr-4 text-white sm:pb-0 sm:pr-6"
>
  <app-default-header
    title="Character Overview"
    text="Slots 3/120"
    image="character/character"
  ></app-default-header>
  <div class="flex h-full w-full flex-col gap-4 pt-12">
    <div class="flex w-full justify-between">
      <app-character-attributes
        class="flex"
        [attributes]="character?.baseAttributes ?? []"
      ></app-character-attributes>
      <div class="w-96"></div>
    </div>
    <app-equipped-essences
      class=""
      [essences]="character?.equippedEssences ?? []"
    ></app-equipped-essences>
  </div>
</div>
