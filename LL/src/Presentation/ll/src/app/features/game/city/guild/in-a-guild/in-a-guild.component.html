<div class="flex h-full w-full flex-col overflow-y-auto">
  <app-tabs class="flex h-full flex-col overflow-hidden">
    <app-tab label="Guild">
      <app-guild-info
        class="overflow-hidden"
        [guild]="guild"
        (inviteEvent)="inviteCharacterByName($event)"
        (leaveEvent)="leaveGuild()"
        (disbandEvent)="disbandGuild()"
        (rejectEvent)="rejectApplication($event)"
        (approveEvent)="approveApplication($event)"
      ></app-guild-info>
    </app-tab>
    <app-tab label="Buildings">
      <app-guild-buildings class="h-full overflow-hidden"></app-guild-buildings>
    </app-tab>
    <app-tab label="Vault">
      <app-guild-vault class="h-full overflow-hidden"></app-guild-vault>
    </app-tab>
    <app-tab label="Rankings">
      <app-guild-rankings class="h-full overflow-hidden"></app-guild-rankings>
    </app-tab>
  </app-tabs>
</div>
