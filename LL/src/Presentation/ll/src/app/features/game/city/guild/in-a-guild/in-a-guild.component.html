<div class="ll-page-stack overflow-y-auto">
  <section
    class="ll-page-header flex flex-wrap items-start justify-between gap-4"
  >
    <div>
      <p class="ll-eyebrow">Guild Headquarters</p>
      <h1 class="ll-heading mt-1 text-2xl">
        {{ guild.name }}
      </h1>
      <p class="ll-copy mt-1">
        {{ guild.tag ? "[" + guild.tag + "]" : "No guild tag" }}
      </p>
    </div>

    <div class="flex flex-wrap gap-2 text-sm">
      <div class="ll-stat-card px-3 py-2">
        <div class="ll-stat-label">Members</div>
        <div class="ll-heading mt-1 text-lg">
          {{ guild.members.length }} / {{ guild.maxMembers }}
        </div>
      </div>
      <div class="ll-stat-card px-3 py-2">
        <div class="ll-stat-label">Applications</div>
        <div class="ll-heading mt-1 text-lg">{{ guild.invites.length }}</div>
      </div>
      <div
        *ngFor="let resource of resourceSummary.slice(0, 2)"
        class="ll-stat-card px-3 py-2"
      >
        <div class="ll-stat-label">
          {{ resource.resource | humanize }}
        </div>
        <div class="ll-heading mt-1 text-lg">
          {{ resource.amount | numberFormat }}
        </div>
      </div>
    </div>
  </section>

  <app-tabs class="flex h-full flex-col overflow-hidden">
    <app-tab label="Guild">
      <app-guild-info
        class="overflow-hidden"
        [guild]="guild"
        (inviteEvent)="inviteCharacterByName($event)"
        (leaveEvent)="leaveGuild()"
        (disbandEvent)="disbandGuild()"
        (rejectEvent)="rejectApplication($event)"
        (approveEvent)="approveApplication($event)"
      ></app-guild-info>
    </app-tab>
    <app-tab label="Buildings">
      <app-guild-buildings class="h-full overflow-hidden"></app-guild-buildings>
    </app-tab>
    <app-tab label="Missions">
      <app-guild-missions class="h-full overflow-hidden"></app-guild-missions>
    </app-tab>
    <app-tab label="Shop">
      <app-guild-shop class="h-full overflow-hidden"></app-guild-shop>
    </app-tab>
    <app-tab label="Rankings">
      <app-guild-rankings class="h-full overflow-hidden"></app-guild-rankings>
    </app-tab>
  </app-tabs>
</div>
