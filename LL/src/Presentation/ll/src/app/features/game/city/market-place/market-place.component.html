<div class="ll-page-stack pr-4 sm:pr-6">
  <app-default-header
    class="marketplace-header flex-none"
    section="City"
    title="Cinder Bazaar"
    [text]="
      (characterState.currentCharacter()?.cinders ?? 0 | numberFormat) +
      ' Cinders'
    "
    icon="sidebar/city/cinder-bazaar"
  ></app-default-header>

  <section
    *ngIf="canUseMarketplace; else marketplaceUnavailable"
    class="ll-panel flex h-full min-h-0 flex-col overflow-hidden"
    [class.marketplace-mobile-detail]="mobileDetailOpen()"
  >
    <div
      class="marketplace-navigation flex flex-none gap-3 border-b border-light_gray px-4 py-3 lg:px-5"
    >
      <app-market-place-filter
        *ngIf="mode() !== 'orders'"
        (categoryChanged)="onCategoryChanged($event)"
      ></app-market-place-filter>

      <div class="marketplace-mode-nav ll-segmented justify-stretch">
        <button
          type="button"
          class="ll-segmented-button flex-1"
          [class.ll-segmented-button-active]="mode() === 'browse'"
          [attr.aria-pressed]="mode() === 'browse'"
          (click)="setMode('browse')"
        >
          Browse
        </button>
        <button
          type="button"
          class="ll-segmented-button flex-1"
          [class.ll-segmented-button-active]="mode() === 'sell'"
          [attr.aria-pressed]="mode() === 'sell'"
          (click)="setMode('sell')"
        >
          Sell
        </button>
        <button
          type="button"
          class="ll-segmented-button flex flex-1 items-center justify-center gap-2 whitespace-nowrap"
          [class.ll-segmented-button-active]="mode() === 'orders'"
          [attr.aria-pressed]="mode() === 'orders'"
          (click)="setMode('orders')"
        >
          My Orders
          <span
            class="inline-flex min-w-5 items-center justify-center rounded-full bg-primary px-1.5 py-0.5 text-xs font-semibold text-black"
          >
            {{
              marketplaceState.myListings().length +
                marketplaceState.myBuyOrders().length
            }}
          </span>
        </button>
      </div>
    </div>

    <div class="flex min-h-0 flex-1 flex-col overflow-hidden">
      <ng-container [ngSwitch]="mode()">
        <ng-container *ngSwitchCase="'browse'">
          <app-market-place-commodity
            *ngIf="
              selectedMarket().itemType === ItemType.Resource ||
                selectedMarket().itemType === ItemType.Consumable ||
                selectedMarket().itemType === ItemType.Essence;
              else exactItemMarket
            "
            [itemType]="selectedMarket().itemType"
            [subcategory]="selectedMarket().subcategory"
            [category]="selectedMarket().id"
            (mobileDetailChanged)="onMobileDetailChanged($event)"
            class="flex h-full min-h-0"
          ></app-market-place-commodity>

          <ng-template #exactItemMarket>
            <app-market-place-buy
              [itemType]="selectedMarket().itemType"
              class="h-full overflow-y-auto p-4"
            ></app-market-place-buy>
          </ng-template>
        </ng-container>

        <app-market-place-sell
          *ngSwitchCase="'sell'"
          [itemType]="selectedMarket().itemType"
          [category]="selectedMarket().id"
          [subcategory]="selectedMarket().subcategory"
          class="h-full overflow-y-auto p-4"
        ></app-market-place-sell>

        <app-market-place-orders
          *ngSwitchCase="'orders'"
          class="h-full overflow-y-auto p-4"
        ></app-market-place-orders>
      </ng-container>
    </div>
  </section>

  <ng-template #marketplaceUnavailable>
    <section
      class="ll-panel flex min-h-64 items-center justify-center px-6 py-10 text-center"
    >
      <div class="max-w-lg">
        <ng-container *ngIf="!userInfoLoaded; else accessResolved">
          <h2 class="text-xl text-primary">Checking Marketplace access...</h2>
          <p class="mt-3 text-sm text-[var(--ll-color-text-muted)]">
            Verifying your account.
          </p>
        </ng-container>

        <ng-template #accessResolved>
          <ng-container *ngIf="isGuestAccount; else accessCheckFailed">
            <h2 class="text-xl text-primary">
              Register your account to use the Marketplace
            </h2>
            <p class="mt-3 text-sm text-[var(--ll-color-text-muted)]">
              Guest accounts cannot browse or trade on the Marketplace.
            </p>
            <a
              routerLink="/game/settings"
              class="ll-button ll-button-primary mt-6 inline-flex"
            >
              Bind email or Gmail in Settings
            </a>
          </ng-container>

          <ng-template #accessCheckFailed>
            <h2 class="text-xl text-primary">
              Unable to verify Marketplace access
            </h2>
            <p class="mt-3 text-sm text-[var(--ll-color-text-muted)]">
              Please refresh the page and try again.
            </p>
          </ng-template>
        </ng-template>
      </div>
    </section>
  </ng-template>
</div>
