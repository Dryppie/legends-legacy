<div
  class="flex h-full min-h-0 flex-col overflow-hidden bg-auto pr-4 text-white sm:pr-6"
>
  <div class="relative isolate flex flex-none flex-col gap-3">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
        <h1 class="text-2xl uppercase text-primary sm:text-3xl">Marketplace</h1>
      </div>

      <div class="text-sm text-zinc-200">
        You have
        <span class="text-primary">
          {{ characterState.currentCharacter()?.cinders ?? 0 | numberFormat }}
        </span>
        Cinders
      </div>
    </div>

    <app-market-place-filter
      (itemTypeChanged)="onItemTypeChanged($event)"
    ></app-market-place-filter>

    <div
      class="min-h-8 rounded-t border border-light_gray bg-black/30 px-3 py-2 text-primary"
    >
      <ng-container [ngSwitch]="selectedItemType().main">
        <app-market-place-generic
          *ngSwitchCase="ItemType.Consumable"
        ></app-market-place-generic>
        <app-market-place-resources
          *ngSwitchCase="ItemType.Resource"
          [resource]="selectedItemType().sub"
        ></app-market-place-resources>
        <app-market-place-essences
          *ngSwitchCase="ItemType.Essence"
          [essenceListings]="marketplaceState.essences"
        ></app-market-place-essences>
        <app-market-place-equipment
          *ngSwitchCase="ItemType.Equipment"
          [equipmentListings]="marketplaceState.equipment"
        ></app-market-place-equipment>
      </ng-container>
    </div>
  </div>

  <div
    class="min-h-0 flex-1 overflow-hidden rounded-b-md border-x border-b border-light_gray bg-black/20 px-3 pb-3"
  >
    <app-market-place-commodity
      *ngIf="
        selectedItemType().main === ItemType.Resource ||
          selectedItemType().main === ItemType.Consumable;
        else instanceMarket
      "
      [itemType]="selectedItemType().main"
      [subcategory]="selectedItemType().sub"
      class="block h-full min-h-0 overflow-hidden"
    ></app-market-place-commodity>

    <ng-template #instanceMarket>
      <app-tabs class="flex h-full min-h-0 flex-col overflow-hidden">
        <app-tab label="Buy">
          <app-market-place-buy
            [itemType]="selectedItemType().main"
            class="block h-full min-h-0 overflow-hidden"
          ></app-market-place-buy>
        </app-tab>
        <app-tab label="Sell">
          <app-market-place-sell
            [itemType]="selectedItemType().main"
            class="block h-full min-h-0 overflow-hidden"
          ></app-market-place-sell>
        </app-tab>
      </app-tabs>
    </ng-template>
  </div>
</div>
