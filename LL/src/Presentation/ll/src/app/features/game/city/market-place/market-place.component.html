<div class="flex h-full flex-col items-center space-y-3 pr-4 sm:pr-6">
  <div class="flex w-full flex-col sm:gap-4">
    <app-banner
      image="market-place"
      bgPosition="bg-bottom"
      class="w-full"
    ></app-banner>
  </div>
  <app-tab
    [tabs]="tabLabels"
    [activeTab]="activeTab"
    (tabSelected)="setActiveTab($event)"
    class="w-full flex-none"
  ></app-tab>

  <div class="flex h-full w-full flex-col justify-between overflow-hidden">
    <ng-container [ngSwitch]="activeTab">
      <app-market-place-buy
        class="h-full"
        *ngSwitchCase="'Buy'"
      ></app-market-place-buy>
      <app-market-place-sell
        class="h-full"
        *ngSwitchCase="'Sell'"
      ></app-market-place-sell>
    </ng-container>
  </div>
</div>
