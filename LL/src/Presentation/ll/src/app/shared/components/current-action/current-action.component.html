<div class="border-gradient w-full rounded-md py-[1px]">
  <div
    class="flex w-full gap-4 rounded-md bg-cover bg-center px-3 py-2 text-white sm:flex-col sm:gap-0"
    style="
      background-image: linear-gradient(to bottom, #00000095 50%, #1f150c95),
        url(&quot;core/Light.svg&quot;);
    "
  >
    <div class="flex justify-between">
      <label class="whitespace-nowrap">{{ performingAction }}</label>
      <label class="hidden sm:block">{{ totalDuration() }}</label>
    </div>
    <div class="flex w-full gap-2">
      <div class="flex w-full items-center gap-2 rounded-md">
        <label class="block w-14 text-nowrap text-center">{{
          remainingTime
        }}</label>
        <app-progress-bar
          class="w-full"
          (remainingTimeChange)="onRemainingTimeChange($event)"
        >
        </app-progress-bar>
      </div>
      <label class="cursor-pointer text-nowrap text-primary underline"
        >Go to action</label
      >
    </div>
  </div>
</div>
