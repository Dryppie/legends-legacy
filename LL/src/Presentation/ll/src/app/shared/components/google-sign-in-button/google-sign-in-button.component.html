<div class="flex flex-col items-center">
  <div #buttonHost [attr.aria-label]="ariaLabel"></div>

  <p *ngIf="isLoading" class="mt-2 text-sm text-zinc-400" aria-live="polite">
    Loading Google Sign-In…
  </p>

  <div
    *ngIf="loadFailed"
    class="mt-2 max-w-sm rounded border border-amber-700/60 bg-amber-950/40 p-3 text-center"
    role="alert"
  >
    <p class="text-sm text-amber-100">
      Google Sign-In could not load. Browser privacy settings or an extension
      may have blocked it. Allow Google Sign-In for this site, then try again.
    </p>
    <button
      type="button"
      class="mt-3 rounded border border-amber-500 px-3 py-1.5 text-sm text-amber-100 hover:bg-amber-900/60 focus:outline-none focus:ring-2 focus:ring-amber-400"
      (click)="retry()"
    >
      Try again
    </button>
  </div>
</div>
