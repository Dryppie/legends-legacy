<div class="ll-modal-panel max-h-[90vh] max-w-full overflow-y-auto">
  <div class="flex w-full items-center justify-center pb-2">
    <h2 class="ll-heading text-xl">
      {{ equipmentInstance.displayName || equipmentInstance.itemBase.name }}
    </h2>
  </div>

  <div class="border-t border-primary/20 pb-3"></div>

  <div class="flex flex-col gap-4">
    <app-equipment-display [item]="equipmentInstance"> </app-equipment-display>

    <app-inventory-transfer
      *ngIf="inventoryItem as item"
      [inventoryItem]="item"
      (transferred)="onClose()"
    ></app-inventory-transfer>

    <div class="flex place-items-end justify-end gap-2">
      <button
        type="button"
        class="ll-button"
        data-tour="tutorial-equipment-close"
        (click)="onClose()"
      >
        Close
      </button>

      <button
        type="button"
        class="ll-button"
        data-tour="tutorial-equipment-equip"
        (click)="onEquip()"
      >
        Equip
      </button>
    </div>
  </div>
</div>
