<div class="flex min-h-12 w-full items-center text-white">
  <div class="flex min-w-0 items-center gap-3 sm:gap-4">
    <app-profession-icon
      class="hidden scale-75 sm:block"
      [image]="icon"
    ></app-profession-icon>
    <div class="min-w-0">
      <div
        *ngIf="section"
        class="text-xs font-semibold uppercase text-zinc-400"
      >
        {{ section }}
      </div>
      <div class="flex min-w-0 flex-wrap items-baseline gap-x-3 gap-y-1">
        <h1 class="truncate text-xl font-semibold text-primary sm:text-2xl">
          {{ title }}
        </h1>
        <span *ngIf="text" class="truncate text-xs text-zinc-400 sm:text-sm">
          {{ text }}
        </span>
      </div>
    </div>
  </div>
</div>
