<div class="flex min-h-12 w-full items-center justify-between gap-3 text-white">
  <div class="flex min-w-0 items-center gap-3 sm:gap-4">
    <app-feature-icon
      class="hidden sm:block"
      [decorated]="!icon.startsWith('sidebar/')"
      [image]="icon"
    ></app-feature-icon>
    <div class="min-w-0">
      <div
        *ngIf="section"
        class="text-xs font-semibold uppercase text-zinc-400"
      >
        {{ section }}
      </div>
      <div class="flex min-w-0 flex-wrap items-baseline gap-x-3 gap-y-1">
        <h1 class="truncate text-xl font-semibold text-primary sm:text-2xl">
          {{ title }}
        </h1>
        <span *ngIf="text" class="truncate text-xs text-zinc-400 sm:text-sm">
          {{ text }}
        </span>
      </div>
    </div>
    <ng-content select="[header-title-actions]"></ng-content>
  </div>
  <div class="flex shrink-0 items-center gap-2">
    <ng-content select="[header-actions]"></ng-content>
    <app-help-launcher
      *ngIf="showGuide"
      [pageId]="guidePageId"
      presentation="inline"
      [ariaLabel]="'Open ' + title + ' guide'"
    ></app-help-launcher>
  </div>
</div>
