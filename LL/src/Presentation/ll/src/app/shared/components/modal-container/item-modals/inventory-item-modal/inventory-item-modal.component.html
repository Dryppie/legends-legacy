<div class="ll-modal-panel max-h-[90vh] max-w-full overflow-y-auto">
  <div class="flex w-full items-center justify-center pb-2">
    <h2 class="ll-heading text-xl">{{ itemName }}</h2>
  </div>
  <div class="border-t border-primary/20 pb-3"></div>

  <div class="flex flex-col gap-4">
    <div class="ll-card p-3">
      <app-item [item]="inventoryItem.itemInstance"></app-item>
      <p class="ll-copy mt-3">
        {{ itemDescription(inventoryItem.itemInstance.itemBase) }}
      </p>
      <div class="ll-copy mt-3">Quantity: {{ inventoryItem.quantity }}</div>
    </div>

    <div *ngIf="selectionCrate as metadata" class="ll-card p-3">
      <ng-container *ngIf="!metadata.isRandom">
        <h3 class="ll-heading text-base">
          Choose Your {{ metadata.selectionLabel }}
        </h3>
        <p class="ll-copy mt-1">
          Opening this container grants one of the following choices.
        </p>
        <input *ngIf="metadata.options.length > 12" type="search"
          aria-label="Filter equipment choices" placeholder="Filter by item, slot or specialization"
          class="mt-3 w-full rounded border border-light_gray bg-black/40 p-2 text-white focus:border-primary"
          [value]="crateSearch()" (input)="searchCrateOptions($any($event.target).value)" />
        <p *ngIf="filterSelectionOptions(metadata.options, crateSearch()).length === 0" class="ll-copy mt-2">No matching choices.</p>
        <div class="mt-3 grid max-h-80 grid-cols-1 gap-2 overflow-y-auto sm:grid-cols-2">
          <app-essence-preview
            *ngFor="let option of filterSelectionOptions(metadata.options, crateSearch())"
            [definition]="option.essence"
            originClass="relative block h-full"
          >
            <button
              type="button"
              class="ll-button flex h-full w-full items-center justify-between gap-3 text-left"
              [class.ring-1]="selectedCrateOptionId() === option.id"
              [class.ring-primary]="selectedCrateOptionId() === option.id"
              [attr.aria-pressed]="selectedCrateOptionId() === option.id"
              (click)="selectCrateOption(option)"
            >
              <span class="flex min-w-0 items-center gap-2">
                <span>{{ option.name }}<span *ngIf="option.description" class="mt-1 block text-xs text-zinc-400">{{ option.description }}</span></span>
                <span
                  *ngIf="isCrateOptionAbsorbed(option)"
                  class="shrink-0 rounded border border-success/40 bg-success/10 px-1.5 py-0.5 text-xs font-semibold uppercase tracking-wide text-success"
                >
                  Absorbed
                </span>
              </span>
              <strong class="text-primary">×{{ option.quantity }}</strong>
            </button>
          </app-essence-preview>
        </div>
      </ng-container>
      <div class="ll-state mt-3">Opening consumes one {{ itemName }}.</div>
    </div>

    <app-inventory-transfer
      [inventoryItem]="inventoryItem"
      (transferred)="close.emit()"
    ></app-inventory-transfer>

    <div *ngIf="error() as message" class="ll-state ll-state-danger">
      {{ message }}
    </div>
    <div class="flex justify-end gap-2">
      <button type="button" (click)="close.emit()" class="ll-button">
        Close
      </button>
      <button
        *ngIf="selectionCrate"
        type="button"
        class="ll-button"
        [disabled]="isOpeningCrate() || !selectedCrateOptionId()"
        (click)="openSelectionCrate()"
      >
        {{ isOpeningCrate() ? "Opening..." : "Open" }}
      </button>
    </div>
  </div>
</div>
