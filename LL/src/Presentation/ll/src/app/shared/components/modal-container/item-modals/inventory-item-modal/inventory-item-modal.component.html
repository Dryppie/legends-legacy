<div class="ll-modal-panel max-h-[90vh] max-w-full overflow-y-auto">
  <div class="flex w-full items-center justify-center pb-2">
    <h2 class="ll-heading text-xl">{{ itemName }}</h2>
  </div>
  <div class="border-t border-primary/20 pb-3"></div>

  <div class="flex flex-col gap-4">
    <div class="ll-card p-3">
      <app-item [item]="inventoryItem.itemInstance"></app-item>
      <p class="ll-copy mt-3">
        {{ itemDescription(inventoryItem.itemInstance.itemBase) }}
      </p>
      <div class="ll-copy mt-3">Quantity: {{ inventoryItem.quantity }}</div>
    </div>

    <div *ngIf="selectionCrate as metadata" class="ll-card p-3">
      <h3 class="ll-heading text-base">
        Choose Your {{ metadata.selectionLabel }}
      </h3>
      <p class="ll-copy mt-1">
        Opening this container grants one of the following choices.
      </p>
      <div class="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-2">
        <button
          *ngFor="let option of metadata.options"
          type="button"
          class="ll-button flex items-center justify-between gap-3 text-left"
          [class.ring-1]="selectedCrateOptionId() === option.id"
          [class.ring-primary]="selectedCrateOptionId() === option.id"
          [attr.aria-pressed]="selectedCrateOptionId() === option.id"
          (click)="selectCrateOption(option)"
        >
          <span>{{ option.name }}</span>
          <strong class="text-primary">×{{ option.quantity }}</strong>
        </button>
      </div>
      <div class="ll-state mt-3">Opening consumes one {{ itemName }}.</div>
    </div>

    <app-inventory-transfer
      [inventoryItem]="inventoryItem"
      (transferred)="close.emit()"
    ></app-inventory-transfer>

    <div *ngIf="error() as message" class="ll-state ll-state-danger">
      {{ message }}
    </div>
    <div class="flex justify-end gap-2">
      <button type="button" (click)="close.emit()" class="ll-button">
        Close
      </button>
      <button
        *ngIf="selectionCrate"
        type="button"
        class="ll-button"
        [disabled]="isOpeningCrate() || !selectedCrateOptionId()"
        (click)="openSelectionCrate()"
      >
        {{ isOpeningCrate() ? "Opening..." : "Open" }}
      </button>
    </div>
  </div>
</div>
