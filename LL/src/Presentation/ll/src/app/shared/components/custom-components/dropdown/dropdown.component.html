<button
  #dropdownButton
  #dropdownOrigin="cdkOverlayOrigin"
  cdkOverlayOrigin
  type="button"
  class="flex h-8 w-full items-center justify-between gap-2 whitespace-nowrap rounded px-3 text-left text-sm text-neutral-300 transition-colors hover:bg-zinc-600/30"
  [ngClass]="
    selected
      ? 'bg-primary/30 text-primary shadow-[inset_0_0_0_1px_rgba(249,220,160,0.35)] hover:bg-primary/40'
      : ''
  "
  [attr.aria-expanded]="hasSubOptions || hasOptions ? open() : null"
  [attr.aria-haspopup]="hasSubOptions || hasOptions ? 'menu' : null"
  [attr.aria-controls]="open() && (hasSubOptions || hasOptions) ? menuId : null"
  (click)="onButtonClick($event)"
  (keydown)="onDropdownKeydown($event)"
>
  {{ displayLabel }}
  <svg
    *ngIf="hasSubOptions || hasOptions"
    class="h-3 w-3 transition-transform duration-200"
    [ngClass]="{ 'rotate-180': open() }"
    viewBox="0 0 16 16"
    fill="currentColor"
  >
    <path d="M3.2 5.5 8 10.3l4.8-4.8L14 6.7l-6 6-6-6z" />
  </svg>
</button>

<!-- Dropdown ------------------------------------------------------------->
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="dropdownOrigin"
  [cdkConnectedOverlayOpen]="open() && hasSubOptions"
  [cdkConnectedOverlayPositions]="dropdownPositions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
>
  <ul
    [id]="menuId"
    class="min-w-40 rounded border border-light_gray bg-texture py-1 shadow-xl shadow-black/60"
    role="menu"
    (keydown)="onDropdownKeydown($event)"
  >
    <li
      *ngFor="let sub of subOptions"
      class="grid cursor-pointer grid-cols-[1fr_auto] gap-6 whitespace-nowrap px-3 py-2 text-sm text-zinc-300 hover:bg-primary/20 hover:text-white"
      role="menuitem"
      tabindex="0"
      (click)="onSubOptionClick(sub)"
      (keydown)="onSubOptionKeydown($event, sub)"
    >
      <span>{{ sub }}</span>
      <span class="text-primary">0</span>
    </li>
  </ul>
</ng-template>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="dropdownOrigin"
  [cdkConnectedOverlayOpen]="open() && hasOptions"
  [cdkConnectedOverlayPositions]="dropdownPositions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
>
  <ul
    [id]="menuId"
    class="max-h-72 overflow-y-auto rounded border border-light_gray bg-texture py-1 shadow-xl shadow-black/60"
    [style.width.px]="dropdownButton.offsetWidth"
    role="listbox"
    (keydown)="onDropdownKeydown($event)"
  >
    <li
      *ngFor="let option of options"
      class="grid cursor-pointer grid-cols-[1fr_auto] gap-6 whitespace-nowrap px-3 py-2 text-sm text-zinc-300 transition-colors hover:bg-primary/20 hover:text-white"
      [ngClass]="{
        'bg-primary/20 text-primary': isOptionSelected(option),
        'cursor-not-allowed opacity-45 hover:bg-transparent hover:text-zinc-300':
          option.disabled,
      }"
      role="option"
      [attr.aria-selected]="isOptionSelected(option)"
      [attr.aria-disabled]="option.disabled || null"
      [attr.tabindex]="option.disabled ? -1 : 0"
      (click)="onOptionClick(option)"
      (keydown)="onOptionKeydown($event, option)"
    >
      <span>{{ option.label }}</span>
      <span *ngIf="option.detail" class="text-primary">{{
        option.detail
      }}</span>
    </li>
  </ul>
</ng-template>
