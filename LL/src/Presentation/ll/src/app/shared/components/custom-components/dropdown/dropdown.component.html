<button
  class="flex items-center gap-1 whitespace-nowrap rounded border border-zinc-300/30 px-2 py-1 text-sm text-neutral-300 hover:bg-zinc-300/30"
  [ngClass]="selected ? 'bg-primary/30 hover:bg-primary/40' : ''"
  (click)="onButtonClick($event)"
>
  {{ label }}
  <svg
    *ngIf="hasSubOptions"
    class="h-3 w-3 transition-transform duration-200"
    viewBox="0 0 16 16"
    fill="currentColor"
  >
    <path d="M3.2 5.5 8 10.3l4.8-4.8L14 6.7l-6 6-6-6z" />
  </svg>
</button>

<!-- Dropdown ------------------------------------------------------------->
<ul
  *ngIf="open()"
  class="absolute z-10 mt-1 min-w-[8rem] rounded border border-zinc-300/30 bg-texture shadow-lg"
>
  <li
    *ngFor="let sub of subOptions"
    class="cursor-pointer whitespace-nowrap px-2 py-1 text-sm text-neutral-300 hover:bg-primary/20"
    (click)="onSubOptionClick(sub)"
  >
    {{ sub }}
  </li>
</ul>
