<button
  class="flex h-8 items-center gap-1 whitespace-nowrap rounded px-3 text-sm text-neutral-300 transition-colors hover:bg-zinc-600/30"
  [ngClass]="
    selected
      ? 'bg-primary/30 text-primary shadow-[inset_0_0_0_1px_rgba(249,220,160,0.35)] hover:bg-primary/40'
      : ''
  "
  (click)="onButtonClick($event)"
>
  {{ label }}
  <svg
    *ngIf="hasSubOptions"
    class="h-3 w-3 transition-transform duration-200"
    viewBox="0 0 16 16"
    fill="currentColor"
  >
    <path d="M3.2 5.5 8 10.3l4.8-4.8L14 6.7l-6 6-6-6z" />
  </svg>
</button>

<!-- Dropdown ------------------------------------------------------------->
<ul
  *ngIf="open()"
  class="absolute z-20 mt-1 min-w-40 rounded border border-light_gray bg-texture py-1 shadow-xl shadow-black/60"
>
  <li
    *ngFor="let sub of subOptions"
    class="grid cursor-pointer grid-cols-[1fr_auto] gap-6 whitespace-nowrap px-3 py-2 text-sm text-zinc-300 hover:bg-primary/20 hover:text-white"
    (click)="onSubOptionClick(sub)"
  >
    <span>{{ sub }}</span>
    <span class="text-primary">0</span>
  </li>
</ul>
