<div
  class="relative flex h-64 w-full overflow-visible rounded-md bg-cover sm:size-64"
  [class.opacity-50]="isLocked"
  [class.pointer-events-none]="isLocked"
  [class.grayscale]="isLocked"
  style="
    background-image: url(&quot;cards/optimized/{{ iconPath }}.webp&quot;);
    box-shadow: 0 6px 6px -3px rgba(0, 0, 0, 0.4);
  "
>
  <div class="absolute z-10 w-full p-3">
    <div class="group relative flex sm:inline-block">
      <button class="cursor-pointer border-none bg-transparent p-0">
        <img src="icons/Info.svg" class="size-6" />
      </button>
      <div class="absolute top-0 hidden rounded border border-light_gray bg-texture p-2 text-sm shadow group-hover:block sm:w-56 ml-8" style="white-space: pre-line">
        <p class="text-[#a5a9b4] mb-1">{{ gatheringNode.description }}</p>
        <p class="font-semibold text-white">{{ gatheringNode.yield }}</p>
      </div>
    </div>
  </div>

  <div class="relative flex h-full w-full items-end">
    <div
      class="border-gradient absolute w-full rounded-md opacity-70"
      style="height: calc(6rem + 2px); bottom: -1px"
    ></div>
    <div class="absolute flex h-24 w-full overflow-hidden rounded-b-md">
      <div
        class="card-gradient absolute h-full w-full p-4 opacity-50 backdrop-blur-[2px]"
      ></div>
      <div
        class="absolute h-full w-full bg-black/40 p-4 backdrop-blur-[1px]"
      ></div>
    </div>
    <div class="relative flex w-full items-end justify-between p-3 text-white">
      <div class="flex flex-col gap-1 pb-4">
        <div class="flex items-center justify-between">
          <h3>{{ gatheringNode.name }}</h3>
        </div>
        <small class="text-secondary"
          >Req. LV: {{ gatheringNode.levelRequirement }}</small
        >
        <div class="mt-2 flex items-center gap-2"></div>
      </div>
      <div class="-mb-2">
        <app-mini-button
          *ngIf="specificCard()"
          class="w-[64px]"
          text="Cancel"
          (click)="cancelCharacterAction()"
        ></app-mini-button>
        <app-mini-button
          *ngIf="canStartAction"
          class="w-[64px]"
          [text]="startActionText"
          (click)="startGatheringAction()"
        ></app-mini-button>
      </div>
    </div>
  </div>
</div>
