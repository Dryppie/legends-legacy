<div class="flex h-full w-full items-center justify-between">
  <label class="min-w-24 text-nowrap text-primary"
    >HP: <label class="text-white">{{ health }}/{{ maxHealth }}</label></label
  >
  <div
    class="relative h-3 w-full justify-self-end overflow-hidden rounded-full bg-black p-[2px]"
  >
    <div
      #healthBar
      class="h-full rounded-md bg-cover"
      style="
        background-image: url(&quot;combat/healthBar.svg&quot;);
        box-shadow: 0 6px 6px -3px rgba(0, 0, 0, 0.4);
      "
    ></div>

    <div
      #barrierBar
      class="absolute left-0 top-0 h-full bg-slate-400 opacity-75"
      style="box-shadow: 0 6px 6px -3px rgba(0, 0, 0, 0.4)"
    ></div>
  </div>
</div>
