<app-popover [template]="hoverTpl" trigger="hover">
  <div class="ll-item-name flex" [ngClass]="rarityClasses">
    {{ item.name }}
  </div>
</app-popover>

<ng-template #hoverTpl>
  <app-essence-details
    *ngIf="isEssence"
    [essence]="itemAsEssence(item)"
  ></app-essence-details>
  <app-equipment-display
    *ngIf="isEquipment"
    [item]="itemAsEquipment(item)"
    [useBaseName]="useBaseName"
  ></app-equipment-display>

  <div *ngIf="isGenericItem" class="ll-item-detail">
    <div class="flex items-start justify-between gap-3">
      <h2 class="ll-item-detail-title" [ngClass]="rarityClasses">
        {{ item.name }}
      </h2>
      <span *ngIf="!useBaseName" class="ll-item-chip ll-item-chip-accent">
        {{ item.rarity }}
      </span>
    </div>

    <div class="ll-item-meta">
      {{ item.itemType }}
    </div>

    <p *ngIf="item.description" class="ll-item-description">
      {{ item.description }}
    </p>

    <div class="ll-item-detail-section flex flex-wrap gap-2">
      <span *ngIf="item.stackable" class="ll-item-chip"> Stackable </span>
      <span *ngIf="item.isBound" class="ll-item-chip"> Bound </span>
    </div>
  </div>
</ng-template>
