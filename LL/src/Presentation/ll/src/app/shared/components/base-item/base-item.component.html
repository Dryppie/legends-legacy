<app-popover [template]="hoverTpl" trigger="hover">
  <div class="flex" [ngClass]="rarityClasses">
    {{ item.name }}
  </div>
</app-popover>

<ng-template #hoverTpl>
  <app-essence-details
    *ngIf="isEssence"
    [essence]="itemAsEssence(item)"
  ></app-essence-details>
  <app-equipment-display
    *ngIf="isEquipment"
    [item]="itemAsEquipment(item)"
    [useBaseName]="useBaseName"
  ></app-equipment-display>

  <div *ngIf="isGenericItem" class="flex min-w-64 max-w-80 flex-col gap-3">
    <div class="flex items-start justify-between gap-3">
      <h2 class="font-serif text-lg leading-tight" [ngClass]="rarityClasses">
        {{ item.name }}
      </h2>
      <span
        *ngIf="!useBaseName"
        class="rounded border border-primary/40 px-2 py-0.5 text-[11px] text-primary"
      >
        {{ item.rarity }}
      </span>
    </div>

    <div class="text-[11px] uppercase tracking-[0.16em] text-secondary">
      {{ item.itemType }}
    </div>

    <p *ngIf="item.description" class="text-sm leading-relaxed text-zinc-300">
      {{ item.description }}
    </p>

    <div class="flex flex-wrap gap-2 border-t border-primary/20 pt-2 text-xs">
      <span
        *ngIf="item.stackable"
        class="rounded border border-white/10 px-2 py-0.5 text-zinc-300"
      >
        Stackable
      </span>
      <span
        *ngIf="item.isBound"
        class="rounded border border-white/10 px-2 py-0.5 text-zinc-300"
      >
        Bound
      </span>
    </div>
  </div>
</ng-template>
