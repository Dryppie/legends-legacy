<span
  *ngIf="isOnline(); else offline"
  class="ll-text-success inline-flex items-center gap-1.5 text-xs font-semibold"
>
  <span class="size-1.5 rounded-full bg-success" aria-hidden="true"></span>
  Online
</span>

<ng-template #offline>
  <span
    class="inline-flex items-center gap-1.5 text-xs text-secondary"
    [title]="offlineTitle()"
  >
    <span
      *ngIf="compact()"
      class="size-1.5 rounded-full bg-[var(--ll-color-text-disabled)]"
      aria-hidden="true"
    ></span>
    {{ offlineLabel() }}
  </span>
</ng-template>
