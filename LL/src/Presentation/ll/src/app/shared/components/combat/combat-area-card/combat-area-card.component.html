<div
  class="ll-card relative flex h-64 w-full overflow-visible bg-cover sm:size-60"
  [class.ll-card-borderless]="!isActiveBattle"
  [class.z-10]="isActiveBattle"
  [class.opacity-50]="isLocked"
  [class.pointer-events-none]="isLocked"
  [class.grayscale]="isLocked"
  [attr.aria-label]="isActiveBattle ? area.name + ', in battle now' : null"
  [attr.data-tour]="trainingAreaTourId()"
  [style.background-image]="
    'url(&quot;cards/optimized/combatArea.webp&quot;)'
  "
  [style.border-color]="isActiveBattle ? 'var(--ll-color-primary)' : null"
  [style.box-shadow]="
    '0 6px 6px -3px rgba(0, 0, 0, 0.4)'
  "
>
  <div
    *ngIf="area.essenceProgress as essenceProgress"
    class="area-essence-counter absolute right-3 top-3 z-30"
    [class.area-essence-counter-completed]="isEssenceCollectionCompleted()"
    [attr.aria-label]="
      essenceProgress.collected +
      ' of ' +
      essenceProgress.total +
      ' area Essences archived'
    "
  >
    <span
      class="area-essence-counter-diamond"
      aria-hidden="true"
    ></span>
    <span class="area-essence-counter-value">
      {{ essenceProgress.collected }}/{{ essenceProgress.total }}
    </span>
  </div>

  <div
    *ngIf="area.possibleDrops?.length"
    class="absolute z-30 w-full p-3"
  >
    <div class="group relative flex sm:inline-block">
      <button
        type="button"
        class="border-none bg-transparent p-0"
        [attr.aria-label]="'Show possible drops for ' + area.name"
      >
        <img src="icons/Info.svg" class="size-6" />
      </button>
      <div
        class="ll-card absolute top-0 hidden bg-texture p-3 text-sm text-white shadow group-hover:block group-focus-within:block sm:w-56"
        [ngClass]="{
          'ml-8': !isLastInRow,
          'right-full mr-2': isLastInRow,
        }"
        role="tooltip"
      >
        <strong class="ll-stat-label block pb-2">Possible drops</strong>
        <ul class="space-y-1">
          <li
            *ngFor="let drop of area.possibleDrops"
            class="flex items-center gap-2"
          >
            <span
              class="size-1.5 shrink-0 rounded-full bg-primary"
              aria-hidden="true"
            ></span>
            <span>{{ drop.name }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ul
    *ngIf="gatheringTypes().length > 0"
    class="absolute bottom-[6.75rem] right-4 z-20 flex items-center gap-3"
    [attr.data-tour]="gatheringTourId()"
    aria-label="Gathering nodes"
  >
    <li
      *ngFor="let gatheringType of gatheringTypes()"
      class="group/node relative size-8"
    >
      <button
        type="button"
        class="absolute inset-0 flex rotate-45 items-center justify-center rounded-md border shadow-md backdrop-blur-sm transition duration-150 group-hover/node:-translate-y-0.5 group-hover/node:shadow-lg group-focus-within/node:-translate-y-0.5"
        [class.border-slate-300/80]="gatheringType === GatheringType.Mining"
        [class.bg-slate-800/90]="gatheringType === GatheringType.Mining"
        [class.text-slate-100]="gatheringType === GatheringType.Mining"
        [class.border-emerald-500/80]="
          gatheringType === GatheringType.Woodcutting
        "
        [class.bg-emerald-950/90]="
          gatheringType === GatheringType.Woodcutting
        "
        [class.text-emerald-200]="
          gatheringType === GatheringType.Woodcutting
        "
        [class.border-amber-500/80]="gatheringType === GatheringType.Skinning"
        [class.bg-amber-950/90]="gatheringType === GatheringType.Skinning"
        [class.text-amber-200]="gatheringType === GatheringType.Skinning"
        [attr.aria-label]="gatheringType + ' abundant area, 50% bonus yield'"
      >
        <span
          class="-rotate-45 text-[0.65rem] font-semibold"
          aria-hidden="true"
        >
          {{ gatheringTypeInitial(gatheringType) }}
        </span>
      </button>

      <span
        class="pointer-events-none absolute bottom-full left-1/2 z-40 mb-3 -translate-x-1/2 translate-y-1 whitespace-nowrap rounded border border-[var(--ll-color-border-strong)] bg-zinc-950/95 px-2 py-1 text-[0.65rem] font-medium text-white opacity-0 shadow-xl transition-all duration-150 group-hover/node:translate-y-0 group-hover/node:opacity-100 group-focus-within/node:translate-y-0 group-focus-within/node:opacity-100"
        role="tooltip"
      >
        <span
          class="mr-1 inline-block size-1.5 rounded-full"
          [class.bg-slate-300]="gatheringType === GatheringType.Mining"
          [class.bg-emerald-400]="
            gatheringType === GatheringType.Woodcutting
          "
          [class.bg-amber-400]="gatheringType === GatheringType.Skinning"
          aria-hidden="true"
        ></span>
        Abundant {{ gatheringType }}: +50% yield
      </span>
    </li>
  </ul>

  <div class="relative flex h-full w-full items-end">
    <div
      class="border-gradient absolute w-full rounded-md opacity-70"
      style="height: calc(6rem + 2px); bottom: -1px"
    ></div>
    <div class="absolute flex h-24 w-full overflow-hidden rounded-b-md">
      <div
        class="card-gradient absolute h-full w-full p-4 opacity-50 backdrop-blur-[2px]"
      ></div>
      <div
        class="absolute h-full w-full bg-black/40 p-4 backdrop-blur-[1px]"
      ></div>
    </div>
    <div class="relative flex w-full items-end justify-between p-3 text-white">
      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <h3 class="ll-heading text-lg">{{ area.name }}</h3>
        </div>
        <small *ngIf="isActiveBattle; else levelRequirement" class="text-danger">
          In battle now
        </small>
        <ng-template #levelRequirement>
          <div class="flex items-center gap-3">
            <small class="ll-stat-label">
              Req. LV: {{ area.levelRequirement }}
            </small>
            <span
              *ngIf="isEssenceCollectionCompleted()"
              class="text-[0.65rem] font-semibold uppercase tracking-[0.12em] text-primary"
            >
              Completed
            </span>
          </div>
        </ng-template>
      </div>
      <div class="-mb-2" [attr.data-tour]="trainingBattleButtonTourId()">
        <app-mini-button
          *ngIf="specificCard()"
          class="w-[64px]"
          text="Cancel"
        ></app-mini-button>
        <app-mini-button
          *ngIf="canStartAction() || isStartingIdleCombat()"
          class="w-[64px]"
          [text]="battleButtonText()"
          [disabled]="isStartingIdleCombat()"
          (click)="startCombat()"
        ></app-mini-button>
      </div>
    </div>
  </div>
</div>
