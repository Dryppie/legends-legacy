<div
  class="ll-card ll-card-borderless relative flex h-64 w-full overflow-visible bg-cover sm:size-64"
  [class.opacity-50]="isLocked"
  [class.pointer-events-none]="isLocked"
  [class.grayscale]="isLocked"
  [attr.data-tour]="trainingAreaTourId()"
  style="
    background-image: url(&quot;cards/optimized/combatArea.webp&quot;);
    box-shadow: 0 6px 6px -3px rgba(0, 0, 0, 0.4);
  "
>
  <div class="absolute z-10 w-full p-3">
    <div class="group relative flex sm:inline-block">
      <button class="cursor-pointer border-none bg-transparent p-0">
        <img src="icons/Info.svg" class="size-6" />
      </button>
      <div
        class="ll-card absolute top-0 hidden bg-texture p-2 text-sm text-white shadow group-hover:block sm:w-56"
        [ngClass]="{
          'ml-8': !isLastInRow,
          'right-full mr-2': isLastInRow,
        }"
      >
        {{ area.description }}
      </div>
    </div>
  </div>

  <div class="relative flex h-full w-full items-end">
    <div
      class="border-gradient absolute w-full rounded-md opacity-70"
      style="height: calc(6rem + 2px); bottom: -1px"
    ></div>
    <div class="absolute flex h-24 w-full overflow-hidden rounded-b-md">
      <div
        class="card-gradient absolute h-full w-full p-4 opacity-50 backdrop-blur-[2px]"
      ></div>
      <div
        class="absolute h-full w-full bg-black/40 p-4 backdrop-blur-[1px]"
      ></div>
    </div>
    <div class="relative flex w-full items-end justify-between p-3 text-white">
      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <h3 class="ll-heading text-lg">{{ area.name }}</h3>
        </div>
        <small class="ll-stat-label"
          >Req. LV: {{ area.levelRequirement }}</small
        >
        <div class="mt-1 flex max-w-40 flex-wrap gap-1">
          <span
            *ngFor="let gatheringType of gatheringTypes()"
            class="ll-item-chip text-[0.65rem] text-primary"
          >
            {{ gatheringType }}
          </span>
          <span
            *ngIf="gatheringTypes().length === 0"
            class="ll-item-chip text-[0.65rem]"
          >
            No gathering
          </span>
        </div>
      </div>
      <div class="-mb-2" [attr.data-tour]="trainingBattleButtonTourId()">
        <app-mini-button
          *ngIf="specificCard()"
          class="w-[64px]"
          text="Cancel"
        ></app-mini-button>
        <app-mini-button
          *ngIf="canStartAction()"
          class="w-[64px]"
          [text]="battleButtonText()"
          (click)="startCombat()"
        ></app-mini-button>
      </div>
    </div>
  </div>
</div>
