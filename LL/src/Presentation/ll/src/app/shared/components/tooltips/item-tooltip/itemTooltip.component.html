<div
  [ngClass]="rarityClasses"
  class="absolute w-64 rounded-lg bg-slate-800/90 p-4 text-sm text-white opacity-0 shadow-lg transition-opacity duration-200 group-hover:opacity-100"
>
  <div class="flex flex-col space-y-1 text-white">
    <h3 class="text-primary">{{ title }}</h3>
    <div class="flex pb-1">
      <span class="">{{ rarity }} {{ itemType }}</span>
    </div>
    <div class="flex flex-col">
      <span class="whitespace-pre-wrap">{{ description }} </span>
    </div>
    <!-- <div class="flex justify-between">
        <span class="">Ability:</span>
        <span>{{ item.ability }}</span>
    </div> -->
    <!-- <div>
        <span class="">Attributes:</span>
        <ul class="list-disc list-inside ml-4">
            <li *ngFor="let attr of attributeEntries">
                {{ attr.key }}: {{ attr.value }}
            </li>
        </ul>
    </div> -->
  </div>
  <div *ngIf="isEssence()" class="flex justify-between">
    <button
      (click)="openEssenceModal()"
      class="mt-2 rounded bg-light px-2 py-1 text-white"
    >
      Details
    </button>

    <button
      (click)="equipEssence()"
      class="mt-2 rounded bg-light px-2 py-1 text-white"
    >
      Equip Essence
    </button>
  </div>
</div>
