<div
  class="ll-panel flex h-full flex-col overflow-hidden"
  [ngClass]="{ 'animate-pulse': isLoading }"
>
  <div class="flex items-center justify-between px-4 py-2">
    <div class="flex items-center gap-2 py-2">
      <span class="ll-heading text-lg">Battle Overview</span>
      <button
        type="button"
        class="ll-button p-2"
        aria-label="Open combat filters"
        (click)="openFilters()"
      >
        <img
          src="icons/settings/filters.svg"
          alt=""
          class="h-5 w-5 object-contain"
        />
      </button>
    </div>
    <app-regular-button
      class="text-primary"
      [text]="
        battleType === 'IdleCombat' ? stopCombatButtonText : skipColosseumMatch
      "
      [disabled]="isStoppingCombat"
      (pressed)="initiateStoppingCombat()"
    >
    </app-regular-button>
  </div>
  <div class="border-b border-light_gray/60"></div>
  <div class="overflow-y-auto" appStickyScroll>
    <app-combat-overview-item
      *ngFor="let combatEvent of filteredCombatEvents"
      class="animate-fade-in-up"
      [combatEvent]="combatEvent"
    ></app-combat-overview-item>
    <div #sentinel></div>
  </div>
</div>
