<div class="ll-modal-panel max-w-full">
  <h3 class="ll-heading text-lg">
    Select which events you want displayed in the combat log:
  </h3>
  <div class="my-3 border-t border-primary/20"></div>
  <div class="flex flex-col justify-between gap-4">
    <div class="ll-toolbar">
      <button type="button" class="ll-button px-3 py-1" (click)="selectAll()">
        Select All
      </button>
      <button type="button" class="ll-button px-3 py-1" (click)="deselectAll()">
        Deselect All
      </button>
    </div>

    <div class="flex flex-col gap-4">
      <div class="grid grid-cols-2 gap-2">
        <label *ngFor="let eventType of eventTypes" class="ll-checkbox">
          <input
            type="checkbox"
            [checked]="selectedEventTypes.includes(eventType)"
            (change)="onToggleEventType(eventType, $event)"
          />
          <span>{{ eventType }}</span>
        </label>
      </div>
    </div>

    <div class="flex w-full place-items-end justify-end gap-2">
      <button type="button" (click)="onSave()" class="ll-button">Save</button>
      <button type="button" (click)="onClose()" class="ll-button">Close</button>
    </div>
  </div>
</div>
