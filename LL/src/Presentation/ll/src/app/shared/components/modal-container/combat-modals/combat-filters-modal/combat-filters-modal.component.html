<div class="max-w-full rounded-lg border-primary bg-texture p-6 text-white">
  <!-- Modal Header -->
  <h3>Select which events you want displayed in the combat log:</h3>
  <div class="flex w-full items-center justify-center pb-2"></div>
  <div class="border-t border-light_gray pb-3"></div>
  <div class="flex flex-col justify-between gap-4">
    <div class="flex w-full gap-2">
      <button
        class="rounded bg-light px-3 py-1 text-sm text-white"
        (click)="selectAll()"
      >
        Select All
      </button>
      <button
        class="rounded bg-light px-3 py-1 text-sm text-white"
        (click)="deselectAll()"
      >
        Deselect All
      </button>
    </div>
    <!-- Modal Body -->
    <div class="flex flex-col gap-4">
      <div class="grid grid-cols-2 gap-2">
        <!-- Loop through all possible event types -->
        <label
          *ngFor="let eventType of eventTypes"
          class="flex items-center space-x-4"
        >
          <input
            type="checkbox"
            [checked]="selectedEventTypes.includes(eventType)"
            (change)="onToggleEventType(eventType, $event)"
            class="form-checkbox h-4 w-4 accent-primary transition duration-150 ease-in-out"
          />
          <span>{{ eventType }}</span>
        </label>
      </div>
    </div>
    <!-- Modal Footer -->
    <div class="flex w-full place-items-end justify-end gap-2">
      <button (click)="onSave()" class="rounded bg-light px-4 py-2 text-white">
        Save
      </button>
      <button (click)="onClose()" class="rounded bg-light px-4 py-2 text-white">
        Close
      </button>
    </div>
  </div>
</div>
