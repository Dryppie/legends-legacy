<div
  class="group relative flex w-full items-center justify-between gap-2 px-2 py-1 text-primary hover:bg-zinc-900/50 focus:outline-none"
  [appAttributeTooltip]="attribute"
>
  <div>{{ attribute.attributeType | attributeTypeFormat }}</div>
  <div class="text-white">
    {{ attribute.value | attributeValueFormat: attribute.attributeType }}
  </div>
</div>
