<div class="ll-modal-backdrop z-50">
  <div
    class="ll-modal-panel max-w-md px-8 py-6 text-center"
    [ngClass]="colorClasses"
  >
    <h2 class="ll-heading mb-4 text-3xl" [ngClass]="colorClasses">
      {{ title }}
    </h2>
    <p class="ll-copy mb-6">
      {{
        outcome === "Victory"
          ? "You've bested your opponent in glorious combat!"
          : outcome === "Defeat"
            ? "You have fallen. Grow stronger and try again."
            : "An even match. No winner this time."
      }}
    </p>

    <div class="flex justify-center">
      <app-regular-button (pressed)="closed.emit()"> Close </app-regular-button>
    </div>
  </div>
</div>
