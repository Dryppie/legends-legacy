<div
  *ngIf="tabs.length > 1"
  class="flex flex-wrap justify-around hover:cursor-pointer"
>
  <span
    *ngFor="let tab of tabs"
    class="border-b border-light_gray py-2 text-center font-semibold text-light_gray hover:border-primary focus:outline-none"
    [ngClass]="{
      'border-primary text-primary': activeTab === tab,
      'w-1/3': tabs.length >= 6,
      'flex-1': tabs.length < 6,
    }"
    (click)="setActiveTab(tab)"
  >
    {{ tab }}
  </span>
</div>
