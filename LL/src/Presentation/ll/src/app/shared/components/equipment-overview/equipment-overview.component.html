<div
  class="ll-card flex w-full max-w-96 flex-col items-center justify-between overflow-hidden"
>
  <div
    *ngFor="let slot of slots()"
    (click)="handleSlotClick(slot)"
    class="ll-item-row h-16 rounded-none border-x-0 border-t-0 px-4"
  >
    <div class="flex min-w-12 items-center gap-2">
      <img
        src="icons/equipment-slots/{{ slot.iconPath }}.svg"
        [alt]="slotGuidance[slot.equipmentSlotType].label + ' equipment slot'"
        class="center w-8 object-contain transition-[filter,opacity] duration-150"
        [ngClass]="slot.equipmentInstance ? '' : 'opacity-35 grayscale'"
      />
    </div>
    <app-item
      [ngClass]="
        isGhost(slot) ? 'pointer-events-none opacity-40 grayscale' : ''
      "
      *ngIf="slot.equipmentInstance"
      [item]="slot.equipmentInstance"
    ></app-item>
    <div
      *ngIf="!slot.equipmentInstance"
      class="flex min-w-0 flex-1 items-center justify-between gap-3"
    >
      <div class="min-w-0">
        <p class="truncate text-xs font-semibold text-primary">
          {{ slotGuidance[slot.equipmentSlotType].label }}
        </p>
        <p class="truncate text-[10px] text-zinc-400">
          {{ slotGuidance[slot.equipmentSlotType].accepts }}
        </p>
      </div>
      <span class="ll-item-chip shrink-0">Empty</span>
    </div>
  </div>
</div>
