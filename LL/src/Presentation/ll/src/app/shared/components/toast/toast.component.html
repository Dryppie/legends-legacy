<div
  *ngFor="let toast of toasts; trackBy: trackToast"
  [ngClass]="getPositionClass(toast.position)"
  [attr.role]="getLiveRole(toast.type)"
  [attr.aria-live]="toast.type === 'error' ? 'assertive' : 'polite'"
  aria-atomic="true"
  (mouseenter)="pauseToast(toast)"
  (mouseleave)="resumeToast(toast)"
  (focusin)="pauseToast(toast)"
  (focusout)="resumeToast(toast)"
  class="ll-toast z-50 flex min-h-20 w-96 max-w-[calc(100vw-2rem)] items-start gap-4 p-3 transition-all"
>
  <div class="flex-shrink-0">
    <img
      *ngIf="toast.type === 'error'"
      src="core/toast/error.svg"
      alt=""
      class="h-8 w-8"
    />
    <img
      *ngIf="toast.type === 'warning'"
      src="core/toast/warning.svg"
      alt=""
      class="h-8 w-8"
    />
    <img
      *ngIf="toast.type === 'success'"
      src="core/toast/success.svg"
      alt=""
      class="h-8 w-8"
    />
  </div>

  <div class="flex-1">
    <h4 class="ll-heading text-base">{{ toast.title }}</h4>
    <p class="ll-copy mt-1">{{ toast.message }}</p>

    <div class="ll-progress-track relative mt-2 h-1" aria-hidden="true">
      <div
        #progressBar
        class="absolute left-0 top-0 h-full rounded"
        [ngStyle]="{
          width: toast.progress + '%',
          backgroundColor: getProgressBarColor(toast.type),
        }"
      ></div>
    </div>
  </div>

  <button
    type="button"
    class="flex h-8 w-8 shrink-0 items-center justify-center rounded text-xl leading-none text-primary"
    [attr.aria-label]="'Dismiss ' + toast.title + ' notification'"
    (click)="removeToast(toast.id)"
  >
    &times;
  </button>
</div>
