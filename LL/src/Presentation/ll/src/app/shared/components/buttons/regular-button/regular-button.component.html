<button
  type="button"
  class="rounded-md border p-2 transition-colors duration-150 disabled:pointer-events-none"
  [ngClass]="buttonClasses"
  [disabled]="disabled"
  [attr.aria-disabled]="disabled"
  (click)="onClick($event)"
>
  <!-- Use provided text or fallback to projected content so consumers can slot icons etc. -->
  <div *ngIf="text; else projected">{{ text }}</div>
  <ng-template #projected>
    <ng-content></ng-content>
  </ng-template>
</button>
