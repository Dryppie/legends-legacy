<div
  *ngIf="tabs.length > 1"
  class="ll-segmented flex w-full flex-wrap"
  role="tablist"
>
  <button
    type="button"
    *ngFor="let tab of tabs"
    class="ll-segmented-button"
    [ngClass]="{
      'll-segmented-button-active': activeTab === tab,
      'w-1/3': tabs.length >= 6,
      'flex-1': tabs.length < 6,
    }"
    [attr.aria-selected]="activeTab === tab"
    role="tab"
    (click)="setActiveTab(tab)"
  >
    {{ tab }}
  </button>
</div>
