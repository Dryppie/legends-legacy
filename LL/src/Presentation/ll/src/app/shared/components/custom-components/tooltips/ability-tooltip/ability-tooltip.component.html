<div class="group pointer-events-none relative">
  <span
    class="absolute -bottom-1 left-20 h-3 w-3 rotate-45 rounded-sm border border-zinc-600 bg-zinc-800/80 backdrop-blur"
  ></span>

  <div
    role="tooltip"
    class="pointer-events-auto max-w-[20rem] rounded-lg border border-zinc-600 bg-texture p-3 text-xs text-zinc-200 shadow-lg backdrop-blur"
  >
    <div class="font-semibold text-primary">{{ data.title }}</div>

    <ng-container *ngIf="data.kind === 'keyword'">
      <p class="mt-1 leading-relaxed text-zinc-300">{{ data.description }}</p>
      <p *ngIf="data.detail" class="mt-2 font-medium text-indigo-300">
        {{ data.detail }}
      </p>
    </ng-container>

    <ng-container *ngIf="data.kind === 'magnitude'">
      <div class="mt-2 grid grid-cols-[auto_1fr] gap-x-4 gap-y-1">
        <span>Base:</span>
        <span class="text-zinc-100">{{ data.base }}</span>

        <ng-container *ngIf="data.attr">
          <span>Attribute:</span>
          <span>{{ data.attr }} ({{ data.attrValue }})</span>

          <span>Scaling:</span>
          <span class="text-emerald-400">{{ data.scaleDisplay }}</span>

          <span class="col-span-2 italic text-zinc-400">
            {{ data.base }} + ({{ data.attrValue }} × {{ data.scaleDisplay }})
          </span>
        </ng-container>

        <hr class="col-span-2 my-1 border-zinc-700" />

        <span class="col-span-2 font-medium text-amber-400">
          {{ data.total }} {{ data.unit }}
        </span>
      </div>
      <p *ngIf="data.note" class="mt-2 leading-relaxed text-zinc-400">
        {{ data.note }}
      </p>
    </ng-container>
  </div>
</div>
