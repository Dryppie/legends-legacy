<!-- Tooltip wrapper -->
<div class="group pointer-events-none relative">
  <!-- ▼ arrow -->
  <span
    class="absolute -bottom-1 left-20 h-3 w-3 rotate-45 rounded-sm border border-zinc-600 bg-zinc-800/80 backdrop-blur"
  ></span>

  <!-- Bubble -->
  <div
    class="pointer-events-auto grid max-w-[18rem] grid-cols-[auto_1fr] gap-x-4 gap-y-1 rounded-lg border border-zinc-600 bg-zinc-800/80 p-3 text-zinc-200 shadow-lg backdrop-blur"
  >
    <!-- Base -->
    <span>Base:</span>
    <span class="text-zinc-100">{{ data.base }}</span>

    <ng-container *ngIf="data.attr">
      <!-- Scaling -->
      <span>Attribute:</span>
      <span class="flex items-center gap-1">
        {{ data.attr }}
      </span>

      <span>Bonus:</span>
      <span class="text-emerald-400">+{{ data.bonus }}</span>
    </ng-container>

    <!-- Optional formula -->
    <span class="col-span-2 italic text-zinc-400" *ngIf="data.attr">
      {{ data.base }} + ({{ data.attrValue }} x {{ data.scale }})
    </span>

    <hr class="col-span-2 my-1 border-zinc-700" />

    <!-- Total -->
    <span class="col-span-2 font-medium text-amber-400">
      {{ data.total }} {{ data.unit }}&nbsp;
      <span *ngIf="data.hasRange" class="text-zinc-400">(±20%)</span>
    </span>
  </div>
</div>
