<div
  class="ll-panel flex h-full w-full flex-col overflow-hidden p-4 text-white"
>
  <!-- Nothing to show -->
  <ng-container *ngIf="data?.length; else noData">
    <!-- === Podium (top 3) ================================== -->
    <app-leaderboard-podium [entries]="podium" [columns]="columns">
    </app-leaderboard-podium>

    <!-- === Table header ==================================== -->
    <div
      class="ll-table-header mt-4 grid grid-flow-col gap-2"
      [ngClass]="'grid-cols-' + (columns.length + 1)"
    >
      <div>Rank</div>
      <ng-container *ngFor="let col of columns">
        <div [class.text-right]="col.alignRight" class="font-semibold">
          {{ col.header }}
        </div>
      </ng-container>
    </div>

    <!-- === Table body ====================================== -->
    <div class="overflow-y-auto">
      <div
        *ngFor="let row of rows; trackBy: trackByRank"
        class="ll-table-row grid grid-flow-col items-center gap-2"
        [ngClass]="[
          'grid-cols-' + (columns.length + 1),
          row.characterId === highlightId ? 'font-bold text-primary' : '',
        ]"
      >
        <!-- rank -->
        <div>{{ row.rank }}</div>

        <!-- data columns -->
        <ng-container *ngFor="let col of columns">
          <div
            [class.text-right]="col.alignRight"
            [ngClass]="col.cellClass ?? ''"
          >
            {{ col.value(row) }}
          </div>
        </ng-container>
      </div>
    </div>
  </ng-container>

  <ng-template #noData>
    <p class="ll-empty-state">No rankings available.</p>
  </ng-template>
</div>
