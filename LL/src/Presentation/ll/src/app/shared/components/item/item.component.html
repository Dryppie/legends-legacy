<app-popover
  [template]="hoverTpl"
  trigger="hover"
  [touchDisabled]="popoverTouchDisabled"
  [originFocusable]="popoverFocusable"
  originClass="relative inline-block max-w-full"
>
  <div class="flex min-w-0 flex-col">
    <div
      class="ll-item-name flex min-w-0 items-center gap-1"
      [ngClass]="rarityClasses"
    >
      <span class="min-w-0 truncate">{{ displayName }}</span>
      <span
        *ngIf="isFavorite"
        class="shrink-0 leading-none text-primary"
        aria-label="Favorite"
        title="Favorite"
        >★</span
      >
    </div>
    <span *ngIf="borrowedFromGuildName" class="text-xs text-amber-300">
      Borrowed from {{ borrowedFromGuildName }}
    </span>
  </div>
</app-popover>

<ng-template #hoverTpl>
  <app-essence-details
    *ngIf="isEssence"
    [essence]="itemAsEssence(item)"
  ></app-essence-details>
  <app-equipment-display
    *ngIf="isEquipment"
    [item]="itemAsEquipment(item)"
    [comparisonItems]="equippedComparisons"
    [equippedItems]="equippedItems"
  ></app-equipment-display>

  <div
    *ngIf="isEssence"
    class="mt-3 flex items-center justify-between gap-4 border-t border-primary/20 pt-2 text-sm"
  >
    <span class="text-secondary">Owned</span>
    <span class="font-medium tabular-nums text-primary">{{
      ownedQuantity
    }}</span>
  </div>

  <div *ngIf="isGenericItem" class="ll-item-detail">
    <div class="flex items-start justify-between gap-3">
      <h2 class="ll-item-detail-title" [ngClass]="rarityClasses">
        {{ displayName }}
      </h2>
      <span class="ll-item-chip ll-item-chip-accent">
        {{ item.itemBase.rarity }}
      </span>
    </div>

    <div class="ll-item-meta">
      {{ item.itemBase.itemType }}
    </div>

    <p *ngIf="description" class="ll-item-description">
      {{ description }}
    </p>

    <div class="ll-item-detail-section flex flex-wrap gap-2">
      <span *ngIf="item.itemBase.stackable" class="ll-item-chip">
        Stackable
      </span>
      <span *ngIf="item.isBound ?? item.itemBase.isBound" class="ll-item-chip">
        Bound
      </span>
      <span *ngIf="rewardCategory" class="ll-item-chip ll-item-chip-accent">
        {{ rewardCategory }}
      </span>
      <span *ngIf="rewardSource" class="ll-item-chip">
        {{ rewardSource }}
      </span>
    </div>

    <div class="ll-item-stat-row ll-item-detail-section">
      <span>Owned</span>
      <span class="font-medium tabular-nums text-primary">{{
        ownedQuantity
      }}</span>
    </div>
  </div>
</ng-template>
