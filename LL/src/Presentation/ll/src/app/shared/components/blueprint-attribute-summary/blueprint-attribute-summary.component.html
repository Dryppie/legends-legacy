<div *ngIf="contributedAttributes.length" class="mt-3">
  <div class="ll-item-meta">Contributes Attributes</div>

  <div class="mt-1 flex flex-wrap gap-1.5">
    <span
      *ngFor="let attributeType of contributedAttributes"
      class="rounded border border-sky-400/20 bg-sky-400/10 px-2 py-1 text-xs text-sky-200"
    >
      {{ attributeType | attributeTypeFormat }}
    </span>
  </div>
</div>
