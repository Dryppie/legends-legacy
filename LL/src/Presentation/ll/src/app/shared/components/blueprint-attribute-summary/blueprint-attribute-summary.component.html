<div
  *ngIf="blueprint.equipmentSet as equipmentSet"
  class="mt-3 rounded border border-primary/30 bg-primary/10 px-3 py-2"
>
  <div class="ll-item-meta text-primary">Equipment Set</div>
  <div class="mt-1 text-sm font-medium text-primary">
    {{ equipmentSet.name }}
  </div>
  <p *ngIf="equipmentSet.description" class="mt-1 text-xs text-secondary">
    {{ equipmentSet.description }}
  </p>
  <div *ngIf="equipmentSet.bonuses.length" class="mt-2 space-y-1">
    <div
      *ngFor="let bonus of equipmentSet.bonuses"
      class="text-xs text-secondary"
    >
      <span class="font-medium text-primary"
        >{{ bonus.requiredEquippedItems }} items:</span
      >
      {{ bonus.description }}
    </div>
  </div>
</div>

<div *ngIf="contributedAttributes.length" class="mt-3">
  <div class="ll-item-meta">Contributes Attributes</div>

  <div class="mt-1 flex flex-wrap gap-1.5">
    <span
      *ngFor="let attributeType of contributedAttributes"
      class="rounded border border-sky-400/20 bg-sky-400/10 px-2 py-1 text-xs text-sky-200"
    >
      {{ attributeType | attributeTypeFormat }}
    </span>
  </div>
</div>
