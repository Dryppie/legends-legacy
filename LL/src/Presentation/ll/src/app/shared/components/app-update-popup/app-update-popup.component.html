<div
  *ngIf="updateAvailable()"
  class="ll-panel-strong fixed inset-x-3 bottom-4 z-50 mx-auto max-w-sm p-4 sm:inset-x-auto sm:right-5 sm:mx-0"
>
  <div class="flex items-start gap-3">
    <div
      class="mt-1 h-3 w-3 shrink-0 rounded-full border border-primary bg-primary/30"
    ></div>
    <div class="min-w-0 flex-1">
      <h2 class="ll-heading">New Update Ready</h2>
      <p class="ll-copy mt-1">A new version of Legends Legacy is available.</p>
      <button
        type="button"
        class="ll-button mt-3 text-primary"
        (click)="refresh()"
      >
        Refresh
      </button>
    </div>
  </div>
</div>
