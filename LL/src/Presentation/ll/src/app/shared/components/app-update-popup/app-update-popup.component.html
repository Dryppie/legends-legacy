<div
  *ngIf="updateAvailable()"
  class="fixed inset-x-3 bottom-4 z-50 mx-auto max-w-sm rounded border border-primary/60 bg-texture p-4 text-white shadow-2xl sm:inset-x-auto sm:right-5 sm:mx-0"
>
  <div class="flex items-start gap-3">
    <div
      class="mt-1 h-3 w-3 shrink-0 rounded-full border border-primary bg-primary/30"
    ></div>
    <div class="min-w-0 flex-1">
      <h2 class="text-primary">New Update Ready</h2>
      <p class="mt-1 text-sm text-zinc-300">
        A new version of Legends Legacy is available.
      </p>
      <button
        type="button"
        class="mt-3 rounded border border-primary/50 bg-primary/10 px-3 py-2 text-sm font-semibold text-primary transition-colors hover:bg-primary/20"
        (click)="refresh()"
      >
        Refresh
      </button>
    </div>
  </div>
</div>
