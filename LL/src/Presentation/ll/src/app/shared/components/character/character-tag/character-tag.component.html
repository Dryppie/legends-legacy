<app-popover
  [template]="actionsTpl"
  trigger="click"
  originClass="relative inline-block"
>
  <span>{{ displayName }}</span>
</app-popover>

<ng-template #actionsTpl>
  <div class="flex flex-col gap-2 p-1">
    <button type="button" class="ll-button text-left" (click)="onViewProfile()">
      View Profile
    </button>
    <button type="button" class="ll-button text-left" (click)="onWhisper()">
      Whisper
    </button>
  </div>
</ng-template>
