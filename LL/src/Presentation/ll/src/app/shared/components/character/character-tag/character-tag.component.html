<app-click-popover [template]="actionsTpl">
  <span class="character-name">{{ name }}</span>
</app-click-popover>

<ng-template #actionsTpl>
  <div class="flex flex-col gap-2 p-1">
    <div class="hover:cursor-pointer" (click)="onViewProfile()">
      View Profile
    </div>
    <div class="hover:cursor-pointer" (click)="onWhisper()">Whisper</div>
  </div>
</ng-template>
