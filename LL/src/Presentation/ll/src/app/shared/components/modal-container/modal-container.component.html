<div
  class="ll-modal-backdrop overflow-hidden"
  *ngIf="isModalOpen"
  (click)="onOverlayClick($event)"
>
  <div
    class="max-h-full w-full overflow-hidden"
    [ngClass]="
      inventoryEquipment
        ? 'sm:w-[min(52rem,calc(100vw-2rem))]'
        : 'sm:w-2/3 lg:w-2/5'
    "
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="modalLabel"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    (click)="$event.stopPropagation()"
  >
    <app-essence-modal
      *ngIf="essence"
      [essence]="essence"
      (close)="onEssenceModalClose()"
    ></app-essence-modal>

    <app-combat-filters-modal
      *ngIf="filterCombat"
      (close)="onEditCombatFiltersModalClose()"
    ></app-combat-filters-modal>
    <app-inventory-item-modal
      *ngIf="inventoryItem"
      [inventoryItem]="inventoryItem"
      (close)="onInventoryItemModalClose()"
    ></app-inventory-item-modal>
    <app-inventory-equipment-modal
      *ngIf="inventoryEquipment"
      [equipmentInstance]="inventoryEquipment"
      (close)="onInventoryEquipmentModalClose()"
    >
    </app-inventory-equipment-modal>
    <app-overview-equipment-modal
      *ngIf="overviewEquipment"
      [equipmentSlotType]="overviewEquipment"
      (close)="onOverviewEquipmentModalClose()"
    >
    </app-overview-equipment-modal>
  </div>
</div>
