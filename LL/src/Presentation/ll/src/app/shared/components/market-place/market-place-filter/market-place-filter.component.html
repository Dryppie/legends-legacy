<nav
  class="flex flex-wrap items-center gap-1 overflow-visible"
  aria-label="Marketplace categories"
>
  <app-dropdown
    *ngFor="let tab of tabs"
    [value]="tab.itemType"
    [label]="tab.label"
    [subOptions]="tab.subOptions"
    [selected]="selectedTabId() === tab.id"
    (selection)="onSelection(tab, $event)"
  />
</nav>
