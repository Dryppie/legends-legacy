<div
  class="flex flex-wrap items-center gap-2 overflow-visible rounded-md border border-light_gray bg-black/20 p-1"
>
  <app-dropdown
    *ngFor="let type of itemTypes"
    [value]="type"
    [label]="type"
    [subOptions]="itemTypeSubcategories[type]"
    [selected]="selectedItemType() === type"
    (selection)="onSelection($event)"
  />
</div>
