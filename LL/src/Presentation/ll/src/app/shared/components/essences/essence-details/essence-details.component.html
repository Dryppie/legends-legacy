<div class="flex w-full min-w-72 flex-col gap-3">
  <div class="flex items-start justify-between gap-3">
    <h2 class="font-serif text-lg leading-tight text-primary">
      {{ essence.name }}
    </h2>
    <span
      class="rounded border border-primary/40 px-2 py-0.5 text-[11px] text-primary"
    >
      Essence
    </span>
  </div>

  <div class="border-t border-primary/20 pt-2">
    <div class="mb-1 flex items-center justify-between gap-3">
      <div class="font-serif text-base text-primary">
        {{ essence.active.name }}
      </div>
      <span
        class="rounded border border-primary/40 px-2 py-0.5 text-[11px] text-primary"
      >
        Active
      </span>
    </div>
    <app-essence-description
      class="w-full"
      [description]="essence.active.description"
      [effects]="essence.active.effects"
    ></app-essence-description>
    <p class="mt-1 text-xs text-zinc-400">
      Cooldown:
      {{ essence.active.cooldown | ticksToSeconds }} seconds
    </p>
    <div class="mt-2 flex flex-wrap gap-1 text-[11px] text-zinc-300">
      <span
        *ngFor="let tag of essence.active.attackTypes"
        class="rounded border border-white/10 px-2 py-0.5"
      >
        {{ tag }}
      </span>
      <span
        *ngFor="let tag of essence.active.damageTypes"
        class="rounded border border-white/10 px-2 py-0.5"
      >
        {{ tag }}
      </span>
      <span
        *ngFor="let tag of essence.active.effectTags"
        class="rounded border border-white/10 px-2 py-0.5"
      >
        {{ tag }}
      </span>
    </div>
  </div>

  <div class="border-t border-primary/20 pt-2">
    <div class="mb-1 flex items-center justify-between gap-3">
      <div class="font-serif text-base text-primary">
        {{ essence.passive.name }}
      </div>
      <span
        class="rounded border border-white/20 px-2 py-0.5 text-[11px] text-zinc-300"
      >
        Passive
      </span>
    </div>
    <app-essence-description
      [description]="essence.passive.description"
      [effects]="essence.passive.effects"
    ></app-essence-description>
    <div class="mt-2 flex flex-wrap gap-1 text-[11px] text-zinc-300">
      <span
        *ngFor="let tag of essence.passive.attackTypes"
        class="rounded border border-white/10 px-2 py-0.5"
      >
        {{ tag }}
      </span>
      <span
        *ngFor="let tag of essence.passive.damageTypes"
        class="rounded border border-white/10 px-2 py-0.5"
      >
        {{ tag }}
      </span>
      <span
        *ngFor="let tag of essence.passive.effectTags"
        class="rounded border border-white/10 px-2 py-0.5"
      >
        {{ tag }}
      </span>
    </div>
  </div>
</div>
