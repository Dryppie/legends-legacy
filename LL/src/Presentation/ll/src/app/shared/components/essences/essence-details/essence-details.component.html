<div class="flex w-full min-w-72 flex-col gap-3">
  <div class="flex items-start justify-between gap-3">
    <h2 class="font-serif text-lg leading-tight text-primary">
      {{ essence.name }}
    </h2>
    <span
      class="rounded border border-primary/40 px-2 py-0.5 text-[var(--ll-text-xs)] text-primary"
    >
      Essence
    </span>
  </div>

  <div class="border-t border-primary/20 pt-2">
    <div class="mb-1 flex items-center justify-between gap-3">
      <div class="font-serif text-base text-primary">
        {{ essence.active.name }}
      </div>
      <span
        class="rounded border border-primary/40 px-2 py-0.5 text-[var(--ll-text-xs)] text-primary"
      >
        Active
      </span>
    </div>
    <app-essence-description
      class="w-full"
      [abilityName]="essence.active.name"
      [description]="essence.active.description"
      [effects]="essence.active.effects"
      kind="Active"
      [cooldownSeconds]="essence.active.cooldown / 10"
      [threatValue]="essence.active.threatValue"
      [threatMultiplier]="essence.active.threatMultiplier"
      [estimatedThreatPerSecond]="essence.active.estimatedThreatPerSecond ?? 0"
      [hasMaintainedThreat]="essence.active.hasMaintainedThreat ?? false"
    ></app-essence-description>
    <app-ability-tags
      [targets]="essence.active.targets"
      [tags]="essence.active.tags"
    ></app-ability-tags>
  </div>

  <div class="border-t border-primary/20 pt-2">
    <div class="mb-1 flex items-center justify-between gap-3">
      <div class="font-serif text-base text-primary">
        {{ essence.passive.name }}
      </div>
      <span
        class="rounded border border-white/20 px-2 py-0.5 text-[var(--ll-text-xs)] text-zinc-300"
      >
        Passive
      </span>
    </div>
    <app-essence-description
      [abilityName]="essence.passive.name"
      [description]="essence.passive.description"
      [effects]="essence.passive.effects"
      kind="Passive"
      [threatValue]="essence.passive.threatValue"
      [threatMultiplier]="essence.passive.threatMultiplier"
      [estimatedThreatPerSecond]="essence.passive.estimatedThreatPerSecond ?? 0"
      [hasMaintainedThreat]="essence.passive.hasMaintainedThreat ?? false"
    ></app-essence-description>
    <app-ability-tags
      [targets]="essence.passive.targets"
      [tags]="essence.passive.tags"
    ></app-ability-tags>
  </div>
</div>
