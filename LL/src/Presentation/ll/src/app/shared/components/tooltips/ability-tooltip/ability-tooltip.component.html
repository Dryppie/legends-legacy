<!-- Tooltip wrapper -->
<div class="group pointer-events-none relative">
  <!-- ▼ arrow -->
  <span
    class="absolute -bottom-1 left-20 h-3 w-3 rotate-45 rounded-sm border border-zinc-600 bg-zinc-800/80 backdrop-blur"
  ></span>

  <!-- Bubble -->
  <div
    class="pointer-events-auto grid max-w-[18rem] grid-cols-[auto_1fr] gap-x-4 gap-y-1 rounded-lg border border-zinc-600 bg-zinc-800/80 p-3 font-sans text-sm text-zinc-200 shadow-lg backdrop-blur"
  >
    <!-- Base -->
    <div>Base:</div>
    <div class="text-zinc-100">{{ data.base }}</div>

    <!-- Scaling -->
    <div>Attribute:</div>
    <div class="flex items-center gap-1">
      {{ data.attr }}
    </div>

    <div>Bonus:</div>
    <div class="text-emerald-400">+{{ data.bonus }}</div>

    <!-- Optional formula -->
    <div class="col-span-2 text-xs italic text-zinc-400">
      {{ data.base }} + ({{ data.attrValue }} x {{ data.scale }})
    </div>

    <hr class="col-span-2 my-1 border-zinc-700" />

    <!-- Total -->
    <div class="col-span-2 font-medium text-amber-400">
      {{ data.total }} damage&nbsp;
      <span class="text-xs text-zinc-400">(±20%)</span>
    </div>
  </div>
</div>
