<div class="max-w-xl rounded-lg border-primary bg-texture p-6 text-white">
  <!-- Modal Header -->
  <div class="flex w-full items-center justify-center pb-2">
    <h2 class="text-primary">{{ essence.name }}</h2>
  </div>
  <div class="border-t border-light_gray pb-3"></div>

  <div class="flex flex-row justify-between gap-2">
    <!-- Modal Body -->
    <div class="space-y-4">
      <div class="flex flex-col gap-1">
        <h3 class="font-semibold text-primary">Active Ability</h3>
        <div class="flex gap-1">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-primary"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <circle cx="12" cy="12" r="6" />
          </svg>
          <div class="flex flex-col gap-1">
            <p>
              {{ essence.active.description }}
            </p>
            <p>
              Cost: {{ essence.active.cost }}
              {{ essence.active.costType }}
            </p>
            <p>
              Cooldown: {{ essence.active.cooldown | ticksToSeconds }} seconds
            </p>
          </div>
        </div>
        <div></div>
      </div>

      <div class="flex flex-col gap-1">
        <h3 class="font-semibold text-primary">Active Ability</h3>
        <div class="flex gap-1">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-primary"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <circle cx="12" cy="12" r="6" />
          </svg>
          <p>
            {{ essence.passive.description }}
          </p>
        </div>
      </div>
      <!-- <div>
        <h3 class="pb-1 font-semibold text-primary">Stats</h3>
        <ul class="ml-4 list-inside list-disc"> -->
      <!-- <li *ngFor="let stat of essence.stats">
          {{ stat.key }}: {{ stat.value }}
        </li> -->
      <!-- <li>Health: +50</li> -->
      <!-- <li>Dexterity: +3</li>
        </ul>
      </div> -->
    </div>

    <!-- Modal Footer -->
    <div class="flex place-items-end">
      <button (click)="onClose()" class="rounded bg-light px-4 py-2 text-white">
        Close
      </button>
    </div>
  </div>
</div>
