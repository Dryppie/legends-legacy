<div
  role="progressbar"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-valuenow]="progress"
  [attr.aria-label]="accessibleLabel"
  [class]="
    vertical
      ? 'relative h-full w-full overflow-hidden'
      : 'relative mx-auto h-2 overflow-hidden rounded-full bg-black'
  "
>
  <div
    #progressBar
    [class]="
      vertical
        ? 'absolute inset-0 h-full w-full origin-bottom scale-y-0 bg-gradient-to-t from-primary/60 to-primary/25 will-change-transform'
        : 'h-full bg-primary'
    "
  ></div>
</div>
