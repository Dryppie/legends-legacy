<div
  *ngIf="!displayCombat"
  class="relative flex h-full w-full flex-col items-center justify-center bg-black text-center text-primary overflow-hidden"
>
  <!-- Aura background here -->
  <div class="absolute inset-0 z-0 bg-texture pointer-events-none"></div>

  <!-- Content -->
  <div class="relative z-10 flex items-center justify-center mb-4">
    <div class="text-lg font-bold">
      You are already in combat. Next fight in:
      <app-countdown [targetDate]="nextCombatIn!"></app-countdown>
    </div>
  </div>

  <p class="mt-2 italic text-secondary animate-fade-in z-10">{{ flavorText }}</p>

  <app-mini-button
  [text]="stopCombatButtonText"
  [disabled]="false"
  [width]="'128px'"
  (click)="initiateStoppingCombat()"
  class="mt-6 w-64 z-10"
></app-mini-button>
</div>

<div class="flex h-full flex-col gap-4 pr-4 sm:pr-6">
  <div
    class="flex h-16 w-full flex-col items-center justify-between gap-4 sm:flex-row"
  >
    <div class="flex w-full items-center justify-center gap-6 text-white">
      <div class="flex flex-col items-center gap-1">
        <span>Battle</span>
        <ng-container *ngIf="isLoading; else areaDisplay">
          <h2 class="text-primary">Loading area details...</h2>
        </ng-container>
        <!-- Display area details once loading is complete -->
        <ng-template #areaDisplay>
          <h2
            *ngIf="currentAction$ | async as currentAction"
            class="text-primary"
          >
            Shenic - {{ currentAction.combatActionDetails?.area?.name }}
          </h2>
        </ng-template>
      </div>
    </div>
  </div>
  <div class="flex w-full flex-col justify-around gap-4 sm:flex-row sm:gap-0">
    <div class="flex items-center sm:flex-col">
      <div class="mb-4 flex flex-col gap-2 sm:flex-row">
        <ng-container *ngFor="let character of playerCharacters; let i = index">
          <div
            (click)="focusCharacter('player', i)"
            class="h-8 w-8 cursor-pointer rounded bg-cover"
            [ngStyle]="{
              'background-image': 'url(\'assets/combat/thumbnail-\')',
              border:
                selectedPlayerCharacterIndex === i
                  ? '2px solid gold'
                  : '1px solid gray',
            }"
          ></div>
        </ng-container>
      </div>
      <app-combat-avatar
        class="w-full"
        [imagePath]="selectedPlayerCharacter.imagePath"
        *ngIf="selectedPlayerCharacter"
        [name]="selectedPlayerCharacter.name"
        [hp]="selectedPlayerCharacter.health"
        [maxHp]="selectedPlayerCharacter.maxHealth"
        [mp]="selectedPlayerCharacter.mana"
        [maxMp]="selectedPlayerCharacter.maxMana"
        [barrier]="selectedPlayerCharacter.barrier"
        [isLoading]="isLoading"
      ></app-combat-avatar>
    </div>
    <div class="flex flex-col items-center justify-center">
      <img
        src="combat/CombatVS.svg"
        alt="Logo"
        class="center -my-24 min-h-12 w-44 object-contain sm:-my-0"
      />
    </div>
    <div class="flex items-center sm:flex-col">
      <div class="mb-4 flex flex-col gap-2 sm:flex-row">
        <ng-container *ngFor="let character of enemyCharacters; let i = index">
          <div
            (click)="focusCharacter('enemy', i)"
            class="h-8 w-8 cursor-pointer rounded bg-cover"
            [ngStyle]="{
              'background-image': 'url(\'assets/combat/thumbnail-\')',
              border:
                selectedEnemyCharacterIndex === i
                  ? '2px solid red'
                  : '1px solid gray',
            }"
          ></div>
        </ng-container>
      </div>
      <app-combat-avatar
        class="w-full"
        [imagePath]="selectedEnemyCharacter.imagePath"
        *ngIf="selectedEnemyCharacter"
        [name]="selectedEnemyCharacter.name"
        [hp]="selectedEnemyCharacter.health"
        [maxHp]="selectedEnemyCharacter.maxHealth"
        [mp]="selectedEnemyCharacter.mana"
        [maxMp]="selectedEnemyCharacter.maxMana"
        [barrier]="selectedEnemyCharacter.barrier"
        [isLoading]="isLoading"
      ></app-combat-avatar>
    </div>
  </div>
  <div class="flex h-full w-full overflow-hidden">
    <app-combat-overview
      *ngIf="combatStateService.combatEvents$ | async as combatEvents"
      [combatEvents]="combatEvents"
      [isLoading]="isLoading"
      class="h-full w-full"
    ></app-combat-overview>
    <button (click)="initiateStoppingCombat()" class="text-primary">
      {{ stopCombatButtonText }}
    </button>
  </div>
</div>
