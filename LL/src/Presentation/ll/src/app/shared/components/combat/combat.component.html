<div class="flex h-full w-full flex-col overflow-hidden">
  <div
    *ngIf="!displayCombat && battleType === 'IdleCombat'"
    class="flex h-full w-full items-center justify-center px-4 text-center"
  >
    <div class="ll-panel w-full max-w-xl p-6">
      <p class="ll-eyebrow">
        {{ isLoading ? 'Offline Progress' : 'Combat Queued' }}
      </p>
      <h2 class="ll-heading mt-2 text-2xl">
        {{ isLoading ? 'Resolving Combat' : 'Next Fight Begins Soon' }}
      </h2>
      <p *ngIf="isLoading" class="ll-copy mt-3">
        Resolving stored combat and rewards.
      </p>
      <div *ngIf="!isLoading" class="mt-4 text-lg font-bold text-white">
        <app-countdown [targetDate]="nextCombatIn!"></app-countdown>
      </div>

      <p
        *ngIf="flavorTextVisible"
        class="ll-copy mt-4 animate-fade-in-up italic"
      >
        {{ flavorText }}
      </p>

      <app-mini-button
        [text]="stopCombatButtonText"
        [disabled]="isStoppingCombat"
        [width]="'128px'"
        (click)="initiateStoppingCombat()"
        class="mt-6 block"
      ></app-mini-button>
    </div>
  </div>

  <div
    *ngIf="displayCombat"
    class="flex h-full w-full flex-col overflow-y-auto overscroll-contain pb-24 pr-2 sm:pr-6 lg:overflow-hidden lg:pb-0"
  >
    <section
      class="ll-panel ll-panel-strong flex min-h-full w-full flex-col overflow-hidden px-4 py-4 sm:px-6 lg:h-full lg:min-h-0"
    >
      <header
        class="flex shrink-0 flex-col gap-4 border-b border-primary/40 pb-3 sm:flex-row sm:items-center sm:justify-between"
      >
        <div class="flex min-w-0 flex-wrap items-baseline gap-x-4 gap-y-1">
          <h2 class="ll-heading truncate text-2xl uppercase tracking-tight">
            {{ battleTitle() }}
          </h2>
          <app-combat-log
            *ngIf="battleType === 'IdleCombat'"
            class="max-w-full"
          ></app-combat-log>
          <span
            *ngIf="outcome && battleType !== 'IdleCombat'"
            class="ll-badge"
            [ngClass]="outcomeBadgeClass()"
          >
            {{ outcome }}
          </span>
        </div>

        <app-mini-button
          class="block shrink-0 self-start sm:self-auto"
          [text]="combatActionButtonText()"
          [disabled]="isStoppingCombat"
          [width]="battleType === 'IdleCombat' ? '72px' : '132px'"
          (click)="onStopOrSkip()"
        ></app-mini-button>
      </header>

      <app-combat-entity-stats
        class="flex min-h-0 w-full flex-1"
        [playerTeam]="playerCharacters"
        [enemyTeam]="enemyCharacters"
        [entityStats]="entityStats"
      ></app-combat-entity-stats>
    </section>
  </div>
</div>
