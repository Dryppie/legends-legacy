<div class="flex h-full w-full flex-col overflow-hidden">
  <div
    *ngIf="!displayCombat && battleType === 'IdleCombat'"
    class="flex h-full w-full flex-col items-center justify-center text-center text-primary"
  >
    <div class="mb-4 flex items-center justify-center">
      <div class="text-lg font-bold">
        You are already in combat. Next fight in:
        <app-countdown [targetDate]="nextCombatIn!"></app-countdown>
      </div>
    </div>

    <p
      *ngIf="flavorTextVisible"
      class="mt-2 animate-fade-in-up italic text-secondary"
    >
      {{ flavorText }}
    </p>

    <app-mini-button
      [text]="stopCombatButtonText"
      [disabled]="isStoppingCombat"
      [width]="'128px'"
      (click)="initiateStoppingCombat()"
      class="mt-6 w-64"
    ></app-mini-button>
  </div>

  <div
    *ngIf="displayCombat"
    class="flex h-full w-full flex-col gap-4 overflow-hidden pr-4 lg:pr-6"
  >
    <div
      class="flex h-16 w-full flex-col items-center justify-between gap-4 lg:flex-row"
    >
      <div
        *ngIf="battleType === 'IdleCombat'"
        class="flex w-full flex-col items-center justify-center gap-1 text-white"
      >
        <span>Battle</span>
        <ng-container *ngIf="isLoading; else areaDisplay">
          <h2 class="text-primary">Loading area details...</h2>
        </ng-container>
        <!-- Display area details once loading is complete -->
        <ng-template #areaDisplay>
          <h2 *ngIf="currentAction() as currentAction" class="text-primary">
            Shenic - {{ currentAction.combatActionDetails?.area?.name }}
          </h2>
        </ng-template>
      </div>
    </div>
    <div
      class="flex w-full flex-col justify-around gap-4 overflow-y-auto lg:flex-row lg:gap-0 lg:overflow-visible"
    >
      <div class="flex items-center lg:flex-col">
        <div class="mb-4 flex flex-col gap-2 lg:flex-row">
          <ng-container
            *ngFor="let character of playerCharacters; let i = index"
          >
            <div
              (click)="focusCharacter('player', i)"
              class="h-8 w-8 cursor-pointer rounded bg-cover"
              [ngStyle]="{
                'background-image': 'url(\'assets/combat/thumbnail-\')',
                border:
                  selectedPlayerCharacterIndex === i
                    ? '2px solid gold'
                    : '1px solid gray',
              }"
            ></div>
          </ng-container>
        </div>
        <app-combat-avatar
          class="w-full"
          [imagePath]="selectedPlayerCharacter.imagePath"
          *ngIf="selectedPlayerCharacter"
          [name]="selectedPlayerCharacter.name"
          [hp]="selectedPlayerCharacter.health"
          [maxHp]="selectedPlayerCharacter.maxHealth"
          [mp]="selectedPlayerCharacter.mana"
          [maxMp]="selectedPlayerCharacter.maxMana"
          [barrier]="selectedPlayerCharacter.barrier"
          [isLoading]="isLoading"
        ></app-combat-avatar>
      </div>
      <div class="flex h-full flex-col items-center justify-between">
        <div class="relative flex flex-col items-center justify-center">
          <!-- Default VS image -->
          <img
            *ngIf="!outcome"
            src="combat/CombatVS.svg"
            alt="Logo"
            class="-my-24 flex min-h-12 w-44 object-contain lg:-my-0"
          />

          <!-- Outcome image with label -->
          <ng-container *ngIf="outcome">
            <img
              *ngIf="outcome"
              src="combat/{{ outcome }}.svg"
              alt="Logo"
              class="w-22 -my-24 flex min-h-12 object-contain px-16 py-20 lg:-my-0"
            />
            <div class="-mb-4 pt-4 text-primary lg:absolute lg:bottom-4">
              {{ outcome }}
            </div>
          </ng-container>
        </div>

        <!-- Combat log for idle battles -->
        <div
          *ngIf="battleType === 'IdleCombat'"
          class="mt-4 flex w-full justify-center"
        >
          <app-combat-log></app-combat-log>
        </div>
      </div>

      <div class="flex items-center lg:flex-col">
        <div class="mb-4 flex flex-col gap-2 lg:flex-row">
          <ng-container
            *ngFor="let character of enemyCharacters; let i = index"
          >
            <div
              (click)="focusCharacter('enemy', i)"
              class="h-8 w-8 cursor-pointer rounded bg-cover"
              [ngStyle]="{
                'background-image': 'url(\'assets/combat/thumbnail-\')',
                border:
                  selectedEnemyCharacterIndex === i
                    ? '2px solid red'
                    : '1px solid gray',
              }"
            ></div>
          </ng-container>
        </div>
        <app-combat-avatar
          class="w-full"
          [imagePath]="selectedEnemyCharacter.imagePath"
          *ngIf="selectedEnemyCharacter"
          [name]="selectedEnemyCharacter.name"
          [hp]="selectedEnemyCharacter.health"
          [maxHp]="selectedEnemyCharacter.maxHealth"
          [mp]="selectedEnemyCharacter.mana"
          [maxMp]="selectedEnemyCharacter.maxMana"
          [barrier]="selectedEnemyCharacter.barrier"
          [isLoading]="isLoading"
        ></app-combat-avatar>
      </div>
    </div>
    <div class="flex h-full w-full overflow-hidden">
      <app-combat-overview
        *ngIf="combatStateService.getCombatEvents(battleType)() as combatEvents"
        [combatEvents]="combatEvents"
        [isLoading]="isLoading"
        [isStoppingCombat]="isStoppingCombat"
        (stopCombatEvent)="onStopOrSkip()"
        [battleType]="battleType"
        class="h-full w-full"
      ></app-combat-overview>
    </div>
  </div>
</div>
