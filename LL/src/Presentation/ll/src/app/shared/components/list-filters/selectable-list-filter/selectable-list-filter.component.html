<!-- Buttons -->
<div class="ll-toolbar mb-4">
  <button
    type="button"
    *ngFor="let opt of filterOptions()"
    (click)="setActive(opt)"
    [ngClass]="{
      'll-card-accent text-primary': active() === opt,
    }"
    class="ll-button flex items-center gap-1 px-2 py-1"
  >
    {{ opt.label }}
  </button>
</div>

<section *ngIf="filtered().length; else none">
  <!-- List -->
  <div
    *ngFor="let item of filtered()"
    (click)="onPick(item)"
    class="ll-card my-2 cursor-pointer p-3 transition-colors hover:border-primary"
    [ngClass]="{
      'll-card-accent': selected === item,
    }"
    [attr.data-tour]="tourItemId"
  >
    <!-- Projection slot; see usage example -->
    <ng-container
      *ngTemplateOutlet="itemTpl; context: { $implicit: item }"
    ></ng-container>
  </div>
</section>

<ng-template #none>
  <p class="ll-empty-state mt-4">No items match this filter.</p>
</ng-template>
