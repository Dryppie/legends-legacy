<section *ngIf="filtered().length; else none">
  <!-- Buttons -->
  <div class="mb-4 flex flex-wrap items-center gap-2">
    <button
      *ngFor="let opt of filterOptions()"
      (click)="setActive(opt)"
      [ngClass]="{
        'bg-primary/30 hover:bg-primary/40': active() === opt,
      }"
      class="flex items-center gap-1 rounded border border-zinc-300/30 px-2 py-1 text-sm text-neutral-300 hover:bg-zinc-300/30"
    >
      {{ opt.label }}
    </button>
  </div>

  <!-- List -->
  <div
    *ngFor="let item of filtered()"
    (click)="onPick(item)"
    class="my-2 cursor-pointer rounded-lg border p-3 hover:border-primary/60 hover:bg-zinc-300/30"
    [class.border-primary]="selected === item"
    [ngClass]="{
      'bg-primary/10': selected === item,
      'border-primary/20': selected !== item,
    }"
  >
    <!-- Projection slot; see usage example -->
    <ng-container
      *ngTemplateOutlet="itemTpl; context: { $implicit: item }"
    ></ng-container>
  </div>
</section>

<ng-template #none>
  <p class="mt-4 text-center italic text-neutral-400">
    No items match this filter.
  </p>
</ng-template>
