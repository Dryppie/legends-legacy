<app-info-box
  title="{{ name }}"
  description="{{ description }}"
  imageUrl="{{ icon }}"
>
  <div class="ll-card p-3 transition-colors hover:border-primary">
    <div class="flex flex-col items-center justify-center gap-2">
      <img [src]="'assets/' + icon" [alt]="name" class="mb-2 h-10 w-10" />
      <span class="ll-item-chip ll-item-chip-accent">{{ name }}</span>
    </div>
  </div>
</app-info-box>
