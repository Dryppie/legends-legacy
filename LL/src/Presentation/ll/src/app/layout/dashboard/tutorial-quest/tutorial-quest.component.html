<section
  *ngIf="visible() && state() as tutorial"
  data-tour="tutorial-quest"
  class="ll-panel mb-2 flex shrink-0 flex-col gap-3 px-4 py-3 pr-4 sm:mr-4 md:flex-row md:items-center md:justify-between"
>
  <div class="min-w-0">
    <div class="ll-eyebrow">Tutorial</div>
    <div class="mt-1 flex min-w-0 flex-wrap items-baseline gap-x-3 gap-y-1">
      <h2 class="ll-heading text-lg">{{ tutorial.title }}</h2>
      <span class="ll-copy text-xs">
        {{ tutorial.currentAmount }}/{{ tutorial.requiredAmount }}
      </span>
    </div>
    <p class="ll-copy mt-1 text-sm">{{ tutorial.objective }}</p>
  </div>

  <div class="flex shrink-0 items-center gap-2">
    <button
      type="button"
      class="ll-button-primary px-4 py-2 text-xs"
      data-tour="tutorial-quest-action"
      (click)="go()"
    >
      {{ tutorial.actionLabel }}
    </button>
  </div>
</section>
