<div
  class="flex h-full max-h-52 flex-col overflow-hidden bg-texture text-white"
>
  <div class="flex items-center justify-between gap-2 p-2">
    <button
      type="button"
      class="min-h-8 min-w-0 flex-1 rounded px-1 text-left transition-colors hover:bg-[var(--ll-color-surface-hover)]"
      [attr.aria-expanded]="expanded()"
      aria-controls="loot-history-entries"
      (click)="toggle()"
    >
      Loot History
      <span aria-hidden="true">{{ expanded() ? "▼" : "▲" }}</span>
    </button>
    <button
      *ngIf="expanded()"
      type="button"
      class="ll-button ll-text-danger border-danger/50 px-2 py-1 text-xs hover:bg-danger/10"
      [disabled]="clearing() || entries.length === 0"
      (click)="clearHistory($event)"
    >
      {{ clearing() ? "Clearing…" : "Clear history" }}
    </button>
  </div>

  <div
    *ngIf="expanded()"
    id="loot-history-entries"
    class="overflow-y-auto border-t border-primary px-2 pt-2"
  >
    <ng-container *ngIf="entries.length > 0; else emptyState">
      <div
        *ngFor="let entry of entries; trackBy: trackEntry"
        class="border-b border-white/10 py-1.5 last:border-b-0"
      >
        <div class="flex items-start justify-between gap-2">
          <div class="flex min-w-0 gap-1">
            <div>{{ entry.item.quantity }}</div>
            <app-item [item]="entry.item.itemInstance"></app-item>
          </div>
          <time
            class="shrink-0 text-xs text-zinc-400"
            [attr.datetime]="entry.receivedAt"
          >
            {{ entry.receivedAt | localDate: "short" }}
          </time>
        </div>
        <div class="mt-0.5 truncate text-xs text-zinc-400">
          {{ locationLabel(entry) }}
        </div>
      </div>
    </ng-container>
    <ng-template #emptyState>
      <div class="text-center italic text-zinc-300">No loot received yet.</div>
    </ng-template>
  </div>
</div>
