<div
  class="flex h-full justify-center bg-cover bg-center"
  style="
    background-image: url(&quot;backgrounds/optimized/background.webp&quot;);
  "
>
  <div class="flex h-full w-full flex-auto flex-col">
    <div
      class="flex h-full flex-col overflow-hidden sm:order-2 sm:flex-row sm:gap-4"
    >
      <nav class="w-full sm:w-auto">
        <app-sidebar
          (itemTapped)="toggleNav()"
          class="flex sm:h-full"
        ></app-sidebar>
      </nav>
      <div class="h-full w-full flex-col space-y-4 overflow-hidden sm:flex">
        <div class="relative h-full w-full flex-auto overflow-hidden sm:pr-4">
          <div
            class="border-gradient absolute inset-0 flex w-full items-center rounded-b-none sm:rounded-t-md sm:pr-4 sm:pt-[1px] sm:opacity-95 xl:pr-0"
          >
            <div class="h-full w-full bg-texture sm:rounded-t-md"></div>
          </div>
          <main
            class="relative flex h-full w-full flex-auto flex-col gap-2 overflow-hidden pt-4 sm:rounded-md sm:pt-6 2xl:rounded-b-none"
          >
            <div class="h-full w-full overflow-hidden pl-4 sm:pb-6 sm:pl-6">
              <ng-container *ngIf="combatVisible$ | async; else mainView">
                <app-combat></app-combat>
              </ng-container>
              <ng-template #mainView>
                <router-outlet></router-outlet>
              </ng-template>
            </div>
          </main>
        </div>
      </div>
      <div
        *ngIf="isChatOpenDesktop && isScreenLarge"
        class="hidden h-full flex-col xl:flex"
      >
        <app-chat class="h-full"></app-chat>
        <app-loot-tracker></app-loot-tracker>
      </div>
    </div>
    <app-navbar
      (itemTapped)="openSidebar()"
      [isScreenSmall]="isScreenSmall"
      class="sm:order-1 sm:p-4"
    ></app-navbar>
  </div>
</div>

<div
  class="fixed bottom-16 right-6 z-40 flex h-14 w-14 items-center justify-center rounded-full bg-zinc-300/30 sm:bottom-4 xl:hidden"
>
  <div
    (click)="toggleChat()"
    class="border-gradient relative flex h-full cursor-pointer items-center rounded-md p-[1px]"
  >
    <div
      class="flex h-full w-28 items-center justify-between rounded-tl-md bg-texture px-4"
    >
      <div class="text-primary">CHAT</div>
      <img src="icons/ActivePlus.svg" />
    </div>
  </div>
  <div
    *ngIf="isFloatingChatOpen && !isScreenLarge"
    class="fixed inset-0 z-50 flex justify-end xl:hidden"
  >
    <div class="absolute inset-0 bg-black/60" (click)="toggleChat()"></div>

    <div class="animate-slide-in relative h-full max-w-full">
      <app-chat (close)="toggleChat()"></app-chat>
    </div>
  </div>
</div>
