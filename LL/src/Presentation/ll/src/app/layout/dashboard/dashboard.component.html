<div class="ll-app-frame">
  <div class="flex h-full min-h-0 w-full flex-auto flex-col">
    <app-game-header
      *ngIf="isScreenSmall"
      class="block shrink-0"
      (menuTapped)="toggleNav()"
    ></app-game-header>

    <div class="flex min-h-0 flex-1 overflow-hidden sm:gap-2">
      <nav
        class="relative z-30 h-full shrink-0 overflow-hidden transition-[width] duration-200 sm:w-auto"
        [ngClass]="
          isScreenSmall ? (isSidebarOpen ? 'w-[64vw]' : 'w-0') : 'w-auto'
        "
        [attr.aria-hidden]="isScreenSmall && !isSidebarOpen"
        [attr.inert]="isScreenSmall && !isSidebarOpen ? '' : null"
      >
        <app-sidebar
          (itemTapped)="closeSidebar()"
          class="flex h-full min-w-[64vw] sm:min-w-0"
        ></app-sidebar>
      </nav>

      <div
        class="flex min-h-0 min-w-0 flex-1 flex-col gap-1 overflow-hidden sm:gap-2"
      >
        <app-game-header
          *ngIf="!isScreenSmall"
          class="block shrink-0"
        ></app-game-header>

        <div class="relative min-h-0 w-full flex-1 overflow-hidden sm:pr-4">
          <div
            class="ll-game-surface absolute inset-y-0 left-0 right-0 sm:right-4 xl:right-0"
          ></div>
          <main
            class="relative flex h-full min-h-0 w-full flex-auto flex-col gap-2 overflow-hidden pt-2 sm:rounded-md sm:pt-6 2xl:rounded-b-none"
          >
            <div
              class="flex h-full min-h-0 w-full flex-col overflow-hidden pb-2 pl-2 sm:pb-6 sm:pl-6"
            >
              <ng-container *ngIf="bootstrapLoaded(); else bootstrapPending">
                <div
                  *ngIf="isResolvingAction"
                  class="ll-panel mb-2 flex shrink-0 items-center gap-3 px-4 py-3 pr-4 text-sm text-white sm:mr-4"
                >
                  <span
                    class="h-3 w-3 shrink-0 animate-pulse rounded-full bg-primary"
                    aria-hidden="true"
                  ></span>
                  <div class="min-w-0">
                    <p class="font-bold">Catching up offline progress</p>
                    <p class="ll-copy text-xs">
                      Resolving stored actions and rewards.
                    </p>
                  </div>
                </div>
                <div
                  *ngIf="idleCombatError() as resolutionError"
                  class="ll-panel mb-2 flex shrink-0 items-center justify-between gap-4 border border-danger/50 px-4 py-3 pr-4 text-sm text-white sm:mr-4"
                  role="alert"
                >
                  <div class="min-w-0">
                    <p class="font-bold">Offline progress paused</p>
                    <p class="ll-copy text-xs">{{ resolutionError }}</p>
                  </div>
                  <button
                    type="button"
                    class="ll-button-secondary shrink-0 px-3 py-1.5 text-xs"
                    (click)="retryOfflineProgress()"
                  >
                    Retry
                  </button>
                </div>
                <div class="min-h-0 flex-1 overflow-hidden">
                  <router-outlet></router-outlet>
                </div>
              </ng-container>
              <ng-template #bootstrapPending>
                <div
                  class="ll-panel mr-4 flex shrink-0 items-center justify-between gap-4 px-4 py-3 text-sm text-white"
                >
                  <div class="flex min-w-0 items-center gap-3">
                    <span
                      *ngIf="bootstrapLoading()"
                      class="h-3 w-3 shrink-0 animate-pulse rounded-full bg-primary"
                      aria-hidden="true"
                    ></span>
                    <div class="min-w-0">
                      <p class="font-bold">
                        {{
                          bootstrapError()
                            ? "Game state unavailable"
                            : "Entering the game"
                        }}
                      </p>
                      <p class="ll-copy text-xs">
                        {{ bootstrapError() || "Loading game data." }}
                      </p>
                    </div>
                  </div>
                  <button
                    *ngIf="bootstrapError()"
                    type="button"
                    class="ll-button-secondary shrink-0 px-3 py-1.5 text-xs"
                    (click)="retryBootstrap()"
                  >
                    Retry
                  </button>
                </div>
              </ng-template>
            </div>
          </main>
        </div>
      </div>

      <div
        *ngIf="isScreenLarge && chatLayout() === 'docked'"
        class="hidden h-full shrink-0 flex-col overflow-hidden transition-[width] duration-200 xl:flex"
        [ngClass]="isChatOpenDesktop ? 'w-96 2xl:w-[430px]' : 'w-12'"
      >
        <app-chat
          class="block min-h-0 flex-1"
          [collapsible]="true"
          [collapsed]="!isChatOpenDesktop"
          (collapsedChange)="isChatOpenDesktop = !$event"
        ></app-chat>
        <app-loot-tracker *ngIf="isChatOpenDesktop"></app-loot-tracker>
      </div>
    </div>

    <app-chat
      *ngIf="isScreenSmall"
      class="block shrink-0 overflow-hidden transition-[height] duration-200"
      [ngClass]="isMobileChatExpanded ? 'h-64' : 'h-[5.5rem]'"
      [mobileDock]="true"
      [mobileDockExpanded]="isMobileChatExpanded"
      (expand)="toggleMobileChat()"
    ></app-chat>
  </div>
</div>

<aside
  *ngIf="
    chatLayout() === 'floating' &&
    !isScreenSmall &&
    !(isScreenSmall && isSidebarOpen)
  "
  class="fixed bottom-20 left-3 right-3 z-40 max-h-[calc(100dvh-6rem)] overflow-hidden rounded-lg shadow-2xl shadow-black/70 transition-[height] duration-200 sm:bottom-4 sm:left-auto sm:right-4 sm:max-h-[calc(100dvh-2rem)] sm:w-[22rem] 2xl:right-6 2xl:w-96"
  [ngClass]="
    isFloatingDrawerOpen
      ? isFloatingDrawerTall
        ? 'h-[56rem]'
        : 'h-[28rem]'
      : 'h-12'
  "
>
  <app-chat
    class="block h-full w-full"
    [collapsible]="true"
    [collapsed]="!isFloatingDrawerOpen"
    [drawer]="true"
    [drawerTall]="isFloatingDrawerTall"
    (collapsedChange)="isFloatingDrawerOpen = !$event"
    (drawerTallChange)="isFloatingDrawerTall = $event"
  ></app-chat>
</aside>

<button
  *ngIf="chatLayout() === 'docked'"
  type="button"
  class="ll-floating-panel-trigger fixed bottom-4 right-6 z-40 hidden sm:flex xl:hidden"
  (click)="toggleChat()"
  aria-label="Toggle chat"
>
  <span>Chat</span>
  <span class="ll-floating-panel-trigger-icon" aria-hidden="true">
    <img src="icons/ActivePlus.svg" class="h-3.5 w-3.5" alt="" />
  </span>
</button>

<div
  *ngIf="isFloatingChatOpen && !isScreenSmall && !isScreenLarge"
  class="ll-screen-overlay fixed inset-0 z-40 xl:hidden"
  (click)="toggleChat()"
></div>

<aside
  *ngIf="isFloatingChatOpen && !isScreenSmall && !isScreenLarge"
  class="fixed inset-y-0 right-0 z-50 h-full w-[min(20rem,85vw)] transform transition-transform duration-200 sm:w-[min(24rem,85vw)] xl:hidden"
  [class.translate-x-0]="isFloatingChatOpen"
  [class.translate-x-full]="!isFloatingChatOpen"
  [attr.aria-hidden]="!isFloatingChatOpen"
  [attr.inert]="isFloatingChatOpen ? null : ''"
>
  <div class="ll-panel-strong relative h-full w-full max-w-full rounded-none">
    <app-chat class="block h-full w-full" (close)="toggleChat()"></app-chat>
  </div>
</aside>
