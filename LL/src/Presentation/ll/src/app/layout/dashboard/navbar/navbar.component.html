<div class="flex sm:h-24" *ngIf="currentCharacter() as currentCharacter">
  <app-character-badge
    class="z-10 -mr-12 hidden sm:block"
    [level]="currentCharacter?.level"
    [currentExperience]="currentCharacter?.experience"
    [maxExperience]="currentCharacter?.experienceUntilNextLevel"
  ></app-character-badge>
  <div
    class="border-gradient relative flex w-full items-center rounded-r-md sm:h-24 sm:py-[1px]"
  >
    <div class="flex h-full w-full bg-texture bg-auto sm:rounded-r-md sm:pl-12">
      <div class="hidden flex-col justify-center pl-4 sm:flex sm:space-y-2">
        <h2
          class="max-w-[5ch] truncate text-white sm:max-w-[8ch] lg:max-w-none"
        >
          {{ currentCharacter.name }}
        </h2>
        <div class="hidden sm:flex">
          <div
            class="flex h-6 min-w-20 items-center justify-between space-x-2 rounded-full bg-[#121216CC]"
            (click)="toggleFormat()"
          >
            <!-- <img src="core/currencies/Diamonds.svg" class="h-10 min-w-10" /> -->
            <label class="text-nowrap pl-2 pr-3 pt-[1px] text-primary"
              >{{
                useShortFormat
                  ? (currentCharacter.cinders | shortNumber)
                  : (currentCharacter.cinders | numberFormat)
              }}
              Cinders</label
            >
          </div>
          <div
            class="flex h-6 min-w-20 items-center justify-between space-x-2 rounded-full bg-[#121216CC]"
            (click)="toggleFormat()"
          >
            <!-- <img src="core/currencies/Coins.svg" class="h-10 min-w-10" /> -->
            <label class="text-nowrap pl-2 pr-3 pt-[1px] text-primary"
              >{{
                useShortFormat
                  ? (currentCharacter.soulstones | shortNumber)
                  : (currentCharacter.soulstones | numberFormat)
              }}
              Soulstones</label
            >
          </div>
        </div>
      </div>
      <div class="flex w-full items-end sm:ml-4 sm:items-start">
        <div class="flex w-full flex-col">
          <ng-container *ngIf="onlinePlayers; else justYou">
            <div class="hidden justify-end pr-4 text-white sm:flex">
              {{ onlinePlayers }} Online
            </div>
          </ng-container>
          <ng-template #justYou
            ><div class="hidden justify-end pr-4 text-white sm:flex">
              1 Online
            </div></ng-template
          >
          <!-- <div
            class="flex items-center hidden justify-between bg-transparent p-4 text-[#6D6D6D] sm:hidden"
            (click)="toggleList()"
            *ngIf="!showList"
          >
            <img src="core/button/Hamburger.png" class="cursor-pointer" />
            <h3 class="cursor-pointer pl-2 text-primary">{{ activeLabel }}</h3>
          </div> -->
          <div
            class="z-10 flex w-full flex-row justify-between text-nowrap border-t bg-texture text-[#a1a1a1] sm:items-center sm:justify-end sm:space-x-6 sm:rounded-md sm:border sm:border-none sm:bg-none sm:p-2"
          >
            <app-navbutton
              *ngFor="let button of navButtons"
              [link]="button.link"
              [label]="button.label"
              (click)="toggleList()"
              (itemTapped)="activeNavbar(button.label)"
            ></app-navbutton>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
