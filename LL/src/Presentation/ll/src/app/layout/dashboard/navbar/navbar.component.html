<div class="flex h-24">
  <app-character-badge
    class="z-10 -mr-12"
    [level]="12"
    [currentExperience]="100"
    [maxExperience]="100"
  ></app-character-badge>
  <div
    class="border-gradient relative flex h-24 w-full items-center rounded-r-md"
  >
    <div
      class="flex h-[calc(6rem-2px)] w-full justify-between rounded-r-md bg-texture bg-auto pl-12"
    >
      <div class="flex flex-col justify-center space-y-2 pl-4">
        <h2
          class="max-w-[5ch] truncate text-white sm:max-w-[8ch] lg:max-w-none"
        >
          {{ currentCharacter?.name }}
        </h2>
        <div class="hidden sm:flex">
          <div
            class="flex h-8 min-w-20 items-center justify-between space-x-2 rounded-full bg-[#121216CC]"
          >
            <img src="core/currencies/Diamonds.svg" class="h-10 min-w-10" />
            <label class="pl-1 pr-3 pt-[1px] text-primary">9</label>
          </div>
          <div
            class="flex h-8 min-w-20 items-center justify-between space-x-2 rounded-full bg-[#121216CC]"
          >
            <img src="core/currencies/Coins.svg" class="h-10 min-w-10" />
            <label class="pl-1 pr-3 pt-[1px] text-primary">5147</label>
          </div>
        </div>
      </div>
      <div class="ml-4 flex items-start pt-6 sm:items-center sm:pt-0">
        <div
          class="flex items-center justify-between bg-transparent p-4 text-[#6D6D6D] sm:hidden"
          (click)="toggleList()"
          *ngIf="!showList"
        >
          <img src="core/button/Hamburger.png" class="cursor-pointer" />
          <h3 class="cursor-pointer pl-2 text-primary">{{ activeLabel }}</h3>
        </div>
        <div
          class="flex flex-col items-center text-nowrap bg-transparent p-2 text-[#6D6D6D] sm:flex-row sm:space-x-6 sm:p-6"
          *ngIf="(showList && isScreenSmall) || !isScreenSmall"
        >
          <app-navbutton
            *ngFor="let button of navButtons"
            [link]="button.link"
            [label]="button.label"
            (click)="toggleList()"
            (itemTapped)="activeNavbar(button.label)"
          ></app-navbutton>
        </div>
        <div>
          <button (click)="logout()" class="pr-2 text-[#6D6D6D]">
            Log out
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div
  #menuContent
  class="right-0 top-full hidden flex-col space-y-2 rounded-md bg-[#121216CC] p-4 text-white"
>
  <app-navbutton link="character" label="Character"></app-navbutton>
  <app-navbutton link="#" label="Quests"></app-navbutton>
  <app-navbutton link="#" label="Town"></app-navbutton>
  <app-navbutton link="#" label="Dungeons"></app-navbutton>
  <app-navbutton link="#" label="Team"></app-navbutton>
  <app-navbutton link="#" label="Guild"></app-navbutton>
</div>
