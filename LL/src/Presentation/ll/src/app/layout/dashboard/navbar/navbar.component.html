<div class="flex h-24" *ngIf="currentCharacter() as currentCharacter">
  <app-character-badge
    class="z-10 -mr-12"
    [level]="currentCharacter?.level"
    [currentExperience]="currentCharacter?.experience"
    [maxExperience]="currentCharacter?.experienceUntilNextLevel"
  ></app-character-badge>
  <div
    class="border-gradient relative flex h-24 w-full items-center rounded-r-md py-[1px]"
  >
    <div
      class="flex h-full w-full rounded-r-md bg-texture bg-auto pl-10 sm:pl-12"
    >
      <div class="flex flex-col justify-center pl-4 sm:space-y-2">
        <h2
          class="max-w-[5ch] truncate text-white sm:max-w-[8ch] lg:max-w-none"
        >
          {{ currentCharacter?.name }}
        </h2>
        <div class="flex flex-col sm:flex-row">
          <div
            class="flex h-6 min-w-20 items-center justify-between space-x-2 rounded-full bg-[#121216CC]"
          >
            <!-- <img src="core/currencies/Diamonds.svg" class="h-10 min-w-10" /> -->
            <label class="text-nowrap pl-2 pr-3 pt-[1px] text-primary"
              >{{ currentCharacter?.cinders }} Cinders</label
            >
          </div>
          <div
            class="flex h-6 min-w-20 items-center justify-between space-x-2 rounded-full bg-[#121216CC]"
          >
            <!-- <img src="core/currencies/Coins.svg" class="h-10 min-w-10" /> -->
            <label class="text-nowrap pl-2 pr-3 pt-[1px] text-primary"
              >{{ currentCharacter?.soulstones }} Soulstones</label
            >
          </div>
        </div>
      </div>
      <div
        class="ml-4 flex w-full items-start justify-end pt-1 sm:items-start sm:pt-0"
      >
        <div class="flex flex-col">
          <div *ngIf="onlinePlayers" class="flex justify-end pr-4 text-white">
            {{ onlinePlayers }} Online
          </div>
          <div
            class="flex items-center justify-between bg-transparent p-4 text-[#6D6D6D] sm:hidden"
            (click)="toggleList()"
            *ngIf="!showList"
          >
            <img src="core/button/Hamburger.png" class="cursor-pointer" />
            <h3 class="cursor-pointer pl-2 text-primary">{{ activeLabel }}</h3>
          </div>
          <div
            class="z-10 flex flex-col text-nowrap rounded-md border bg-texture p-2 text-[#a1a1a1] sm:flex-row sm:items-center sm:space-x-6 sm:border-none sm:bg-none"
            *ngIf="(showList && isScreenSmall) || !isScreenSmall"
          >
            <app-navbutton
              *ngFor="let button of navButtons"
              [link]="button.link"
              [label]="button.label"
              (click)="toggleList()"
              (itemTapped)="activeNavbar(button.label)"
            ></app-navbutton>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
