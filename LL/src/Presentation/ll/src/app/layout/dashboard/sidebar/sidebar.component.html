<aside class="ll-sidebar-shell">
  <div class="ll-sidebar-panel bg-texture bg-auto">
    <div
      class="flex h-12 items-center justify-between border-b border-primary/15 px-4 sm:hidden"
    >
      <h3 class="text-primary">Legend's Legacy</h3>
      <button
        type="button"
        class="ll-button flex h-9 w-9 items-center justify-center p-0 text-xl leading-none text-primary"
        (click)="toggleSidebar()"
        aria-label="Close menu"
      >
        &times;
      </button>
    </div>

    <div
      class="flex flex-col gap-2 border-b border-primary/10 p-3 sm:border-b-0 sm:p-2"
    >
      <div
        *ngIf="currentCharacter() as character"
        class="grid grid-cols-2 gap-2 sm:hidden"
      >
        <button type="button" class="ll-currency-pill" (click)="toggleFormat()">
          <span class="truncate text-primary">
            {{
              useShortFormat
                ? (character.cinders | shortNumber)
                : (character.cinders | numberFormat)
            }}
            Cinders
          </span>
        </button>

        <button type="button" class="ll-currency-pill" (click)="toggleFormat()">
          <span class="truncate text-primary">
            {{
              useShortFormat
                ? (character.soulstones | shortNumber)
                : (character.soulstones | numberFormat)
            }}
            Soulstones
          </span>
        </button>
      </div>

      <div class="flex flex-col">
        <app-current-action
          *ngIf="displayCurrentAction"
          class="hidden w-full sm:block"
          (click)="navigateToAction(); toggleSidebar()"
        ></app-current-action>
        <app-current-dungeon></app-current-dungeon>
      </div>
    </div>

    <div
      class="flex flex-1 flex-col gap-1 overflow-y-auto overscroll-contain px-2 py-2 sm:border-t-0"
    >
      <div
        *ngFor="let section of sections; trackBy: trackSection"
        class="border-b border-primary/10 pb-1 last:border-b-0"
      >
        <div
          class="ll-section-label px-2 pb-1 pt-3"
        >
          {{ section.label }}
        </div>
        <div class="flex flex-col gap-1">
          <div
            *ngFor="let item of section.items; trackBy: trackItem"
            class="min-w-0"
          >
            <app-sidebar-item
              class="w-full text-light_gray"
              [item]="item"
              [routerLink]="item.route"
              [isActive]="isItemActive(item.route)"
              [notificationCount]="getNotificationCount(item.id)"
              (click)="onNavigate()"
            >
            </app-sidebar-item>
          </div>
        </div>
      </div>
    </div>
  </div>
</aside>
