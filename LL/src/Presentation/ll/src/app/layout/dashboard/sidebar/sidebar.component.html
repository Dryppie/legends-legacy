<aside class="border-gradient flex w-full sm:w-80 sm:rounded-tr-md">
  <div
    class="flex flex-auto flex-col overflow-hidden bg-texture bg-auto text-primary sm:mt-[1px] sm:rounded-tr-md"
  >
    <div class="flex flex-col p-2">
      <div
        *ngIf="currentCharacter() as character"
        class="flex gap-2 pb-1 sm:hidden"
      >
        <div
          class="flex h-6 min-w-20 items-center justify-between rounded-full bg-[#121216CC]"
          (click)="toggleFormat()"
        >
          <label class="text-nowrap pl-2 pr-3 pt-[1px] text-primary">
            {{
              useShortFormat
                ? (character.cinders | shortNumber)
                : (character.cinders | numberFormat)
            }}
            Cinders
          </label>
        </div>

        <div
          class="flex h-6 min-w-20 items-center justify-between rounded-full bg-[#121216CC]"
          (click)="toggleFormat()"
        >
          <label class="text-nowrap pl-2 pr-3 pt-[1px] text-primary">
            {{
              useShortFormat
                ? (character.soulstones | shortNumber)
                : (character.soulstones | numberFormat)
            }}
            Soulstones
          </label>
        </div>
      </div>

      <div class="flex flex-col">
        <app-current-action
          *ngIf="displayCurrentAction"
          class="w-full"
          (click)="navigateToAction(); toggleSidebar()"
        ></app-current-action>
        <app-current-dungeon></app-current-dungeon>
      </div>
    </div>

    <div
      class="flex flex-1 flex-col overflow-y-auto border-t border-gray sm:border-t-0"
    >
      <div
        *ngFor="let section of sections; trackBy: trackSection"
        class="border-b border-gray last:border-b-0"
      >
        <div class="px-4 pt-2 text-xs uppercase text-primary">
          {{ section.label }}
        </div>
        <div class="flex flex-col">
          <div
            *ngFor="let item of section.items; trackBy: trackItem"
            class="border-t border-gray first:border-t-0"
          >
            <app-sidebar-item
              class="w-full text-light_gray"
              [item]="item"
              [routerLink]="item.route"
              [isActive]="isItemActive(item.route)"
              (click)="onNavigate()"
            >
            </app-sidebar-item>
          </div>
        </div>
      </div>
    </div>
  </div>
</aside>
