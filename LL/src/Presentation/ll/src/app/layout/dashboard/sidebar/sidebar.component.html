<aside
  class="ll-sidebar-shell"
  [class.ll-sidebar-shell-compact]="sidebarLayout() === 'compact'"
>
  <div class="ll-sidebar-panel bg-texture bg-auto">
    <div
      class="flex h-12 items-center justify-between border-b border-primary/15 px-4 sm:hidden"
    >
      <h3 class="text-primary">Legend's Legacy</h3>
      <button
        type="button"
        class="ll-button flex h-9 w-9 items-center justify-center p-0 text-xl leading-none text-primary"
        (click)="toggleSidebar()"
        aria-label="Close menu"
      >
        &times;
      </button>
    </div>

    <app-current-action
      *ngIf="displayCurrentAction"
      class="hidden w-full border-b border-primary/10 p-2 sm:block"
      [class.ll-sidebar-detailed-only]="sidebarLayout() === 'compact'"
      (click)="navigateToAction(); toggleSidebar()"
    ></app-current-action>

    <div
      class="flex flex-1 flex-col gap-0.5 overflow-y-auto overscroll-contain px-2 py-2 sm:border-t-0"
      [class.ll-sidebar-detailed-only]="sidebarLayout() === 'compact'"
    >
      <div
        *ngFor="let section of sections; trackBy: trackSection"
        class="border-b border-primary/10 pb-1 last:border-b-0"
      >
        <div class="ll-section-label px-2 pb-1 pt-2.5 first:pt-1">
          {{ section.label }}
        </div>
        <div class="flex flex-col gap-0.5">
          <div
            *ngFor="let item of section.items; trackBy: trackItem"
            class="min-w-0"
          >
            <app-sidebar-item
              class="w-full text-light_gray"
              [item]="item"
              [routerLink]="item.route"
              [isActive]="isItemActive(item.route)"
              [tutorialAttention]="isTutorialDestination(item)"
              [notificationCount]="getSidebarItemNotificationCount(item.id)"
              (click)="onNavigate(item)"
            >
            </app-sidebar-item>
          </div>
        </div>
      </div>
    </div>

    <div
      *ngIf="sidebarLayout() === 'compact'"
      class="ll-sidebar-compact-nav hidden min-h-0 flex-1 flex-col overflow-y-auto overscroll-contain sm:flex"
    >
      <button
        *ngIf="displayCurrentAction; else compactCrest"
        type="button"
        class="group flex min-h-[4.5rem] shrink-0 flex-col items-center justify-center gap-1 border-b border-[var(--ll-color-border)] px-1 py-2 text-primary transition-colors hover:bg-[var(--ll-color-primary-soft)]"
        title="Go to current action"
        (click)="navigateToAction()"
      >
        <span class="relative h-9 w-9">
          <span
            class="absolute inset-0 overflow-hidden rounded-full border border-[var(--ll-color-border)] bg-[var(--ll-color-surface-soft)]"
            aria-hidden="true"
          >
            <span
              class="absolute inset-x-0 bottom-0 overflow-hidden bg-gradient-to-t from-primary/35 to-primary/15 transition-[height] duration-100 ease-linear"
              [style.height.%]="compactActionProgress()"
            >
              <span
                class="absolute inset-x-0 top-0 h-px bg-primary/70 shadow-[0_0_5px_var(--ll-color-primary)]"
              ></span>
            </span>
          </span>
          <span
            class="relative flex h-full w-full items-center justify-center text-primary"
            aria-hidden="true"
          >
            ✦
          </span>
          <span
            class="absolute right-0 top-0 z-10 h-2 w-2 rounded-full bg-[var(--ll-color-success)]"
            aria-hidden="true"
          ></span>
        </span>
        <span class="text-[9px] uppercase tracking-[0.12em]">Action</span>
      </button>

      <ng-template #compactCrest>
        <div
          class="flex min-h-[4.5rem] shrink-0 items-center justify-center border-b border-[var(--ll-color-border)]"
          aria-hidden="true"
        >
          <span
            class="flex h-10 w-10 items-center justify-center rounded-full border border-[var(--ll-color-border)] bg-[var(--ll-color-surface-soft)] text-primary"
          >
            ✦
          </span>
        </div>
      </ng-template>

      <div
        *ngFor="let section of sections; trackBy: trackSection"
        class="flex flex-col border-b border-primary/10 py-1 last:border-b-0"
      >
        <app-sidebar-item
          *ngFor="let item of section.items; trackBy: trackItem"
          class="block w-full"
          [item]="item"
          [compact]="true"
          [routerLink]="item.route"
          [isActive]="isItemActive(item.route)"
          [tutorialAttention]="isTutorialDestination(item)"
          [notificationCount]="getSidebarItemNotificationCount(item.id)"
          (click)="onNavigate(item)"
        ></app-sidebar-item>
      </div>
    </div>
  </div>
</aside>
