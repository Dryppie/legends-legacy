<aside class="border-gradient flex w-full sm:w-80 sm:rounded-tr-md">
  <div
    class="flex flex-auto flex-col overflow-hidden bg-texture bg-auto text-primary sm:mt-[1px] sm:rounded-tr-md"
  >
    <div class="flex p-2 sm:min-h-20">
      <app-current-action
        *ngIf="displayCurrentAction"
        class="w-full"
        (click)="toggleSidebar()"
        (click)="navigateToAction()"
      ></app-current-action>
    </div>
    <app-filter-tabs
      [tabs]="tabLabels"
      [activeTab]="activeTab"
      (tabSelected)="setActiveTab($event)"
    >
    </app-filter-tabs>
    <!-- Tab Content -->
    <div
      *ngFor="let tab of tabs"
      class="flex overflow-auto border-y border-gray sm:border-0"
    >
      <div *ngIf="activeTab === tab.label" class="flex w-full sm:flex-col">
        <div
          *ngFor="let item of tab.items"
          class="flex w-full justify-between border-r border-gray last:border-r-0 sm:border-r-0 sm:first:border-t sm:first:border-gray"
        >
          <app-sidebar-item
            (click)="toggleSidebar()"
            [item]="item"
            [routerLink]="item.route"
            (click)="navigateTo(item.id)"
            class="w-full text-light_gray"
            [isActive]="activeItem === item.id"
          ></app-sidebar-item>
        </div>
      </div>
    </div>
  </div>
</aside>
