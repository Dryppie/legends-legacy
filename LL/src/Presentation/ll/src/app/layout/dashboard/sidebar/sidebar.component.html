<aside class="border-gradient flex w-full sm:w-80 sm:rounded-tr-md">
  <div
    class="flex flex-auto flex-col overflow-hidden bg-texture bg-auto text-primary sm:mt-[1px] sm:rounded-tr-md"
  >
    <div class="flex flex-col p-2 sm:min-h-20">
      <div *ngIf="currentCharacter() as character" class="flex pb-1 sm:hidden">
        <div
          class="flex h-6 min-w-20 items-center justify-between space-x-2 rounded-full bg-[#121216CC]"
          (click)="toggleFormat()"
        >
          <!-- <img src="core/currencies/Diamonds.svg" class="h-10 min-w-10" /> -->
          <label class="text-nowrap pl-2 pr-3 pt-[1px] text-primary"
            >{{
              useShortFormat
                ? (character.cinders | shortNumber)
                : (character.cinders | numberFormat)
            }}
            Cinders</label
          >
        </div>
        <div
          class="flex h-6 min-w-20 items-center justify-between space-x-2 rounded-full bg-[#121216CC]"
          (click)="toggleFormat()"
        >
          <!-- <img src="core/currencies/Coins.svg" class="h-10 min-w-10" /> -->
          <label class="text-nowrap pl-2 pr-3 pt-[1px] text-primary"
            >{{
              useShortFormat
                ? (character.soulstones | shortNumber)
                : (character.soulstones | numberFormat)
            }}
            Soulstones</label
          >
        </div>
      </div>
      <app-current-action
        *ngIf="displayCurrentAction"
        class="w-full"
        (click)="toggleSidebar()"
        (click)="navigateToAction()"
      ></app-current-action>
    </div>
    <app-filter-tabs
      [tabs]="tabLabels"
      [activeTab]="activeTab"
      (tabSelected)="setActiveTab($event)"
    >
    </app-filter-tabs>
    <!-- Tab Content -->
    <div
      *ngFor="let tab of tabs"
      class="flex overflow-auto border-y border-gray sm:border-0"
    >
      <div *ngIf="activeTab === tab.label" class="flex w-full sm:flex-col">
        <div
          *ngFor="let item of tab.items"
          class="flex w-full justify-between border-r border-gray last:border-r-0 sm:border-r-0 sm:first:border-t sm:first:border-gray"
        >
          <app-sidebar-item
            (click)="toggleSidebar()"
            [item]="item"
            [routerLink]="item.route"
            (click)="navigateTo(item.id)"
            class="w-full text-light_gray"
            [isActive]="activeItem === item.id"
          ></app-sidebar-item>
        </div>
      </div>
    </div>
  </div>
</aside>
