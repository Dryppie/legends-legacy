<div
  class="group relative flex h-[52px] items-center justify-center border-l-2 bg-cover bg-center px-3 py-2 transition-colors hover:cursor-pointer hover:bg-zinc-300/5 sm:justify-start"
  [class.border-transparent]="!isActive"
  [class.border-primary]="isActive"
  [style.background-image]="
    isActive
      ? 'linear-gradient(to bottom, #00000095 50%, #1f150c95), url(core/Light.svg)'
      : 'none'
  "
>
  <span
    *ngIf="notificationCount > 0"
    class="absolute right-3 top-2 h-2.5 w-2.5 rounded-full border border-black bg-primary shadow-[0_0_8px_rgba(234,179,8,0.7)]"
    title="Pending activity"
  ></span>

  <div
    class="hidden h-10 w-10 shrink-0 items-center justify-center rounded-full sm:flex"
  >
    <app-profession-icon
      class="scale-[0.68]"
      [image]="item.icon"
    ></app-profession-icon>
  </div>
  <div class="flex min-w-0 flex-col sm:ml-3">
    <h3
      class="truncate text-center text-base leading-5 text-primary sm:text-start"
    >
      {{ item.title }}
    </h3>
    <small class="hidden truncate text-[11px] leading-4 text-zinc-200 sm:block">
      {{ item.description }}
    </small>
    <!-- Placeholder for additional content injected by child components -->
    <ng-content></ng-content>
  </div>
</div>
