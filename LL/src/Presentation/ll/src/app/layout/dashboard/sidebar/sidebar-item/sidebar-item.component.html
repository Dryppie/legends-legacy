<div
  class="flex h-[60px] items-center justify-center bg-cover bg-center p-3 shadow-md hover:cursor-pointer sm:justify-start sm:border-b"
  [style.background-image]="
    isActive
      ? 'linear-gradient(to bottom, #00000095 50%, #1f150c95), url(core/Light.svg)'
      : 'none'
  "
>
  <div
    class="hidden h-12 w-12 items-center justify-center rounded-full sm:flex"
  >
    <app-profession-icon
      class="scale-75"
      [image]="item.icon"
    ></app-profession-icon>
  </div>
  <div class="flex flex-col gap-1 sm:ml-4">
    <h3 class="text-center text-primary sm:text-start">{{ item.title }}</h3>
    <small class="hidden text-white sm:block">{{ item.description }}</small>
    <!-- Placeholder for additional content injected by child components -->
    <ng-content></ng-content>
  </div>
</div>
