<div
  class="ll-sidebar-nav-item group relative"
  [class.ll-sidebar-nav-item-active]="isActive"
>
  <app-notification-indicator
    class="absolute right-3 top-2"
    [count]="notificationCount"
  ></app-notification-indicator>

  <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full">
    <app-profession-icon
      class="scale-[0.68]"
      [image]="item.icon"
    ></app-profession-icon>
  </div>
  <div class="ml-3 flex min-w-0 flex-col">
    <h3
      class="truncate text-start text-[15px] leading-5 text-primary sm:text-base"
    >
      {{ item.title }}
    </h3>
    <small class="truncate text-[11px] leading-4 text-zinc-300">
      {{ item.description }}
    </small>
    <!-- Placeholder for additional content injected by child components -->
    <ng-content></ng-content>
  </div>
</div>
