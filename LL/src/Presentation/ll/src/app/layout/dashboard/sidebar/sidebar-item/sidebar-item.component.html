<div
  class="ll-sidebar-nav-item group relative overflow-hidden"
  [class.ll-sidebar-nav-item-active]="isActive"
  [class.ll-sidebar-nav-item-compact]="compact"
  [attr.title]="compact ? item.title : null"
>
  <app-notification-indicator
    class="absolute z-20"
    [ngClass]="compact ? 'right-1 top-1' : 'right-2.5 top-2'"
    [count]="notificationCount"
  ></app-notification-indicator>

  <div
    class="ll-sidebar-nav-icon relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full"
  >
    <app-profession-icon
      class="scale-[1.4]"
      [decorated]="false"
      [image]="item.icon"
    ></app-profession-icon>
  </div>
  <div
    class="ll-sidebar-nav-copy relative z-10 flex min-w-0 flex-col"
    [ngClass]="compact ? 'w-full items-center px-0' : 'ml-2 pr-5'"
  >
    <h3
      class="ll-sidebar-nav-title truncate"
      [ngClass]="
        compact
          ? 'w-full text-center text-[9px] uppercase tracking-[0.08em]'
          : 'text-start'
      "
    >
      {{ item.title }}
    </h3>
    <small *ngIf="!compact" class="ll-sidebar-nav-description truncate">
      {{ item.description }}
    </small>
    <!-- Placeholder for additional content injected by child components -->
    <ng-content></ng-content>
  </div>
</div>
