<div
  class="flex h-full w-full flex-col justify-between bg-texture sm:w-96 xl:rounded-tl-md 2xl:w-[430px]"
>
  <div class="relative flex h-full flex-col overflow-hidden">
    <div class="flex flex-wrap items-center gap-2 border-b border-primary p-2">
      <ng-container *ngFor="let room of visibleRooms">
        <button
          class="flex items-center justify-between gap-1 whitespace-nowrap text-nowrap rounded border border-zinc-300/30 px-2 py-1 text-sm text-neutral-300 hover:bg-zinc-300/30"
          [ngClass]="{
            'bg-primary/30 hover:bg-primary/40':
              activeRoomKey === room.contextKey &&
              activeRoomType === room.channelType,
          }"
          (click)="setChannel(room.channelType, room.contextKey)"
        >
          {{ room.label }}
        </button>
      </ng-container>
      <button
        class="hover:text-gold/70 p-1 px-2 text-xs uppercase text-white xl:hidden"
        aria-label="Close chat"
        (click)="close.emit()"
      >
        x
      </button>
    </div>

    <section
      class="flex flex-col gap-0.5 overflow-y-auto px-2 py-2 text-white"
      appStickyScroll
    >
      <ng-container *ngIf="filteredMessages as messages">
        <article
          *ngFor="let m of messages"
          class="group grid grid-cols-[3.4rem_minmax(0,1fr)] gap-1 rounded-sm border-l-2 bg-black/10 px-2 py-1.5 transition-colors hover:bg-white/[0.06]"
          [ngClass]="messageRowClasses(m)"
        >
          <time class="pt-0.5 text-[11px] leading-4 text-zinc-500">
            {{ m.sentAt | date: "shortTime" }}
          </time>

          <div class="min-w-0">
            <div
              class="flex min-w-0 flex-wrap items-center gap-x-1.5 gap-y-0.5"
            >
              <span
                class="rounded border px-1.5 py-0.5 text-[10px] font-semibold uppercase leading-none tracking-normal"
                [ngClass]="channelBadgeClasses(m)"
              >
                {{ channelLabel(m) }}
              </span>

              <ng-container
                *ngIf="m.channelType === 'System'; else playerSender"
              >
                <span class="text-xs font-semibold text-zinc-300">
                  {{ m.senderName }}
                </span>
              </ng-container>

              <ng-template #playerSender>
                <ng-container
                  *ngIf="m.channelType === 'Whisper'; else normalSender"
                >
                  <span class="text-[11px] uppercase text-zinc-500">
                    {{ m.senderId === characterId() ? "to" : "from" }}
                  </span>
                  <app-character-tag
                    [id]="whisperDisplayId(m)"
                    [name]="whisperDisplayName(m)"
                  ></app-character-tag>
                </ng-container>
              </ng-template>

              <ng-template #normalSender>
                <app-character-tag
                  [id]="m.senderId"
                  [name]="m.senderName"
                ></app-character-tag>
              </ng-template>
            </div>

            <p
              class="mt-0.5 break-words text-sm leading-5"
              [ngClass]="{
                'italic text-zinc-300': m.channelType === 'System',
                'text-zinc-100': m.channelType !== 'System',
              }"
            >
              {{ m.body }}
            </p>
          </div>
        </article>
      </ng-container>
    </section>
    <div
      *ngIf="draft.length > 160"
      class="absolute bottom-0 place-self-end bg-transparent pr-4 text-sm text-rose-700"
    >
      <div>{{ draft.length }}/200 characters</div>
    </div>
  </div>
  <div class="bg-black/40 p-1">
    <div class="flex">
      <input
        #chatInput
        type="text"
        placeholder="write here.."
        class="w-full rounded-md bg-transparent p-3 text-primary placeholder:text-zinc-300"
        [(ngModel)]="draft"
        (ngModelChange)="onDraftChange()"
        (keydown.enter)="send()"
        maxlength="200"
      />
      <app-regular-button
        class="p-1"
        (pressed)="send()"
        text="Send"
        [disabled]="!draft"
      />
    </div>
    <p *ngIf="sendError" class="px-3 pb-2 text-xs text-rose-400">
      {{ sendError }}
    </p>
  </div>
</div>
