<button
  routerLink="{{ link }}"
  routerLinkActive="text-primary"
  #rla="routerLinkActive"
  class="flex"
>
  <div class="hidden items-center sm:flex">
    <h3>{{ label }}</h3>
  </div>
  <div class="flex flex-col items-center sm:hidden">
    <img
      [src]="rla.isActive ? activeIcon : inactiveIcon"
      class="h-4 w-4 pb-[2px] transition-opacity"
      [class.opacity-100]="rla.isActive"
      [class.opacity-60]="!rla.isActive"
    />
    <h3
      class="text-[13px] font-medium transition-colors"
      [ngClass]="{
        'text-primary': rla.isActive,
      }"
    >
      {{ label }}
    </h3>
  </div>
</button>
