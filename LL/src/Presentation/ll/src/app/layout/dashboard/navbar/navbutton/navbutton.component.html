<button
  type="button"
  routerLink="{{ link }}"
  routerLinkActive="text-primary"
  #rla="routerLinkActive"
  class="flex min-w-0 justify-center px-2 py-2 sm:min-w-0 sm:px-0 sm:py-0"
  (click)="itemTapped.emit()"
>
  <div class="hidden items-center sm:flex">
    <h3>{{ label }}</h3>
  </div>
  <div class="flex flex-col items-center justify-center gap-1 sm:hidden">
    <img
      [src]="icon || (rla.isActive ? activeIcon : inactiveIcon)"
      class="h-4 w-4 transition-opacity"
      [class.opacity-100]="rla.isActive"
      [class.opacity-55]="!rla.isActive"
      alt=""
    />
    <h3
      class="text-[12px] font-medium leading-none transition-colors"
      [ngClass]="{
        'text-primary': rla.isActive,
      }"
    >
      {{ label }}
    </h3>
  </div>
</button>
