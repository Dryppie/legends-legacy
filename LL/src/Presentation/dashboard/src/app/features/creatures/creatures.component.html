<div class="flex h-full items-center p-6 text-white">
  <div class="flex h-full flex-col overflow-hidden">
    <h2 class="p-2 text-primary">Creatures</h2>
    <div class="overflow-y-auto">
      <div *ngFor="let creature of creatures">
        <div
          class="border-t border-light_gray p-2 hover:cursor-pointer"
          (click)="selectCreature(creature)"
          [ngClass]="{
            'bg-primary/30 text-white': selectedCreature === creature,
            'bg-transparent text-inherit hover:bg-zinc-300/10':
              selectedCreature !== creature,
          }"
        >
          {{ creature.name }}
        </div>
      </div>
    </div>
  </div>
  <div class="h-full">
    <!-- Creature Form -->
    <form
      *ngIf="selectedCreature"
      [formGroup]="creatureForm"
      class="bg-gray-800 rounded-lg p-6 shadow-lg"
    >
      <h2 class="mb-2 text-2xl font-semibold">{{ selectedCreature!.name }}</h2>

      <!-- Level and Experience Reward -->
      <div class="mb-4 grid grid-cols-2 gap-4">
        <div class="flex flex-col">
          <label class="font-medium">Level</label>
          <input
            type="number"
            class="rounded border border-light_gray bg-zinc-300/10 p-2"
            formControlName="level"
          />
        </div>

        <div class="flex flex-col">
          <label class="font-medium">Experience Reward</label>
          <input
            type="number"
            class="rounded border border-light_gray bg-zinc-300/10 p-2"
            formControlName="experienceReward"
          />
        </div>
      </div>

      <!-- Attributes -->
      <div class="grid grid-cols-6 gap-2">
        <div *ngFor="let attr of attributeKeys" class="flex flex-col">
          <label class="font-medium">{{ attr | splitCamelCase }}</label>
          <input
            type="number"
            class="rounded border border-light_gray bg-zinc-300/10 p-2"
            [formControlName]="attr"
          />
        </div>
      </div>

      <button
        type="button"
        (click)="saveCreature()"
        class="mt-4 rounded bg-blue-500 px-4 py-2 font-bold text-white hover:bg-blue-700"
      >
        Save Changes
      </button>
    </form>
  </div>
</div>
