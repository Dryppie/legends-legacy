<div class="flex h-full items-center p-6 text-white">
  <!-- Recipe List ---------------------------------------------------- -->
  <div class="flex h-full flex-col overflow-hidden">
    <div class="flex items-center justify-between pr-4">
      <h2 class="p-2 text-primary">Recipes - {{ recipes.length }}</h2>
      <button
        class="rounded bg-emerald-600 px-3 py-1 text-sm font-semibold hover:bg-emerald-700"
        (click)="newRecipe()"
      >
        + New
      </button>
    </div>

    <div class="overflow-y-auto">
      <div *ngFor="let recipe of recipes">
        <div
          class="border-t border-light_gray p-2 hover:cursor-pointer hover:bg-zinc-300/10"
          (click)="selectRecipe(recipe)"
          [ngClass]="{
            'bg-primary/30 text-white': selectedRecipe === recipe,
            'bg-transparent text-inherit hover:bg-zinc-300/10':
              selectedRecipe !== recipe,
          }"
        >
          {{ recipe.name }}
          <span class="text-gray-400 ml-2 text-xs"
            >({{ recipe.craftType }})</span
          >
        </div>
      </div>
    </div>
  </div>

  <!-- Recipe Form ---------------------------------------------------- -->
  <div class="ml-6 h-full w-[34rem]" *ngIf="recipeForm">
    <form
      [formGroup]="recipeForm"
      class="rounded-lg p-6"
      (ngSubmit)="saveRecipe()"
    >
      <h2 class="mb-2 text-2xl font-semibold">
        {{ isCreating ? "Create Recipe" : "Edit: " + recipeForm.value.name }}
      </h2>

      <!-- Core fields -->
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col">
          <label class="font-medium">Name</label>
          <input
            type="text"
            class="rounded border border-light_gray bg-zinc-300/10 p-2 hover:cursor-default focus:outline-none"
            formControlName="name"
            readonly
          />
        </div>
        <div class="flex flex-col">
          <label class="font-medium">Craft&nbsp;Type</label>
          <select
            class="rounded border border-light_gray bg-zinc-300/10 p-2"
            formControlName="craftType"
          >
            <option
              *ngFor="let c of craftTypes"
              [ngValue]="c"
              [innerText]="c"
              class="bg-black text-primary"
            ></option>
          </select>
        </div>

        <div class="flex flex-col">
          <label class="font-medium">Level&nbsp;Req.</label>
          <input
            type="number"
            class="rounded border border-light_gray bg-zinc-300/10 p-2"
            formControlName="levelRequirement"
          />
        </div>

        <div class="flex flex-col">
          <label class="font-medium">Output&nbsp;Qty</label>
          <input
            type="number"
            class="rounded border border-light_gray bg-zinc-300/10 p-2"
            formControlName="quantity"
          />
        </div>

        <div class="col-span-2 flex flex-col">
          <label class="font-medium">Output&nbsp;Item</label>
          <select
            class="rounded border border-light_gray bg-zinc-300/10 p-2"
            formControlName="item"
            [compareWith]="compareItems"
          >
            <option
              *ngFor="let it of craftableOutputItems"
              [ngValue]="it"
              class="bg-black text-primary"
            >
              {{ it.name }}
            </option>
          </select>
        </div>

        <div class="col-span-2 flex flex-col">
          <label class="font-medium">Item&nbsp;Type</label>
          <input
            type="text"
            class="rounded border border-light_gray bg-zinc-300/20 p-2"
            formControlName="itemType"
          />
        </div>
      </div>

      <!-- Materials -->
      <div class="mt-6">
        <h3 class="mb-2 text-lg font-semibold">Materials</h3>

        <div
          formArrayName="materials"
          *ngFor="let mat of materials.controls; let i = index"
          class="mb-2 grid grid-cols-4 gap-2"
        >
          <div [formGroupName]="i" class="contents">
            <select
              class="col-span-2 rounded border border-light_gray bg-zinc-300/10 p-2"
              formControlName="item"
              [compareWith]="compareItems"
            >
              <option
                *ngFor="let it of items"
                [ngValue]="it"
                class="bg-black text-primary"
              >
                {{ it.name }}
              </option>
            </select>
            <input
              type="number"
              class="rounded border border-light_gray bg-zinc-300/10 p-2"
              formControlName="quantity"
            />
            <button
              type="button"
              class="rounded bg-red-600 px-2 py-1 text-xs font-bold hover:bg-red-700"
              (click)="removeMaterial(i)"
            >
              ✕
            </button>
          </div>
        </div>

        <button
          type="button"
          class="mt-2 rounded bg-blue-500 px-3 py-1 text-sm font-semibold hover:bg-blue-600"
          (click)="addMaterial()"
        >
          + Add&nbsp;Material
        </button>
      </div>

      <!-- Save -->
      <button
        type="submit"
        class="mt-6 w-full rounded bg-blue-500 px-4 py-2 font-bold hover:bg-blue-600"
        [disabled]="recipeForm.invalid"
      >
        {{ isCreating ? "Create Recipe" : "Save Changes" }}
      </button>
    </form>
  </div>
</div>
