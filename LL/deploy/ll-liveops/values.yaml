replicaCount: 1
revisionHistoryLimit: 2
publicBaseUrl: ""

image:
  repository: ghcr.io/dryppie/ll-liveops
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

env: {}

# Keys must survive pod replacement. Use a dedicated claim for each environment.
dataProtection:
  existingClaim: ""
  size: 1Gi
  # null uses the cluster default; "" selects no storage class.
  storageClass: null
  accessModes:
    - ReadWriteOnce

podAnnotations: {}
podSecurityContext:
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

probes:
  host: ""
  startup:
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    periodSeconds: 10
  readiness:
    periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
