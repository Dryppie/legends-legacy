apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ll-liveops.fullname" . }}
  labels:
    {{- include "ll-liveops.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ll-liveops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ll-liveops.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if or .Values.publicBaseUrl .Values.probes.host }}
            - name: LiveOps__PublicBaseUrl
              value: {{ .Values.publicBaseUrl | default (printf "https://%s" .Values.probes.host) | quote }}
            {{- end }}
            {{- range $name, $item := .Values.env }}
            - name: {{ $name }}
              {{- $item | toYaml | nindent 14 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
              {{- with .Values.probes.host }}
              httpHeaders:
                - name: Host
                  value: {{ . | quote }}
              {{- end }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
              {{- with .Values.probes.host }}
              httpHeaders:
                - name: Host
                  value: {{ . | quote }}
              {{- end }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
              {{- with .Values.probes.host }}
              httpHeaders:
                - name: Host
                  value: {{ . | quote }}
              {{- end }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data-protection
              mountPath: /home/app/.aspnet/DataProtection-Keys
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: data-protection
          emptyDir: {}
        - name: temporary-files
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
