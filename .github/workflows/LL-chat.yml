name: Build LL Chat

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "releases/**"
    paths:
      - "LL-Chat/**"

env:
  buildConfiguration: Release

  major: 0
  minor: 1
  patch: ${{ github.run_number }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      tag: ${{ steps.set_tag.outputs.tag }}
      tagid: ${{ steps.set_tagid.outputs.tagid }}
      tagcommit: ${{ steps.set_tagid.outputs.tagcommit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout ll-infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ll-infrastructure
          token: ${{ secrets.PAT_TOKEN }}

      - name: Create version variable
        id: set_version
        shell: bash
        run: |
          # Read the version from the file
          version=$(cat deploy/versions/ll-chat.version)
          echo "Current version is $version"

          # Split the version into major, minor, and patch
          IFS='.' read -r major minor patch <<< "$version"

          # Increment the patch number
          patch=$((patch + 1))

          # Construct the new version
          new_version="${major}.${minor}.${patch}"
          echo "New version is $new_version"

          # Set the version as an output and environment variable
          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "version=$new_version" >> $GITHUB_ENV

      - name: Set tag variable
        id: set_tag
        shell: bash
        run: |
          echo "GITHUB_REF is $GITHUB_REF"
          version="${{ steps.set_version.outputs.version }}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tag="main-${version}"
          elif [[ "$GITHUB_REF" == refs/heads/releases/* ]]; then
            tag="release-${version}"
          else
            tag="${version}"
          fi
          echo "Tag is $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Set tagid and tagcommit
        id: set_tagid
        run: |
          echo "tagid=build-${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo "tagcommit=commit-${{ github.sha }}" >> $GITHUB_OUTPUT

  build:
    needs: setup
    uses: ./.github/workflows/backend-build.yml
    with:
      projects_filter: "LL-Chat/LL-Chat.sln"
      project_name: "LL-Chat"
      dotnet_version: "10.x"
      version: ${{ needs.setup.outputs.version }}

  docker:
    needs:
      - setup
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Publish and Push
        uses: ./.github/actions/build-and-push-docker
        with:
          tag: ${{ needs.setup.outputs.tag }}
          version: ${{ needs.setup.outputs.version }}
          buildScript: "build/build-ll-chat.ps1"
          token: ${{ secrets.GITHUB_TOKEN }}

  helm:
    needs:
      - setup
      - docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Helm Package and Push
        uses: ./.github/actions/build-and-push-helm
        with:
          version: ${{ needs.setup.outputs.version }}
          tag: ${{ needs.setup.outputs.tag }}
          workingDirectory: "LL-Chat/deploy/ll-chat"
          token: ${{ secrets.GITHUB_TOKEN }}
          imageName: "ll-chat"

  bump_version:
    runs-on: ubuntu-latest
    needs:
      - setup
      - helm
    steps:
      - name: Checkout ll-infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ll-infrastructure
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update version file
        shell: bash
        run: |
          # Update the version in the file
          echo "${{ needs.setup.outputs.version }}" > deploy/versions/ll-chat.version
          # Commit and push changes
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add deploy/versions/ll-chat.version
          git commit -m "Bump ll-chat version to ${{ needs.setup.outputs.version }}"
          git push
