name: Chat gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat:
    name: Chat build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore Chat solution
        run: dotnet restore "LL-Chat/LL-Chat.sln"

      - name: Build Chat solution
        run: dotnet build "LL-Chat/LL-Chat.sln" --configuration Release --no-restore

      - name: Reject high or critical .NET advisories
        run: dotnet restore "LL-Chat/LL-Chat.sln" -p:WarningsAsErrors=NU1903%3BNU1904
