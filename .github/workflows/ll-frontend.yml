name: Build LL Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "releases/**"
    paths:
      - "LL/src/Presentation/ll/**"

env:
  buildConfiguration: Release
  dockerfilePath: "LL/src/Presentation/ll/"
  major: 0
  minor: 0
  patch: ${{ github.run_number }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      tag: ${{ steps.set_tag.outputs.tag }}
      tagid: ${{ steps.set_tagid.outputs.tagid }}
      tagcommit: ${{ steps.set_tagid.outputs.tagcommit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout ll-infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ll-infrastructure
          token: ${{ secrets.PAT_TOKEN }}

      - name: Create version variable
        id: set_version
        shell: bash
        run: |
          # Read the version from the file
          version=$(cat deploy/versions/ll-frontend.version)
          echo "Current version is $version"

          # Split the version into major, minor, and patch
          IFS='.' read -r major minor patch <<< "$version"

          # Increment the patch number
          patch=$((patch + 1))

          # Construct the new version
          new_version="${major}.${minor}.${patch}"
          echo "New version is $new_version"

          # Set the version as an output and environment variable
          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "version=$new_version" >> $GITHUB_ENV

      - name: Set tag variable
        id: set_tag
        shell: bash
        run: |
          echo "GITHUB_REF is $GITHUB_REF"
          version="${{ steps.set_version.outputs.version }}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tag="main-${version}"
          elif [[ "$GITHUB_REF" == refs/heads/releases/* ]]; then
            tag="release-${version}"
          else
            tag="${version}"
          fi
          echo "Tag is $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Set tagid and tagcommit
        id: set_tagid
        run: |
          echo "tagid=build-${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo "tagcommit=commit-${{ github.sha }}" >> $GITHUB_OUTPUT

  docker:
    needs:
      - setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy recipes.json into build context
        shell: bash
        run: |
          mkdir -p LL/src/Presentation/ll/API/API.LL/Data
          cp LL/src/API/API.LL/Data/ LL/src/Presentation/ll/API/API.LL/Data/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        if: ${{ success() && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: set lower case owner name
        shell: bash
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Build Docker image using pwsh
        shell: pwsh
        run: |
          docker buildx build `
            --push `
            --file "LL/src/Presentation/ll/Dockerfile" `
            --build-arg name=ll `
            --build-arg BUILD_VERSION=${{ needs.setup.outputs.version }} `
            --tag ghcr.io/${{ env.OWNER_LC }}/ll-frontend:${{ needs.setup.outputs.TAG }} `
            --platform linux/amd64,linux/arm64 `
            LL/src/Presentation/ll

      - name: Helm Package and Push
        uses: ./.github/actions/build-and-push-helm
        with:
          version: ${{ needs.setup.outputs.version }}
          tag: ${{ needs.setup.outputs.tag }}
          workingDirectory: "LL/src/Presentation/ll/deploy/ll-frontend"
          token: ${{ secrets.GITHUB_TOKEN }}
          imageName: "ll-frontend"

  bump_version:
    runs-on: ubuntu-latest
    needs:
      - setup
      - docker
    steps:
      - name: Checkout ll-infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ll-infrastructure
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update version file
        shell: bash
        run: |
          # Update the version in the file
          echo "${{ needs.setup.outputs.version }}" > deploy/versions/ll-frontend.version
          # Commit and push changes
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add deploy/versions/ll-frontend.version
          git commit -m "Bump ll-frontend version to ${{ needs.setup.outputs.version }}"
          git push
