name: Backend gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish backend artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore and audit main solution
        run: dotnet restore "LL/LegendsLegacy.sln" -p:WarningsAsErrors=NU1903%3BNU1904

      - name: Build main solution
        run: dotnet build "LL/LegendsLegacy.sln" --configuration Release --no-restore

      - name: Publish API and worker from compiled outputs
        shell: pwsh
        run: ./build/build-ll.ps1 -SkipDockerBuild -NoBuild

      - name: Upload compiled test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ll-backend-tests
          retention-days: 1
          if-no-files-found: error
          path: LL/tests/EssenceSystem.Tests/bin/Release/net10.0

      - name: Upload published backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ll-backend-publish
          retention-days: 1
          if-no-files-found: error
          path: |
            artifacts/api.ll
            artifacts/worker.ll

  tests:
    name: Tests / Correctness suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Download compiled backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ll-backend-tests
          path: LL/tests/EssenceSystem.Tests/bin/Release/net10.0

      - name: Run correctness suite
        shell: pwsh
        run: >-
          dotnet vstest
          "LL/tests/EssenceSystem.Tests/bin/Release/net10.0/EssenceSystem.Tests.dll"
          --Logger:"trx;LogFileName=tests.trx"
          --ResultsDirectory:"TestResults/tests"

      - name: Add test timings to job summary
        if: always()
        shell: pwsh
        run: >-
          ./build/report-test-timings.ps1
          -ResultsDirectory "TestResults/tests"
          -Title "Correctness suite timings"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          retention-days: 7
          if-no-files-found: warn
          path: TestResults/tests
