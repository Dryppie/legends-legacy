name: Backend gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Main backend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore main solution
        run: dotnet restore "LL/LegendsLegacy.sln"

      - name: Build main solution
        run: dotnet build "LL/LegendsLegacy.sln" --configuration Release --no-restore

      - name: Run main test suite
        run: dotnet test "LL/tests/EssenceSystem.Tests/EssenceSystem.Tests.csproj" --configuration Release --no-build --no-restore

      - name: Reject high or critical .NET advisories
        run: dotnet restore "LL/LegendsLegacy.sln" -p:WarningsAsErrors=NU1903%3BNU1904
