name: Backend PR gate

on:
  pull_request:
    paths:
      - "LL/**"
      - "!LL/src/Presentation/ll/**"
      - ".github/workflows/backend-gate.yml"
      - ".github/workflows/backend-pr.yml"
      - "build/build-ll.ps1"
      - "build/report-test-timings.ps1"

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/backend-gate.yml
    with:
      run_full_balance: false
