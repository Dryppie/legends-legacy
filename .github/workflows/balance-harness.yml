name: Balance harness

on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: balance-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect balance impact
    runs-on: ubuntu-latest
    outputs:
      harness: ${{ steps.impact.outputs.harness }}
      smoke: ${{ steps.impact.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify impact policy
        shell: pwsh
        run: ./build/test-balance-impact.ps1
      - name: Classify changes
        id: impact
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: >-
          ./build/get-balance-impact.ps1 -Base $env:BASE -Head $env:HEAD
          -PullRequest:($env:EVENT -eq 'pull_request')
          -Force:($env:EVENT -eq 'workflow_dispatch')

  smoke:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    name: Idle workflow / advisory balance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Verify harness correctness and parity
        shell: pwsh
        run: ./build/run-tests.ps1 -Filter 'Category=BalanceHarness'

      - name: Run repeatability, replay and draft evaluation smoke
        if: needs.changes.outputs.smoke == 'true'
        timeout-minutes: 3
        shell: pwsh
        run: ./build/smoke-balance.ps1 -NoBuild -SamplesPerCell 3 -OutputDirectory TestResults/balance/ci-smoke

      - name: Verify First Hunt cohort and group replay
        if: needs.changes.outputs.smoke == 'true'
        timeout-minutes: 3
        shell: pwsh
        run: >-
          ./build/smoke-balance.ps1 -NoBuild -SamplesPerCell 3
          -SuitePath LL/tools/BalanceHarness/Fixtures/idle-first-hunt.json
          -GoalsPath LL/tools/BalanceHarness/Fixtures/idle-first-hunt-goals.json
          -OutputDirectory TestResults/balance/ci-first-hunt

      - name: Upload harness evidence and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-harness-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            TestResults/balance/ci-smoke
            TestResults/balance/ci-first-hunt
            TestResults/tests
