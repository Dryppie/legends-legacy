name: "Helm Package and Push Action"
description: "Packages Helm charts and pushes them to a container registry."

inputs:
  version:
    description: "Helm chart version."
    required: true
  tag:
    description: "Application version."
    required: true
  workingDirectory:
    description: "Working directory."
    required: false
    default: "LL/deploy"
  token:
    description: "GitHub token for authentication"
    required: true

runs:
  using: "composite"
  steps:
    - name: Helm Login
      if: ${{ success() && github.event_name != 'pull_request' }}
      shell: bash
      run: |
        echo "${{ inputs.token }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

    - name: Package Helm Chart
      shell: bash
      run: |
        helm package ${{ inputs.workingDirectory }} \
          --version ${{ inputs.version }} \
          --app-version ${{ inputs.tag }}

    - name: Push Helm Chart
      shell: bash
      run: |
        helm push ./ll-backend-${{ inputs.version }}.tgz oci://ghcr.io/${{ github.repository }}/helm-charts
