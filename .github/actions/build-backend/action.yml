name: Build Workflow

on:
  workflow_call:
    inputs:
      build_configuration:
        description: "Build configuration (e.g., Debug or Release)."
        required: false
        default: "Release"
        type: string
      projects_filter:
        description: "Path or pattern to the projects to restore and build."
        required: true
        type: string
      test_projects_filter:
        description: "Path or pattern to the test projects."
        required: true
        type: string
      test_run_settings_file:
        description: "Path to the test run settings file."
        required: false
        type: string
      project_name:
        description: "Project name."
        required: true
        type: string
      version:
        description: "Version number."
        required: false
        default: ""
        type: string

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Restore ${{ inputs.project_name }}
        run: |
          dotnet restore "${{ inputs.projects_filter }}"

      - name: Build ${{ inputs.project_name }}
        run: |
          dotnet build "${{ inputs.projects_filter }}" \
            --configuration "${{ inputs.build_configuration }}" \
            --no-restore \
            -p:Version="${{ inputs.version }}" \
            -p:InformationalVersion="${{ inputs.version }} ${{ github.sha }})"

      # - name: Run ${{ inputs.project_name }} Tests
      #   run: |
      #     dotnet test "${{ inputs.test_projects_filter }}" \
      #       --configuration "${{ inputs.build_configuration }}" \
      #       --no-restore \
      #       --no-build \
      #       ${{ inputs.test_run_settings_file && "--settings " + inputs.test_run_settings_file || '' }} \
      #       --collect:"XPlat Code Coverage" \
