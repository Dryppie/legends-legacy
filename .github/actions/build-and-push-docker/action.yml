name: "Docker Publish and Push Action"
description: "Builds Docker images and pushes them to a container registry."

inputs:
  tag:
    description: "Image tag."
    required: true
  version:
    description: "Version."
    required: true
  buildScript:
    description: "Path to the build script."
    required: true
  usePrebuiltArtifacts:
    description: "Use previously published artifacts instead of publishing again."
    required: false
    default: "false"
  token:
    description: "GitHub token for authentication"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Print Docker images
      shell: pwsh
      run: |
        Write-Host "--images--"
        docker images

    - name: Docker Login
      if: ${{ success() && github.event_name != 'pull_request' }}
      shell: bash
      run: |
        echo "${{ inputs.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: set lower case owner name
      shell: bash
      run: |
        echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
      env:
        OWNER: "${{ github.repository_owner }}"

    - name: Docker Build and Push by PowerShell
      if: ${{ success() && github.event_name != 'pull_request' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        DOCKER_REGISTRY: "ghcr.io/${{ env.OWNER_LC }}/"
        IMAGE_TAG: "${{ inputs.tag }}"
        VERSION: "${{ inputs.version }}"
        BUILD_VERSION: "${{ inputs.version }}"
      run: |
        $DebugPreference = 'Continue'
        pwd
        if ("${{ inputs.usePrebuiltArtifacts }}" -eq "true") {
          & "${{ inputs.buildScript }}" -SkipPublish
        }
        else {
          & "${{ inputs.buildScript }}"
        }
